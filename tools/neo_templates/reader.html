.paper::before { content: ""; position: absolute; inset: -40px; z-index: -1; pointer-events: none; translate: -24px 30px;
  border: 40px solid transparent; border-image: url(__NEO_SHADOW_PAPER__) 120 fill / 120px / 60px stretch; }
:root[data-theme="dark"] .paper {

header { display: flex; align-items: center; gap: var(--s-2); min-height: var(--row); padding-top: var(--s-2); }

.guide { padding-top: clamp(16px, 4vw, 52px); }

.routes p { margin: 0; }

.search { position: relative; }

.back { border: 0; background: none; padding: 4px 0; margin: 0 0 8px; cursor: pointer; color: var(--ink-2); font: inherit; }

abbr[title] { text-decoration: underline dotted var(--ink-3); text-underline-offset: 3px; cursor: help; }

/* paper */
.sheet { border-left: 1px solid var(--rule); padding-left: clamp(16px, 2.4vw, 40px); min-height: 60vh; }
@media (max-width: 1180px) { .sheet { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 20px; } }
.idline { display: flex; align-items: center; gap: 8px; margin: 8px 0 16px; flex-wrap: wrap; }

.progress thead th { color: var(--ink-2); font-weight: 600; border-bottom-color: var(--rule-strong); }
.progress tbody th { font-weight: 600; }
.pick { width: 100%; border-collapse: collapse; }
.pick td { padding: 6px 4px; border-top: 1px solid var(--rule); }

/* ---------- search ---------- */
const q = document.getElementById("q"), hits = document.getElementById("hits");
function search(text) {
  const s = L(), v = text.trim().toUpperCase(); if (!v) { hits.hidden = true; return; }
  const out = [];
  const num = v.match(/^(\d*\.?\d+)\s*(µM|UM)?$/);
  if (num) {
    const p = +num[1], at = T.map((t, i) => i).filter((i) => T[i][2] != null && T[i][2] <= p && T[i][3] >= p);
    hits.innerHTML = at.length ? `<button data-period="${p}">${esc(s.periodHit(p.toPrecision(3), at.length))}</button>` : `<div class="empty">${s.noHit}</div>`;
    hits.hidden = false;

    return;
  }
  if (byId.has(v)) out.push([byId.get(v), ""]);
  if (v.startsWith("DVD") || v.includes("-")) {
    for (const [id, i] of byId) { if (out.length >= 12) break; if (id.toUpperCase().includes(v) && id.toUpperCase() !== v) out.push([i, ""]); }
  }
  const seen = new Set(out.map((o) => o[0]));
  for (const [spec, list] of specIndex) {
    if (seen.size >= 24) break;
    if (!spec.startsWith(v)) continue;
    for (const i of list) { if (!seen.has(i)) { seen.add(i); out.push([i, s.specHit + " " + spec]); } if (out.length >= 24) break; }
  }
  const name = (i) => (T[i][1] === 0 ? `${s.kinds[0]} ${f3(T[i][2])} µm` : s.kinds[T[i][1]] + (lang === "zh" ? "，" : ", ") + s.label(T[i][0], T[i][1]));
  hits.innerHTML = out.length ? out.map(([i, why]) => `<button data-i="${i}"><code>${esc(T[i][0])}</code><br><span class="small">${why ? esc(why) + (lang === "zh" ? "：" : ": ") : ""}${esc(name(i))}</span></button>`).join("") : `<div class="empty">${s.noHit}</div>`;
