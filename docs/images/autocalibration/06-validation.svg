<text x="122" y="95" font-size="18" font-weight="700">旧计时 · grid1</text>
<text x="86" y="122" class="small muted">峰峰 0.308° / RMS 0.093°</text>
<line x1="370" y1="88" x2="397" y2="88" stroke="#0f766e" stroke-width="2.6" stroke-linecap="round"/>
<text x="406" y="95" font-size="18" font-weight="700">加扫描修正 · grid2</text>
<text x="370" y="122" class="small muted">峰峰 0.138° / RMS 0.040°</text>
<line x1="654" y1="88" x2="681" y2="88" stroke="#2563eb" stroke-width="3.6" stroke-linecap="round"/>
<text x="690" y="95" font-size="18" font-weight="700">新盘 · 纯计时 grid3</text>
<text x="654" y="122" class="small muted">峰峰 0.106° / RMS 0.032°</text>
<text x="86" y="149" font-size="16" class="muted">转角偏差 / °（各曲线扣除整体转角）</text>
