<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="validation-title validation-desc">
<title id="validation-title">独立实盘验证：三张网格盘的转角偏差随半径的变化</title>
<desc id="validation-desc">数据来自 disc-probe 提交 813c5817c5bb4d2cd7fced0d918182c0161e6578 的 evidence/gridscan 原始 CSV。各扫描按 2 毫米径向分箱取中位数，再跨扫描取中位数。绘图扣除了每条汇总曲线的均值，RMS 与 evidence/eval_grid.py 的均值中心化定义一致。旧计时 grid1 为橙色，6 次扫描，峰峰 0.308 度，RMS 0.093 度。加扫描修正的 grid2 为青绿色，4 次扫描，峰峰 0.138 度，RMS 0.040 度；缺少观测的分箱不连线。换参考点重新计时后刻在新空白盘上的 grid3 为蓝色，8 次扫描，未输入任何扫描修正，峰峰 0.106 度，RMS 0.032 度。该结果来自 GH70N 光驱与 RITEKF1 DVD-R，不是所有设备或每一个字节的精度保证。</desc>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#162338} .muted{fill:#526176} .tick{font-size:16px} .small{font-size:16px} .grid{stroke:#e2e8f0;stroke-width:1}</style>
<rect width="960" height="500" rx="18" fill="#f8fafc"/>
<text x="36" y="34" font-size="25" font-weight="700">独立验证：新盘上的径向弯曲是否消失？</text>
<text x="36" y="61" font-size="17" class="muted">实测转角随半径变化；越接近水平，图案从内到外的弯曲越小。</text>
