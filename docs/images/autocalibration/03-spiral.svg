    <circle cx="220" cy="280" r="5" fill="#526176"/>
    <line x1="220" y1="280" x2="370" y2="280" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="220" y1="228" x2="370" y2="228" stroke="#2563eb" stroke-width="1.8" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
    <line x1="220" y1="235" x2="220" y2="271" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 3"/>
    <line x1="370" y1="235" x2="370" y2="274" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 3"/>
    <rect x="284" y="207" width="30" height="23" rx="5" fill="#ffffff"/>
    <text x="299" y="224" font-size="18" font-style="italic" text-anchor="middle" fill="#2563eb">r</text>
    <line x1="220" y1="301" x2="262" y2="301" stroke="#2563eb" stroke-width="1.7" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
    <text x="240" y="326" font-size="18" text-anchor="middle" fill="#2563eb">r₀</text>
    <line x1="316" y1="286" x2="316" y2="307" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="3 3"/>
    <line x1="343" y1="286" x2="343" y2="307" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="3 3"/>
    <line x1="316" y1="310" x2="343" y2="310" stroke="#ea580c" stroke-width="2" marker-start="url(#arrow-orange)" marker-end="url(#arrow-orange)"/>
    <rect x="306" y="320" width="69" height="27" rx="5" fill="#ffffff"/>
    <text x="340" y="340" font-size="17" text-anchor="middle" fill="#ea580c">轨距 p</text>
    <circle cx="370" cy="280" r="5.5" fill="#0f766e"/>
    <text x="44" y="466" font-size="16" fill="#526176">从起点到绿色点：累计 n 个通道位</text>
    <text x="480" y="119" font-size="18" font-weight="700">同一小段轨道，两种面积</text>
    <circle cx="523" cy="180" r="35" fill="#dbeafe"/>
    <circle cx="523" cy="180" r="28" fill="#ffffff"/>
    <path d="M523 180L556 180" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
    <text x="534" y="170" font-size="16" fill="#2563eb">r</text>
    <text x="507" y="137" font-size="16" fill="#2563eb">dr</text>
    <line x1="523" y1="145" x2="523" y2="152" stroke="#2563eb" stroke-width="2"/>
    <text x="580" y="166" font-size="19">薄环面积：2πr dr</text>
    <text x="580" y="198" font-size="19">轨道带面积：p ds</text>
    <text x="580" y="226" font-size="17" fill="#526176">其中 ds = b dn</text>
    <line x1="480" y1="247" x2="916" y2="247" stroke="#e2e8f0"/>
    <text x="698" y="283" font-size="23" text-anchor="middle">2πr dr ≈ p b dn</text>
    <text x="698" y="316" font-size="17" text-anchor="middle" fill="#526176">从 r₀ 到 r 积分，从 0 到 n 计数</text>
    <text x="698" y="349" font-size="22" text-anchor="middle">π(r² − r₀²) ≈ p b n</text>
    <rect x="484" y="366" width="428" height="59" rx="10" fill="#ecfdf5" stroke="#99d3c4"/>
    <text x="698" y="402" font-size="25" text-anchor="middle" font-weight="700" fill="#0f766e">r² = r₀² + pbn / π</text>
    <text x="484" y="449" font-size="16" fill="#526176">上式在薄轨模型内成立；n 不是用户字节数 × 8。</text>
    <text x="484" y="476" font-size="16" fill="#526176">编码、同步、纠错开销也占用轨道长度。</text>
    <text x="28" y="525" font-size="17" fill="#526176">示意：只画 4 圈，实际光盘有数万圈；轨距和小环厚度均大幅夸张。</text>
  </g>
</svg>
