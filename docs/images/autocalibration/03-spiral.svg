<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
  <title id="title">恒定轨距螺旋如何把通道位地址变成半径</title>
  <desc id="desc">左图把实际有数万圈的光盘螺旋夸张成四圈，标出起始半径 r0、某处半径 r，以及相邻两圈之间的轨距 p。右图以薄环面积等于轨道带面积，推导 2πr dr 约等于 p b dn，积分后得到薄轨模型 r² 等于 r0² 加 pbn 除以 π。n 是包含编码、同步和纠错开销的通道位数，不是用户字节数乘八。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker>
  </defs>
  <rect width="960" height="550" rx="18" fill="#f8fafc"/>
  <g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" fill="#162338">
    <text x="28" y="38" font-size="25" font-weight="700">从一条螺旋，到半径与地址的公式</text>
    <text x="28" y="67" font-size="17" fill="#526176">每绕一圈，半径增加 p；每前进一个通道位，沿轨长度增加 b。</text>
    <rect x="24" y="88" width="418" height="405" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="460" y="88" width="476" height="405" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="44" y="119" font-size="18" font-weight="700">同一条轨道，连续地向外绕</text>
    <circle cx="220" cy="280" r="150" fill="#eff6ff"/>
    <circle cx="220" cy="280" r="42" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
