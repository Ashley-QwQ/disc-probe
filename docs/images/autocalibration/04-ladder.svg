<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">阶梯标定如何解除整数圈歧义</title>
  <desc id="desc">同一余角 80 度可对应累计 80、440、800、1160 度。模型预测 797 度时，最近分支是 800 度，即增加两整圈。下图示意从参考地址附近逐渐向两侧扩展测量。若预测误差绝对值加测量误差绝对值小于 180 度，最近分支是正确分支；代码中的 25 度只是预测标准差的工程门槛，不是实际误差上限或正确性保证。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker>
  </defs>
  <rect width="960" height="560" rx="18" fill="#f8fafc"/>
  <g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" fill="#162338">
    <text x="28" y="38" font-size="25" font-weight="700">相位只报余角，阶梯帮我们数整圈</text>
    <text x="28" y="67" font-size="17" fill="#526176">先在近处建立预测，再根据不确定度把测量范围伸向远处。</text>
    <rect x="24" y="88" width="912" height="210" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="48" y="120" font-size="18" font-weight="700">测得余角 80°，但累计角度是哪一个？</text>
    <text x="650" y="120" font-size="16" fill="#526176">相邻候选相差 360°</text>
    <line x1="100" y1="214" x2="866" y2="214" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="515" y="174" width="120" height="83" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/>
    <line x1="155" y1="207" x2="155" y2="222" stroke="#526176" stroke-width="2"/>
    <line x1="365" y1="207" x2="365" y2="222" stroke="#526176" stroke-width="2"/>
    <line x1="785" y1="207" x2="785" y2="222" stroke="#526176" stroke-width="2"/>
    <text x="155" y="195" font-size="21" text-anchor="middle">80°</text>
    <text x="365" y="195" font-size="21" text-anchor="middle">440°</text>
    <text x="575" y="201" font-size="23" font-weight="700" text-anchor="middle" fill="#0f766e">800°</text>
    <text x="785" y="195" font-size="21" text-anchor="middle">1160°</text>
    <text x="155" y="245" font-size="17" text-anchor="middle" fill="#526176">k = 0</text>
    <text x="365" y="245" font-size="17" text-anchor="middle" fill="#526176">k = 1</text>
    <text x="575" y="246" font-size="17" text-anchor="middle" fill="#0f766e">k = 2</text>
    <text x="785" y="245" font-size="17" text-anchor="middle" fill="#526176">k = 3</text>
    <circle cx="575" cy="216" r="5.5" fill="#0f766e"/>
    <text x="573" y="150" font-size="18" text-anchor="middle" fill="#ea580c">预测 797°</text>
    <path d="M573 155L573 172" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="480" y="281" font-size="18" text-anchor="middle">选最近分支：80° + 360° × round((797° − 80°) / 360°) = 800°</text>
    <rect x="24" y="314" width="544" height="196" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="586" y="314" width="350" height="196" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="48" y="345" font-size="18" font-weight="700">近 → 远：逐步扩展测量范围</text>
    <line x1="350" y1="365" x2="350" y2="474" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="350" y="370" font-size="15" text-anchor="middle" fill="#526176">参考 R</text>
    <text x="48" y="397" font-size="17">先测附近</text>
    <line x1="204" y1="391" x2="535" y2="391" stroke="#e2e8f0"/>
    <line x1="331" y1="391" x2="375" y2="391" stroke="#0f766e" stroke-width="3"/>
    <circle cx="331" cy="391" r="5" fill="#0f766e"/><circle cx="375" cy="391" r="5" fill="#0f766e"/>
    <circle cx="350" cy="391" r="4" fill="#162338"/>
    <text x="48" y="433" font-size="17">拟合后向外</text>
    <line x1="204" y1="427" x2="535" y2="427" stroke="#e2e8f0"/>
    <line x1="284" y1="427" x2="419" y2="427" stroke="#2563eb" stroke-width="3"/>
    <circle cx="284" cy="427" r="5" fill="#2563eb"/><circle cx="419" cy="427" r="5" fill="#2563eb"/>
    <circle cx="350" cy="427" r="4" fill="#162338"/>
    <text x="48" y="469" font-size="17">再测远处</text>
    <line x1="204" y1="463" x2="535" y2="463" stroke="#e2e8f0"/>
    <line x1="213" y1="463" x2="526" y2="463" stroke="#2563eb" stroke-width="3"/>
    <circle cx="213" cy="463" r="5" fill="#2563eb"/><circle cx="526" cy="463" r="5" fill="#2563eb"/>
    <circle cx="350" cy="463" r="4" fill="#162338"/>
    <text x="48" y="495" font-size="16" fill="#526176">仅示意范围增长；不是实测台阶位置。</text>
    <text x="608" y="345" font-size="18" font-weight="700">什么时候能选对？</text>
    <text x="608" y="380" font-size="18">|预测误差| + |测量误差|</text>
    <text x="608" y="410" font-size="20" fill="#0f766e">&lt; 180°（充分条件）</text>
    <line x1="608" y1="429" x2="914" y2="429" stroke="#e2e8f0"/>
    <text x="608" y="459" font-size="17" fill="#ea580c">25° 是预测标准差的门槛，</text>
    <text x="608" y="486" font-size="17" fill="#526176">不是误差上限或正确性保证。</text>
    <text x="28" y="541" font-size="17" fill="#526176">新台阶加入后重新拟合，也检查所有旧点；异常大的残差会触发停止。</text>
  </g>
</svg>
