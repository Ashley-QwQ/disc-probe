<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disc Lab</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="lab.css">
<script>
  // the theme before the first paint: the viewer's own choice, else the system's (lamp and header switch it)
  try { const t = localStorage.getItem("disclab-theme"); document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "paper"); } catch { document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "paper"; }
  // motion, as disc-probe: this page's own setting, else the system's; ?motion forces it on
  (function () { var m = null; try { m = localStorage.getItem("disclab-motion"); } catch (e) {}
    var on = /[?&]motion(\b|=)/.test(location.search) || m === "on" || (m !== "off" && !matchMedia("(prefers-reduced-motion: reduce)").matches);
    document.documentElement.dataset.motion = on ? "on" : "off"; })();
</script>
<script type="module" src="lab.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></symbol>
  <symbol id="i-set" viewBox="0 0 24 24"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></symbol>
</svg>
<header class="top">
  <button class="btn back" id="back" type="button" hidden><svg class="icon"><use href="#i-back"/></svg></button>
  <h1 class="wordmark" aria-label="Disc Lab"><span aria-hidden="true">DISC-</span><span class="lab" aria-hidden="true">LAB</span><small id="ver"></small></h1>
  <nav class="tools">
    <button class="btn btn-lang" id="lang" type="button">EN</button>
    <button class="btn btn-icon" id="theme" type="button"><svg class="icon"><use href="#i-theme"/></svg></button>
    <button class="btn btn-icon" id="settings" type="button" aria-haspopup="true" aria-expanded="false"><svg class="icon"><use href="#i-set"/></svg></button>
  </nav>
  <div class="set-menu" id="set-menu" hidden><div class="set-row"><span id="set-motion-label"></span>
    <span class="choice" role="radiogroup"><button data-motion="auto" role="radio"></button><button data-motion="on" role="radio"></button><button data-motion="off" role="radio"></button></span></div>
    <span class="note" id="set-motion-note"></span></div>
</header>
<main>
  <section class="lobby" id="lobby" aria-label="desk">
    <div class="lobby-art" id="lobby-art"></div>
    <div class="lobby-greet"><p id="hello"></p><p id="where"></p></div>
  </section>
  <section class="page" id="page" hidden>
    <div class="hero" id="hero"></div>
    <div class="sheet" id="sheet" aria-live="polite"></div>
  </section>
</main>
<footer class="bar">
  <div class="drive-line">
    <div class="job" id="job" hidden><span class="track"><i></i></span><span class="t" id="job-t"></span><button class="linkish" id="job-log" type="button"></button></div>
    <div class="txt" id="drive"></div>
  </div>
  <span class="next-why" id="why"></span>
  <button class="next" id="next" type="button"></button>
</footer>
<div class="toast" id="toast" role="status"></div>
<div class="zoom" id="zoom" hidden><img alt=""></div>
</body>
</html>
