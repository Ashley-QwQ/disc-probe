[build-system]
requires = []
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "disc-probe"
dynamic = ["version"]
description = "Measure optical disc geometry and draw images with an ordinary drive"
readme = "README.en.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["numpy>=1.24", "Pillow>=10", "scipy>=1.10", "opencv-python>=4.8"]

[project.scripts]
disc-probe = "discprobe.__main__:main"
