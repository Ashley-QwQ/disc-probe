<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>disc-probe · Preview mock</title><link rel="stylesheet" href="../tokens.css"><style>
@font-face{font-family:Archivo;src:url(../fonts/Archivo-VF-latin.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{color-scheme:light;--paper:#ebe7e0;--paper-2:#e4dfd7;--ink:#1d1b18;--ink-2:#5d5850;--ink-3:#8a847a;--rule:#cfc9bf;--rule-strong:#a9a297;--copper:#a8693c;--font:Archivo,system-ui,'Microsoft YaHei UI',sans-serif;--mono:ui-monospace,Consolas,monospace;--edge:clamp(20px,3.2vw,56px)}
:root[data-theme=dark]{color-scheme:dark;--paper:#161d1c;--paper-2:#1f2827;--ink:#ecebe4;--ink-2:#aeb3ab;--ink-3:#7f8780;--rule:#2c3634;--rule-strong:#46514e;--copper:#d9a75c}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--font)}button,select{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--rule-strong);border-radius:3px;min-height:44px;padding:8px 14px;cursor:pointer}button:active{transform:translateY(1px)}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:2px solid var(--copper);outline-offset:3px}::selection{background:var(--rule)}
.dev-tools{position:relative;display:flex;align-items:center;gap:10px;margin:16px var(--edge);flex-wrap:wrap}.dev-tools p{margin:0 auto 0 0}.dev-tools label{display:flex;align-items:center;gap:8px}footer{position:fixed;bottom:0;left:0;right:0;background:var(--paper);display:flex;justify-content:space-between;padding:16px var(--edge);z-index:4;border-top:1px solid var(--rule)}#next{min-width:210px;background:var(--ink);color:var(--paper);font-weight:600}#preview-workspace{top:94px}
:root.idle :not(.live,.live *){animation-play-state:paused!important}@media(max-width:700px){.dev-tools{gap:6px}.dev-tools p{width:100%}.dev-tools button,.dev-tools select{padding:6px 8px}#preview-workspace{top:154px}#next{min-width:160px}footer{padding-top:12px;padding-bottom:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="dev-tools"><p id="mock-note">样稿：只用假数据，不生成文件、不连接光驱。</p><button id="language">English</button><button id="theme">切换主题</button><label><span id="scenario-label">状态</span><select id="scenario"><option value="dvd">DVD</option><option value="cd">CD · 待拍照</option><option value="empty">没有工程</option><option value="fail">生成失败</option></select></label></div><footer><button id="back">返回设计</button><button id="next" disabled><span id="next-text">下一步：刻录</span></button></footer><script type="module">
import {start} from './preview.js';
const root=document.documentElement,$=id=>document.getElementById(id);let lang='zh';
const api={$,lang:()=>lang,reduce:matchMedia('(prefers-reduced-motion:reduce)').matches};
function projection(ppm){const c=document.createElement('canvas');c.width=c.height=120*ppm;const g=c.getContext('2d'),n=c.width;g.fillStyle='#d9ddcf';g.fillRect(0,0,n,n);g.fillStyle='#3c4944';g.beginPath();g.moveTo(0,n*.74);g.lineTo(n*.26,n*.25);g.lineTo(n*.57,n*.65);g.lineTo(n*.79,n*.32);g.lineTo(n,n*.64);g.lineTo(n,n);g.lineTo(0,n);g.fill();g.fillStyle='#f3f2e8';g.beginPath();g.arc(n*.7,n*.27,n*.12,0,Math.PI*2);g.fill();const image=g.getImageData(0,0,n,n);for(let y=0;y<n;y++)for(let x=0;x<n;x++){const i=(y*n+x)*4,l=image.data[i]*.2126+image.data[i+1]*.7152+image.data[i+2]*.0722;const v=l/255>((x%4)*4+(y%4))/16?232:52;image.data[i]=image.data[i+1]=image.data[i+2]=v;}g.putImageData(image,0,0);return c;}
function open(){const scenario=$('scenario').value;start(api,{media:scenario==='cd'?'cd':'dvd',item:{name:'Ritek DVD-R'},project:scenario==='empty'?null:{name:lang==='zh'?'山与太阳':'Hills and sun',cellMm:.125,render:projection},alongTrackMeasured:scenario!=='cd',async exportIso(onProgress,{signal}){for(let i=0;i<=40;i++){await new Promise((resolve,reject)=>{const abort=()=>{clearTimeout(timer);reject(new DOMException('Cancelled','AbortError'));};const timer=setTimeout(()=>{signal.removeEventListener('abort',abort);resolve();},100);signal.addEventListener('abort',abort,{once:true});});if(signal.aborted)throw new DOMException('Cancelled','AbortError');if(scenario==='fail'&&i===18)throw Error('mock export failure');onProgress(i/40);}return {path:'C:\\Disc projects\\山与太阳.iso',bytes:734003200,sectors:358400};},back(){open();},next(){open();alert(lang==='zh'?'下一步将进入刻录页。这里只演示预览，不会刻录。':'The next step opens Burn. This preview mock never burns.');}});}
$('scenario').addEventListener('change',open);$('language').addEventListener('click',()=>{lang=lang==='zh'?'en':'zh';root.lang=lang==='zh'?'zh-CN':'en';root.dataset.lang=lang;$('language').textContent=lang==='zh'?'English':'中文';$('theme').textContent=lang==='zh'?'切换主题':'Toggle theme';$('mock-note').textContent=lang==='zh'?'样稿：只用假数据，不生成文件、不连接光驱。':'Mock: fake data only. No files or drives are accessed.';$('scenario-label').textContent=lang==='zh'?'状态':'Scenario';const labels=lang==='zh'?['DVD','CD · 待拍照','没有工程','生成失败']:['DVD','CD · photo needed','No project','Export fails'];[...$('scenario').options].forEach((o,i)=>o.textContent=labels[i]);document.dispatchEvent(new Event('dp-lang'));});$('theme').addEventListener('click',()=>root.dataset.theme=root.dataset.theme==='dark'?'light':'dark');open();let idle;for(const event of ['pointerdown','pointermove','keydown','wheel'])addEventListener(event,()=>{root.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>root.classList.add('idle'),10000);},{passive:true});
</script></body></html>
