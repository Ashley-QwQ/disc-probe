<!doctype html>
<html lang="zh-CN" data-theme="paper" data-motion="on">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>往期作品 · 演示 / Past works preview</title>
<style>
/* Token blocks copied from index.html; this file is standalone and never starts a backend. */
  :root {
    color-scheme: light;
    --paper: #ebe7e0; --paper-2: #e4dfd7; --ink: #1d1b18; --ink-2: #5d5850; --ink-3: #8a847a;
    --rule: #cfc9bf; --rule-strong: #a9a297; --copper: #a8693c;
    /* Only the disc has colour (DESIGN.md): done is ink with a tick, what needs the person is copper, an
       error is copper in bold with its picture. No green, no red. */
    --good: var(--ink); --warn: var(--copper); --unknown: #6f6a62;
    /* The page is a sheet of glass held just above the scene: the bars, buttons and paper are all on the glass,
       one plane, and throw shadows down away from the lamp (up right): lower left, as the scene's own shadows.
       How far depends on what lies under each: on the drive (just under the glass) a short shadow; on the bare
       desk (a drive's height below) as far as the drive's own shadow, 40 x 22 mm. --mm is the
       scene's px per mm, set by the page (newplan.js, calstage.js). Words printed on things in the scene belong
       to the scene and throw none. Ink theme: deeper shadows and a thin highlight on the edges facing the lamp. */
    --mm: 2.4px; --glass-ink: rgb(58 47 34 / .3);
    --glass-desk: calc(-40 * var(--mm)) calc(22 * var(--mm)) calc(8 * var(--mm)) var(--glass-ink);
    --glass-drive: calc(-4 * var(--mm)) calc(2.2 * var(--mm)) calc(2.4 * var(--mm)) var(--glass-ink);
    --glass-desk-drop: drop-shadow(calc(-40 * var(--mm)) calc(22 * var(--mm)) calc(3.5 * var(--mm)) var(--glass-ink));   /* small things: a crisper penumbra, still readable */
    --glass-drive-drop: drop-shadow(calc(-4 * var(--mm)) calc(2.2 * var(--mm)) calc(1.2 * var(--mm)) var(--glass-ink));
    --glass-edge: 0 0 0 transparent; --glass-edge-drop: drop-shadow(0 0 0 transparent);
    /* paper lying on the desk (scene, not glass): its short shadow */
    --paper-desk: calc(-3 * var(--mm)) calc(1.7 * var(--mm)) calc(3 * var(--mm)) var(--glass-ink);
    --envelope-desk-drop: drop-shadow(calc(-4 * var(--mm)) calc(2.2 * var(--mm)) calc(1.6 * var(--mm)) var(--glass-ink));   /* a bag with a sheet in it */
    /* the TUI's DVD title colours (banner.TITLE_HUES dvd: OKLCH hue .80 to 1.02 turns), darker on paper */
    --dvd: linear-gradient(90deg, #7262c6, #8d58b7, #a150a1, #b04985, #ba4765);
    /* the other two kinds' bars: CD in its cyan, BD in copper */
    --cd: linear-gradient(90deg, #2f7f95, #2f9396, #3c9f88, #57a874);
    --bd: linear-gradient(90deg, #8a5a2e, #a8693c, #bf8448, #c99a52);
    --font: "Archivo", system-ui, "Microsoft YaHei UI", "PingFang SC", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --edge: clamp(20px, 3.2vw, 56px);
    /* The frame: the header row and the footer row are both --row tall and --edge in from the window,
       so the four corner things (the wordmark, the tools, the drive line, next) sit at equal distances
       from both edges. --foot is how much of the window's bottom the footer row takes. */
    --row: 52px; --foot: calc(var(--edge) + var(--row));
    --t: 260ms; --ease: cubic-bezier(.2, .8, .2, 1); --io: cubic-bezier(.65, 0, .35, 1);
    --over: cubic-bezier(.34, 1.45, .55, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #161d1c; --paper-2: #1f2827; --ink: #ecebe4; --ink-2: #aeb3ab; --ink-3: #7f8780;
    --rule: #2c3634; --rule-strong: #46514e; --copper: #d9a75c;
    --good: var(--ink); --warn: var(--copper); --unknown: #aeb3ab;
    --glass-ink: rgb(0 0 0 / .66);
    --glass-edge: inset -1px 1px 0 rgb(255 255 255 / .1); --glass-edge-drop: drop-shadow(1px -1px 0 rgb(255 255 255 / .12));
    --dvd: linear-gradient(90deg, #a79aff, #c58ff3, #dc86db, #ee81bc, #f87f9a);
    --cd: linear-gradient(90deg, #6cc6dc, #6fd3cf, #82dbb7, #a3e29b);
    --bd: linear-gradient(90deg, #c98b4f, #d9a75c, #e4bb72, #ecca86);
  }
@font-face { font-family: Archivo; src: url(../fonts/Archivo-VF-latin.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
* { box-sizing: border-box; } body { margin: 0; background: var(--paper); color: var(--ink); font: 16px / 1.5 var(--font); }
button { font: inherit; cursor: pointer; } button:focus-visible { outline: 2px solid var(--copper); outline-offset: 3px; }
.preview-top { position: fixed; z-index: 4; inset: var(--edge) var(--edge) auto; height: var(--row); display: flex; align-items: center; gap: 12px; }
.preview-top strong { margin-right: auto; font-stretch: 112%; }
.preview-top button, .preview-controls button, .preview-controls summary { min-height: 44px; padding: 8px 12px; border: 0; border-radius: 4px;
  color: var(--ink); background: var(--paper-2); box-shadow: var(--glass-edge), var(--glass-desk); }
.preview-controls { position: fixed; z-index: 4; bottom: var(--edge); left: var(--edge); max-width: calc(100vw - 2 * var(--edge)); }
.preview-controls summary { cursor: pointer; width: fit-content; }
.preview-controls[open] { background: var(--paper); padding: 14px; border-radius: 8px; }
.preview-controls p { margin: 0 0 12px; font-size: 14px; }
.preview-controls div { display: flex; flex-wrap: wrap; gap: 10px; max-width: 520px; }
.preview-lobby { position: fixed; inset: 0; overflow: hidden; }
.preview-lobby #lobby-art { position: absolute; inset: 0; }
#lobby-open { position: absolute; left: calc(50% - 110px); top: calc(50% - 160px); width: 220px; padding: 0; border: 0; background: none; color: var(--ink); }
#lobby-open img { display: block; width: 100%; } #lobby-open span { font-weight: 700; display: block; margin-top: 12px; }
.preview-lobby::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: var(--pw-shade, 0); background: var(--ink); }
.preview-result { position: fixed; inset: 25% 15%; text-align: center; }
.preview-result h1 { font-size: clamp(24px, 4vw, 42px); }.preview-result button { padding: 12px 20px; color: var(--paper); background: var(--ink); border: 0; border-radius: 4px; }
[hidden] { display: none !important; }
@media (max-width: 650px) { .preview-top { gap: 8px; } .preview-top strong { font-size: 13px; } .preview-top button { padding: 8px; font-size: 13px; } }
</style>
</head>
<body>
<header class="preview-top"><button id="back" type="button" hidden>返回 / Back</button><strong>DP · 演示 / Demo</strong>
  <button id="theme" type="button">墨色 / Dark</button><button id="motion" type="button">动效：开 / Motion on</button></header>
<section id="lobby" class="preview-lobby"><div id="lobby-art"><button id="lobby-open" type="button">
  <img src="./lobby/filebox_paper.webp" alt=""><span>往期作品 / Past works</span></button></div></section>
<section class="preview-result" hidden><h1></h1><p>这是演示数据；正式入口会打开新作品表单或设计页。<br>This preview uses sample plans. The real entry opens the new-work form or the design page.</p>
  <button id="return" type="button">返回往期作品 / Return to past works</button></section>
<details class="preview-controls"><summary>演示控制 / Demo controls</summary><p>以下作品均为示例。 / All works shown here are samples.</p>
  <div><button id="replay" type="button">重播首次下落 / Replay first fall</button><button id="again" type="button">再次进入（0.6 秒） / Re-enter (0.6 s)</button>
    <button id="empty" type="button">只看空档案 / Show empty archive</button></div></details>
<script type="module">
import { createPastWorks } from './pastworks.js';
import { planThumbnail } from './design.js';
const $ = (id) => document.getElementById(id), root = document.documentElement;
const names = ['岸边', '玻璃花', '长夜', '山和太阳', '竹影', '纸上的潮汐', 'Atlas 2', 'Atlas 10', 'Moon study', '雨后', 'Window light', '最后一班船'];
const fakePlans = names.map((name, i) => {
  const c = document.createElement('canvas'); c.width = c.height = 240;
  const g = c.getContext('2d'); g.fillStyle = '#f5eee1'; g.fillRect(0, 0, 240, 240);
  g.fillStyle = ['#a8693c', '#4c6169', '#554a76', '#53715a'][i % 4];
  g.beginPath(); g.arc(158, 76, 32 + i % 3 * 7, 0, Math.PI * 2); g.fill();
  for (let k = 0; k < 5; k++) {
    g.strokeStyle = ['#1d1b18', '#856c4f'][k % 2]; g.lineWidth = 3 + k;
    g.beginPath(); g.moveTo(0, 155 + k * 16); g.bezierCurveTo(90, 80 + i * 4, 140, 245, 240, 130 + k * 16); g.stroke();
  }
  return { name, media: i % 3 === 1 ? 'cd' : 'dvd', item: { name: '演示批次 / Demo batch' },
    date: `2026-11-${String(11 - Math.floor(i / 2)).padStart(2, '0')}T12:00:00Z`,
    view: i % 3 === 0 ? 'orig' : 'proj', cell: .02,
    tone: { dither: 100, bright: 0, levels: 2, lin: false, inv: false, contrast: 0, hi: 0, sh: 0, mode: 'floyd-steinberg', auto: null },
    layers: [{ kind: 'image', src: c, w: 240, h: 240, width: 116, x: 0, y: 0, rot: i * 8, opacity: 1, visible: true }], past: [], future: [] };
});
let empty = false, demo;
const result = document.querySelector('.preview-result');
function showResult(title) { result.querySelector('h1').textContent = title; result.hidden = false; root.dataset.mode = 'preview-demo'; $('back').hidden = false; }
const api = { $, lang: () => 'zh', get reduce() { return root.dataset.motion === 'off'; },
  toLobby() { root.dataset.mode = ''; $('back').hidden = true; } };
function build() {
  demo = createPastWorks(api, { thumbnail: planThumbnail,
    openPlan: (plan) => showResult(`打开作品 / Open work：${plan.name}`), newWork: () => showResult('新作品 / New work') });
}
async function enter() { result.hidden = true; await demo.show(empty ? [] : fakePlans); }
function close() { if (demo.state.phase !== 'closed') { if (demo.state.focused) demo.back(); demo.back(); demo.skip(); } }
$('lobby-open').onclick = enter;
$('theme').onclick = () => {
  root.dataset.theme = root.dataset.theme === 'dark' ? 'paper' : 'dark';
  $('theme').textContent = root.dataset.theme === 'dark' ? '纸色 / Paper' : '墨色 / Dark';
  $('lobby-open').querySelector('img').src = `./lobby/filebox_${root.dataset.theme}.webp`;
};
$('motion').onclick = () => { root.dataset.motion = root.dataset.motion === 'on' ? 'off' : 'on'; $('motion').textContent = root.dataset.motion === 'off' ? '动效：关 / Motion off' : '动效：开 / Motion on'; };
$('replay').onclick = async () => { close(); demo.destroy(); build(); document.querySelector('.preview-controls').open = false; await enter(); };
$('again').onclick = async () => { close(); document.querySelector('.preview-controls').open = false; await enter(); };
$('empty').onclick = async () => { close(); empty = !empty; $('empty').textContent = empty ? '查看示例作品 / Show sample works' : '只看空档案 / Show empty archive'; document.querySelector('.preview-controls').open = false; await enter(); };
$('return').onclick = () => { result.hidden = true; root.dataset.mode = ''; enter(); };
$('back').addEventListener('click', () => { if (root.dataset.mode === 'preview-demo') $('return').click(); });
root.dataset.motion = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'on';
build();
window.pastworksPreview = { get page() { return demo; }, fakePlans, thumbnail: planThumbnail };
await enter();
</script>
</body></html>
