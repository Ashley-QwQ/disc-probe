<!doctype html>
<html lang="zh-CN" data-handshake="pending">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>disc-probe</title>
<link rel="icon" type="image/x-icon" href="../brand/probe/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../brand/probe/apple-touch-icon.png">

<script>
  // before the first paint, so a dark page never flashes light
  (function () {
    var t = null;
    try { t = localStorage.getItem("dp-theme"); } catch (e) {}
    document.querySelector('meta[name="color-scheme"]').content = t === "dark" ? "dark" : t === "light" ? "light" : "light dark";
    document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    // motion: this page's own setting (Settings), else the system's; ?motion forces it on
    var m = null;
    try { m = localStorage.getItem("dp-motion"); } catch (e) {}
    var on = /[?&]motion(\b|=)/.test(location.search) || m === "on" || (m !== "off" && !matchMedia("(prefers-reduced-motion: reduce)").matches);
    document.documentElement.dataset.motion = on ? "on" : "off";
    var l = null;
    try { l = localStorage.getItem("dp-lang"); } catch (e) {}
    l = l || ((navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh" : "en");
    document.documentElement.lang = l === "zh" ? "zh-CN" : "en";
    document.documentElement.dataset.lang = l;
    if (new URLSearchParams(location.search).get("corner-weight")?.toLowerCase() === "b") {
      document.documentElement.dataset.cornerWeight = "b";
    }
  })();
</script>
<link rel="stylesheet" href="./kit/kit.css">
<link rel="stylesheet" href="./kit/removal.css">
<link id="design-styles" rel="stylesheet" href="./design.css">
<link rel="stylesheet" href="./burn-stop-tokens.css">
<link rel="stylesheet" href="./burn-stop.css">
<link rel="stylesheet" href="./curve-edit.css">
<link rel="stylesheet" href="./presetio.css">
<style>
  @font-face { font-family: "Archivo"; src: url(../fonts/Archivo-VF-latin.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  html[data-handshake="pending"] body { visibility: hidden; }
  #gui-compatibility { box-sizing: border-box; width: min(100%, 42rem); margin: 12vh auto; padding: clamp(20px, 5vw, 48px); color: var(--ink); background: var(--paper); line-height: 1.6; overflow-wrap: anywhere; }
  #gui-compatibility h1 { font-size: clamp(1.4rem, 4vw, 2rem); line-height: 1.25; margin: 0 0 1.5rem; }
  #gui-compatibility p { margin: 0 0 1rem; }
  :root {
    color-scheme: light;
    --paper: #ebe7e0; --paper-2: #e4dfd7; --ink: #1d1b18; --ink-2: #5d5850; --ink-3: #8a847a;
    --rule: #cfc9bf; --rule-strong: #a9a297; --copper: #a8693c;
    /* Only the disc has colour (DESIGN.md): done is ink with a tick, what needs the person is copper, an
       error is copper in bold with its picture. No green, no red. */
    --good: var(--ink); --warn: var(--copper); --unknown: #6f6a62;
    /* The page is a sheet of glass held just above the scene: the bars, buttons and paper are all on the glass,
       one plane, and throw shadows down away from the lamp (up right): lower left, as the scene's own shadows.
       How far depends on what lies under each: on the drive (just under the glass) a short shadow; on the bare
       desk (a drive's height below) as far as the drive's own shadow, 40 x 22 mm. --mm is the
       scene's px per mm, set by the page (newplan.js, calstage.js). Words printed on things in the scene belong
       to the scene and throw none. Ink theme: deeper shadows and a thin highlight on the edges facing the lamp. */
    --mm: 2.4px; --glass-ink: rgb(29 27 24 / .14);   /* paper: shadows are ink, faint (2026-11-16, STYLE.md two layers) */
    /* One lamp for the baked scene and the glass (caltop anim.json: 0.5609 / 0.3085 mm per mm of height; the drive is
       71.3 mm tall and throws (-40, -22) mm). The glass lies about 78 mm up, just over the drive: on the desk its shadow
       falls (-44, 24) mm away, on the drive's top (-4, 2.2) mm. The offset says the height and cannot change alone
       (12 mm was tried 2026-11-16: the glass sank into the drive). Panels get the baked penumbra; small things a crisper one. */
    --glass-desk: calc(-44 * var(--mm)) calc(24 * var(--mm)) calc(10 * var(--mm)) var(--glass-ink);
    --glass-drive: calc(-4 * var(--mm)) calc(2.2 * var(--mm)) calc(2.4 * var(--mm)) var(--glass-ink);
    --glass-desk-drop: drop-shadow(calc(-44 * var(--mm)) calc(24 * var(--mm)) calc(3.5 * var(--mm)) var(--glass-ink));   /* small things: a crisper penumbra, still readable */
    --glass-drive-drop: drop-shadow(calc(-4 * var(--mm)) calc(2.2 * var(--mm)) calc(1.2 * var(--mm)) var(--glass-ink));
    --glass-edge: 0 0 0 transparent; --glass-edge-drop: drop-shadow(0 0 0 transparent);
    /* paper lying on the desk (scene, not glass): its short shadow */
    --paper-desk: calc(-3 * var(--mm)) calc(1.7 * var(--mm)) calc(3 * var(--mm)) var(--glass-ink);
    --envelope-desk-drop: drop-shadow(calc(-4 * var(--mm)) calc(2.2 * var(--mm)) calc(1.6 * var(--mm)) var(--glass-ink));   /* a bag with a sheet in it */
    /* the TUI's DVD title colours (banner.TITLE_HUES dvd: OKLCH hue .80 to 1.02 turns), darker on paper */
    --dvd: linear-gradient(90deg, #7262c6, #8d58b7, #a150a1, #b04985, #ba4765);
    --dvd-disc: linear-gradient(180deg, #7262c6, #8d58b7, #a150a1, #b04985, #ba4765);   /* the wordmark's disc: the same colours, top to bottom */
    /* the other two kinds' bars: CD in its cyan, BD in copper */
    --cd: linear-gradient(90deg, #2f7f95, #2f9396, #3c9f88, #57a874);
    --bd: linear-gradient(90deg, #8a5a2e, #a8693c, #bf8448, #c99a52);
    --font: "Archivo", system-ui, "Microsoft YaHei UI", "PingFang SC", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --edge: clamp(20px, 3.2vw, 56px);
    /* The frame: the header row and the footer row are both --row tall and --edge in from the window,
       so the four corner things (the wordmark, the tools, the drive line, next) sit at equal distances
       from both edges. --foot is how much of the window's bottom the footer row takes. */
    --row: 52px; --foot: calc(var(--edge) + var(--row));
    --t: 260ms; --ease: cubic-bezier(.2, .8, .2, 1); --io: cubic-bezier(.65, 0, .35, 1);
    --over: cubic-bezier(.34, 1.45, .55, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0a1114; --paper-2: #121a1e; --ink: #eef0ee; --ink-2: #a6b0b3; --ink-3: #7b868a;
    --rule: #202d33; --rule-strong: #3a4a51; --copper: #e0ab5c;
    --good: var(--ink); --warn: var(--copper); --unknown: #a6b0b3;
    /* night B, deep teal (2026-11-14, for 1.0.0): paper under the lamp is light; on it, ink and a darker copper */
    --lit-paper: #ece6d8; --lit-ink: #22231f; --lit-ink-2: #55554c; --lit-ink-3: #7b796d; --lit-copper: #8f5628;
    --glass-ink: rgb(10 17 20 / .85);   /* night: a shadow is the ground the lamp misses, never darker than it */
    --glass-edge: inset -1px 1px 0 rgb(255 255 255 / .1); --glass-edge-drop: drop-shadow(1px -1px 0 rgb(255 255 255 / .12));
    --dvd: linear-gradient(90deg, #a79aff, #c58ff3, #dc86db, #ee81bc, #f87f9a);
    --dvd-disc: linear-gradient(180deg, #a79aff, #c58ff3, #dc86db, #ee81bc, #f87f9a);
    --cd: linear-gradient(90deg, #6cc6dc, #6fd3cf, #82dbb7, #a3e29b);
    --bd: linear-gradient(90deg, #c98b4f, #d9a75c, #e4bb72, #ecca86);
  }
  :root.idle :not(.live, .live *), :root.idle :not(.live, .live *)::before, :root.idle :not(.live, .live *)::after { animation-play-state: paused !important; }
  :root[data-motion="off"] { --t: 0ms; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--font); overflow: hidden; transition: background-color var(--t) var(--ease), color var(--t) var(--ease); }
  ::selection { background: #d6cfc3; }
  :root[data-theme="dark"] ::selection { background: #303e44; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  button { font: inherit; color: inherit; }

  /* ---- stage ---- */
  .stage { position: fixed; inset: 0; }
  .art { position: absolute; left: 4vw; top: 41%; width: min(108vw, 2000px); aspect-ratio: 1600 / 1000; transform: translateY(-50%); }
  .cam { position: absolute; inset: 0; transition: transform 700ms var(--ease); will-change: transform; }
  .layer { position: absolute; inset: 0; pointer-events: none; transition: opacity 420ms var(--ease); will-change: opacity; }
  img.layer { width: 100%; height: 100%; display: block; }
  /* a solid row that is not in focus is fully transparent: take it out of painting once faded */
  .layer.solid { visibility: hidden; transition: opacity 420ms var(--ease), visibility 0s linear 420ms; }
  .layer.solid[data-depth="0"] { visibility: visible; transition: opacity 420ms var(--ease), visibility 0s; }
  .layer svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .layer.burner img { position: absolute; display: block; pointer-events: none; }
  /* air perspective, the cheap way: each row is its own layer; rows not in focus become line
     drawings (filled with the page colour so they still hide what is behind) and fade with
     distance. Only opacity changes, so the browser composites instead of repainting. */
  .layer.solid { opacity: 0; }
  .layer.solid[data-depth="0"] { opacity: 1; }
  .layer.ghost[data-depth="0"] { opacity: 0; }
  :is(.layer.ghost, .layer.burner)[data-depth="1"] { opacity: .5; }
  :is(.layer.ghost, .layer.burner)[data-depth="2"] { opacity: .3; }
  :is(.layer.ghost, .layer.burner)[data-depth="3"] { opacity: .2; }
  .layer.ghost[data-front="true"] { opacity: .08; }
  /* Background racks are outlines only; the reading column has no art behind it. */
  :root[data-home="library"]:is(:not([data-mode]), [data-mode=""]) .stage { mask-image: linear-gradient(to right, #000 52%, transparent 60%); }
  .layer.ghost:not([data-depth="0"]) { opacity: .08; }
  .layer.ghost path { fill: none; stroke: var(--ink); stroke-width: .75px; }
  :root[data-live] .layer.ghost { display: none; }
  :root[data-live] .layer.solid[data-depth="1"] { opacity: .5; }
  :root[data-live] .layer.solid[data-depth="2"] { opacity: .3; }
  :root[data-live] .layer.solid[data-depth="3"] { opacity: .2; }
  :root[data-live] .layer.solid[data-front="true"] { opacity: .16; }
  /* the burner rig: body, and the tray sliding in its slot (closed = moved in by --slide) */
  .disc.new-slot :is(.iso-fill, .iso-top, .iso-shade) { fill: none !important; }
  .disc.new-slot :is(.aura, .sheen, .glint) { display: none; }
  .disc.new-slot .iso-line { stroke-dasharray: 5 4; }
  #state.is-new .facts { display: none; }
  .layer.burner .rig { position: absolute; isolation: isolate; }
  /* The protagonist's warm spotlight (the person's rule: every page's main object sits in the lamp's pool; the
     isometric renders have no desk, so the pool is painted here). The lamp is up right: the pool's centre sits up
     right of the drive, so the drive stands in its lower-left part and throws its baked shadow (burner_shadow_*)
     away from the light; fading out well inside its box (no corners). The drive: warmed toward the lamp (up right)
     by a soft-light wash over it. (W11, 2026-11-14: the old pool was centred on the drive, as if lit from above.) */
  .layer.burner .rig::before { content: ""; position: absolute; inset: -70% -60%; z-index: -1; pointer-events: none;
    background: radial-gradient(closest-side at 60% 46%, rgb(255 236 200 / .85), rgb(255 236 200 / .35) 45%, rgb(255 236 200 / 0) 100%); }
  .layer.burner .rig::after { content: ""; position: absolute; inset: -10%; pointer-events: none; mix-blend-mode: soft-light;
    background: radial-gradient(closest-side at 62% 34%, rgb(255 196 120 / .7), rgb(255 196 120 / .15) 60%, transparent 85%); }
  /* Night: the pool only lifts the deep teal, same hue (2026-11-16, as the baked night pools: no warm tint) */
  :root[data-theme="dark"] .layer.burner .rig::before {
    background: radial-gradient(closest-side at 60% 46%, rgb(62 86 98 / .42), rgb(62 86 98 / .14) 45%, rgb(62 86 98 / 0) 100%); }
  :root[data-theme="dark"] .layer.burner .rig::after {
    background: radial-gradient(closest-side at 62% 34%, rgb(205 222 228 / .5), rgb(205 222 228 / .1) 60%, transparent 85%); }
  .layer.burner .rig > img, .layer.burner .slot, .layer.burner .slot-shadow, .layer.burner .shadows { position: absolute; inset: 0; width: 100%; height: 100%; }
  .layer.burner .shadows { isolation: isolate; pointer-events: none; }
  .layer.burner .shadows img { position: absolute; }
  .layer.burner .shadows .tray { mix-blend-mode: darken; transform: translate(var(--slide)); transition: transform 900ms cubic-bezier(.45, 0, .2, 1); }
  .layer.burner.open .shadows .tray { transform: translate(var(--open, 0, 0)); }
  .layer.burner .slot img { position: absolute; inset: 0; width: 100%; height: 100%; transform: translate(var(--slide)); transition: transform 900ms cubic-bezier(.45, 0, .2, 1); }
  .layer.burner.open .slot img { transform: translate(var(--open, 0, 0)); }
  :root[data-home="library"]:is(:not([data-mode]), [data-mode=""]) .layer.burner .rig { container-type: inline-size; }
  :root[data-home="library"]:is(:not([data-mode]), [data-mode=""]) .layer.burner .shadows { display: none; }
  /* The rig is mirrored, so positive local X casts toward screen left. */
  :root[data-home="library"]:is(:not([data-mode]), [data-mode=""]) .layer.burner :is(.body, .slot-shadow) {
    filter: drop-shadow(calc(40 * var(--drive-mm)) calc(22 * var(--drive-mm)) calc(3.5 * var(--drive-mm)) var(--glass-ink));
  }
  .layer.burner .tray.full, .layer.burner.has-disc .tray.empty { visibility: hidden; }
  .layer.burner.has-disc .tray.full { visibility: visible; }
  .layer.burner .rig.dark, :root[data-theme="dark"] .layer.burner .rig.light { display: none; }
  :root[data-theme="dark"] .layer.burner .rig.dark { display: block; }
  /* the burner: one picture per theme, both loaded, the theme picks */
  .layer.burner img.dark, :root[data-theme="dark"] .layer.burner img.light { display: none; }
  :root[data-theme="dark"] .layer.burner img.dark { display: block; }   /* a row in front of the focus is foreground haze: keep it faint */
  .art.entering { animation: dolly 900ms var(--ease) both; }
  @keyframes dolly { from { opacity: 0; transform: translateY(-50%) scale(.965); } to { opacity: 1; transform: translateY(-50%) scale(1); } }


  /* each kind of disc keeps its own tint, from the TUI's media colours: DVD violet-pink, CD cyan, BD copper */
  .layer[data-row="dvd"] .paper.iso { --disc-top: #f3edf3; --disc-side: #ddd3e0; --rw-top: #e6dee8; --rw-side: #cbc0ce; --shelf-top: #f0eaf0; --shelf-side: #d9cfda; }
  .layer[data-row="cd"] .paper.iso { --disc-top: #ecf2f3; --disc-side: #d2dddf; --rw-top: #dfe7e8; --rw-side: #c3cfd1; --shelf-top: #eaf0f1; --shelf-side: #d1dadc; }
  .layer[data-row="bd"] .paper.iso { --disc-top: #f3ede5; --disc-side: #ded3c5; --rw-top: #e7dfd4; --rw-side: #cdc1b0; --shelf-top: #f0eae2; --shelf-side: #d9cec0; }
  :root[data-theme="dark"] .layer .paper.iso { --halo: #000; --halo-a: .5; }
  :root[data-theme="dark"] .layer[data-row="dvd"] .paper.iso { --disc-top: #2e2734; --disc-side: #221d28; --rw-top: #28222d; --rw-side: #1d1922; --shelf-top: #252029; --shelf-side: #1b171f; --on-top: #6f5a82; --on-side: #574669; }
  :root[data-theme="dark"] .layer[data-row="cd"] .paper.iso { --disc-top: #243134; --disc-side: #1a2528; --rw-top: #202b2d; --rw-side: #172123; --shelf-top: #1e282a; --shelf-side: #161f21; --on-top: #4e7279; --on-side: #3d5b61; }
  :root[data-theme="dark"] .layer[data-row="bd"] .paper.iso { --disc-top: #322c25; --disc-side: #26201a; --rw-top: #2b2620; --rw-side: #201c17; --shelf-top: #29241f; --shelf-side: #1f1b16; --on-top: #8b6e48; --on-side: #6e5638; }
  :root[data-theme="dark"] .paper .disc.is-on { --disc-top: var(--on-top); --disc-side: var(--on-side); --rw-top: var(--on-top); --rw-side: var(--on-side); }
  .layer .far { opacity: .5; }

  /* the gallery: a triangle floating over the CD stacks, pointing up-left (the way the racks run
     back), with the word lying on the floor plane under it. Faint until pointed at. */
  .gallery { position: absolute; z-index: 1; display: grid; justify-items: start; gap: 2px; padding: 0; border: 0; background: none; color: var(--ink); cursor: pointer; opacity: .42; pointer-events: auto;
    transform: translate(-50%, -50%); transition: transform 700ms var(--ease), opacity var(--t) var(--ease); }
  .gallery:hover, .gallery:focus-visible { opacity: .9; }
  .gallery .pin { display: block; width: 150px; height: 98px; animation: hover-float 3.2s ease-in-out infinite; }
  .gallery .pin svg { width: 100%; height: 100%; overflow: visible; transform: matrix(0.866, 0.5, -0.866, 0.5, 0, 0); }
  .gallery .pin path { fill: color-mix(in srgb, var(--paper) 60%, transparent); stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; }
  .gallery .pin .shade { fill: currentColor; opacity: .14; stroke: none; }
  /* the word lies on the floor too, written along the racks' width (up and to the right) */
  .gallery .word { display: block; font-weight: 800; font-stretch: 120%; font-size: 40px; line-height: 1; letter-spacing: .06em; transform: matrix(0.866, -0.5, 0.866, 0.5, 0, 0); margin: 6px 0 0 120px; }
  @keyframes hover-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  /* lifting: the chosen disc overshoots a little and settles; its neighbours follow late */
  .paper .disc { transition: transform 300ms var(--ease); }
  .paper .disc.is-on { transition: transform 460ms var(--over); }
  .paper .disc.is-on .iso-line[data-tone="lo"] { stroke: var(--ink); }
  /* The SVG sheen follows selection, not a measured/inserted disc: no semantic rainbow. */
  .layer.solid .paper :is(.sheen, .glint) { display: none; }
  .layer.solid .paper .blk-shelf { --shelf-top: var(--paper); --shelf-side: var(--paper-2); }
  .layer.solid .paper .blk-copper { --copper-top: var(--ink-2); --copper-side: var(--ink-3); }
  .layer.solid .paper :is(.iso-face-text, .label) { fill: var(--ink); }
  :root[data-theme="dark"] .paper.iso { --anatomy-hi: #d5d9d2; --anatomy-mid: #78878e; --anatomy-lo: #4e5c63; --anatomy-faint: #2c3940; --anatomy-halo: #000; --anatomy-halo-opacity: .6; }
  :root[data-theme="dark"] .paper .iso-line[data-tone="hi"] { stroke-opacity: .55; }
  :root[data-theme="dark"] .paper .disc.is-on .aura { opacity: 1; }
  :root[data-theme="dark"] .paper .disc.is-on .iso-line[data-tone="lo"] { stroke: var(--ink); }

  /* ---- corners ---- */

  /* ===== the lobby: a desk, "new plan" on the left, "open plan" on the right (docs/goals/gui-outline.md 3.0).
     The shelf behind it is the disc library, reached from the header. ===== */
  .lobby { position: fixed; inset: 0; z-index: 1; display: none; background: var(--paper); }
  :root[data-home="lobby"]:is(:not([data-mode]), [data-mode=""]) .lobby { display: block; }
  :root[data-home="lobby"]:is(:not([data-mode]), [data-mode=""]) .stage { visibility: hidden; }
  /* the scene, labels and greeting: lobby.css / lobby.js */
  /* Settings: a small panel under its button (for now only animation) */
  .set-menu { position: fixed; z-index: 4; top: calc(var(--edge) + 58px); right: var(--edge); width: min(360px, calc(100vw - 2 * var(--edge))); padding: 14px 16px;
    background: var(--paper); color: var(--ink); border: 1px solid var(--rule-strong); border-radius: 8px; }
  .set-menu[hidden] { display: none; }
  /* The keys (keys.js, opened with ?): a card over a veil of the page's ground */
  .keys-help { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; padding: var(--edge);
    background: color-mix(in srgb, var(--paper) 72%, transparent); }
  .keys-help[hidden] { display: none; }
  .keys-card { width: min(460px, 100%); max-height: 100%; overflow-y: auto; padding: 22px 24px 18px; background: var(--paper); color: var(--ink);
    border: 1px solid var(--rule-strong); border-radius: 8px; }
  .keys-card h2 { margin: 0 0 14px; font-size: 22px; font-weight: 800; font-stretch: 112%; }
  .keys-card dl { display: grid; grid-template-columns: max-content 1fr; gap: 10px 18px; align-items: center; margin: 0; }
  .keys-card dt { display: flex; gap: 4px; }
  .keys-card dd { margin: 0; color: var(--ink-2); }
  .keys-card kbd { min-width: 26px; padding: 2px 7px; border: 1px solid var(--rule-strong); border-bottom-width: 2px; border-radius: 4px;
    font: 600 13px/1.4 var(--mono); text-align: center; color: var(--ink); }
  .keys-card p { margin: 16px 0 0; font-size: 14px; color: var(--ink-3); }
  .keys-card .keys-close { margin-top: 14px; }
  .set-row { margin: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 600; }
  .set-seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 4px; overflow: hidden; }
  .set-seg button { min-height: 36px; padding: 0 12px; border: 0; background: none; color: var(--ink-2); font: 600 14px var(--font); cursor: pointer; }
  .set-seg button + button { border-left: 1px solid var(--rule-strong); }
  .set-seg button[aria-checked="true"] { background: var(--ink); color: var(--paper); }
  .set-seg button:focus-visible { outline: 2px solid var(--copper); outline-offset: -2px; }
  .set-note { display: block; margin-top: 10px; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
  /* the header: one row, one control height, the wordmark and the tools on one centre line; the
     outermost glyphs sit on the page's content edges (left = the wordmark, right = the next button) */
  .top { position: fixed; z-index: 3; top: var(--edge); left: var(--edge); right: var(--edge); height: var(--row); display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
  .top > * { pointer-events: auto; }
  :root[data-home="library"]:is(:not([data-mode]), [data-mode=""]) .top > .wordmark { position: absolute; left: 50%; translate: -50% 0; }
  .tools { display: flex; align-items: center; gap: 4px; margin-right: -14px; }
  .tools #presetio-entry { position: static; font-size: 16px; padding-inline: 10px; }
  #quit:disabled { opacity: .45; cursor: default; }
  :root[data-exited] body > :not(#quit-status) { display: none !important; }
  :root[data-exited] #quit-status { margin: 0; padding: var(--edge); }
  .drive-entry { display: none; }
  /* the library is reached from the lobby; on a page (design, preview, calibration...) the button did nothing, so it
     is not shown there. The batch name in a work's title still opens the library with a way back. */
  :root[data-mode]:not([data-mode=""]) #library { display: none; }
  :root[data-home="library"]:is(:not([data-mode]), [data-mode=""]) .drive-entry { display: inline-flex; }
  :root[data-home="library"]:is(:not([data-mode]), [data-mode=""]) .top > .wordmark { font-size: 26px; }

  .wordmark { margin: 0; font-weight: 800; font-stretch: 125%; font-size: 34px; letter-spacing: .01em; line-height: 1; display: flex; align-items: center; }
  /* The D is drawn, the same one as the app icon (art/brand/build_marks.py): an ink stem with a disc standing in
     it, like a disc half out of a drive's slot. The disc's data area has the DVD colours and its clear hub is
     the D's counter; nothing else in the mark has colour. In em of Archivo 800 / 125: the baseline lies .834
     down the line, caps are .6875 high, a stem is .2036 wide after a .0845 side bearing; the disc's centre is
     .125 cap heights right of the stem and its edge passes through the stem's two right corners. */
  .wm-d { position: relative; flex: none; width: .772em; height: 1em; }
  /* Drawn as one SVG in em/1000 units (viewBox 772 x 1000): a box background is snapped to whole pixels
     on its own, so the stem and the disc rounded apart and the disc sagged a pixel below the stem at 100 %
     (2026-11-18). A path is not snapped, so the disc's overshoot stays even above and below. The disc is
     cut inside the stem and the stem is drawn over it, so no seam shows where the two meet. */
  .wm-d svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .wm-stem { fill: currentColor; }
  .o-disc { /* turning when pointed at */
    transform-box: fill-box; transform-origin: center; transition: transform 1200ms var(--ease);
  }
  .wm-g0 { stop-color: #7262c6; } .wm-g1 { stop-color: #8d58b7; } .wm-g2 { stop-color: #a150a1; } .wm-g3 { stop-color: #b04985; } .wm-g4 { stop-color: #ba4765; }
  :root[data-theme="dark"] .wm-g0 { stop-color: #a79aff; } :root[data-theme="dark"] .wm-g1 { stop-color: #c58ff3; } :root[data-theme="dark"] .wm-g2 { stop-color: #dc86db; } :root[data-theme="dark"] .wm-g3 { stop-color: #ee81bc; } :root[data-theme="dark"] .wm-g4 { stop-color: #f87f9a; }
  .wordmark:hover .o-disc { transform: rotate(1turn); }

  /* Off the home page the wordmark folds to "DP", the app icon's pair: nothing is cut and no letter is
     squeezed. First ISC and ROBE fade where they stand; then the P slides left to stand beside the D.
     Unfolding plays it the other way round: the P slides back first, then the letters fade in. The
     distances are measured from the font once (index.html, "wordmark: fold distances") into --wm-* on
     :root, in em. */
  .wordmark { position: relative; width: var(--wm-w0, auto); }
  .wm-cut > span { white-space: pre; }
  :root[data-mode]:not([data-mode=""]) .top > .wordmark { display: flex; }
  :root[data-mode]:not([data-mode=""]) .wordmark { width: var(--wm-w1, auto); }
  :root[data-mode]:not([data-mode=""]) .wm-cut > span { opacity: 0; }
  :root[data-mode]:not([data-mode=""]) .wm-p { translate: var(--wm-p, 0) 0; }
  /* beside the back button, not pushed to the middle by the two auto margins */
  :root[data-mode]:not([data-mode=""]) .top > .back:not([hidden]) { margin-right: 0; }
  :root[data-mode]:not([data-mode=""]) .top > .back:not([hidden]) + .wordmark { margin-left: 10px; }
  :root[data-mode]:not([data-mode=""]) .top > .back { flex-shrink: 0; }     /* the mark never squeezes the back button */
  /* folded, the release follows the mark, quiet */
  .wm-ver { position: absolute; left: 100%; top: 50%; margin-left: .6em; font-size: .4em; font-weight: 600; font-stretch: 100%; white-space: nowrap;
    letter-spacing: .02em; color: var(--ink-3); transform: translateY(-50%); translate: 0 .12em; opacity: 0; pointer-events: none; }
  .wm-ver:empty { display: none; }
  :root[data-mode]:not([data-mode=""]) .top .wm-ver { opacity: 1; }
  @media (max-width: 480px) { :root[data-mode]:not([data-mode=""]) .top > .wordmark { display: none; } }   /* no room beside back and the tools */
  /* timing. Folding: the letters go (0-200 ms), then the P slides (120-500), the version comes in
     (420-620). Unfolding: the version first, the slide back (60-420), then the letters (300-560). */
  :root[data-motion="on"] .wordmark { transition: width 360ms var(--ease) 60ms; }
  :root[data-motion="on"] .wm-p { transition: translate 360ms var(--ease) 60ms; }
  :root[data-motion="on"] .wm-cut > span { transition: opacity 260ms ease-out 300ms; }
  :root[data-motion="on"] .wm-ver { transition: opacity 120ms ease-in; }
  :root[data-motion="on"][data-mode]:not([data-mode=""]) .wordmark { transition: width 380ms var(--ease) 120ms; }
  :root[data-motion="on"][data-mode]:not([data-mode=""]) .wm-p { transition: translate 380ms var(--ease) 120ms; }
  :root[data-motion="on"][data-mode]:not([data-mode=""]) .wm-cut > span { transition: opacity 200ms ease-out; }
  :root[data-motion="on"][data-mode]:not([data-mode=""]) .wm-ver { transition: opacity 200ms ease-out 420ms; }

  .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .btn { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 18px; font-size: 18px; border: 1px solid transparent; border-radius: 4px; background: transparent; cursor: pointer; transition: background-color var(--t) var(--ease); }
  .btn:hover { background: var(--paper-2); }
  .btn:active { transform: translateY(1px); }

  .btn-icon { width: 52px; padding: 0; justify-content: center; }
  .btn-lang { font-weight: 600; font-stretch: 110%; padding: 0 14px; }
  .btn .icon { width: 24px; height: 24px; }

  .kind { min-height: 52px; padding: 0 18px; font-size: 19px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--ink-3); font-weight: 600; font-stretch: 110%; border-radius: 4px; transition: color var(--t) var(--ease), border-color var(--t) var(--ease); }
  .kind:hover { color: var(--ink); }
  .kind[aria-pressed="true"] { color: var(--ink); background: var(--paper-2); }
  .tools .drive-entry { font: inherit; min-height: 0; height: var(--row); padding: 0 12px; color: var(--ink); align-items: center; align-self: center; }

  /* ---- the footer row: drive on the left, next on the right, --edge in from the bottom corners as the
     header is from the top ones. No band or rule: the page fades to paper under it, so whatever runs on
     below (the new-work sheet, a scrolled column) stays legible behind the row ---- */
  .bar { position: fixed; z-index: 2; left: var(--edge); right: var(--edge); bottom: var(--edge); height: var(--row); display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 16px; }
  .next[hidden], .next-confirm[hidden] { display: none; }
  .next-confirm .kit-slide-help { position: absolute; bottom: calc(100% + 8px); right: 0; margin: 0; max-width: 100%; text-align: right; }
  .next.kit-ring-button .kit-ring-label { display: inline-flex; align-items: center; gap: 10px; }
  .next.kit-ring-button:hover:enabled { background: var(--ink); }
  .next.kit-ring-button :is(.kit-ring-track, .kit-ring-fill, .kit-icon) { stroke: currentColor; }
  .bar > .drive, .bar > .job { grid-column: 1; grid-row: 1; }
  .bar > .job:not([hidden]) ~ .next-why { display: none; }      /* a running job says it itself */
  /* the fade under the footer is the lobby's mood; a page with paper scrolls its own paper instead */
  :root[data-mode]:not([data-mode=""]) .bar::before { display: none; }
  .bar::before { content: ""; position: absolute; z-index: -1; pointer-events: none; left: calc(-1 * var(--edge)); right: calc(-1 * var(--edge)); bottom: calc(-1 * var(--edge));
    height: calc(var(--foot) + 32px); background: linear-gradient(to top, color-mix(in srgb, var(--paper) 88%, transparent) 55%, transparent); }
  .next .icon { transition: transform var(--t) var(--ease); }
  .next:hover .i-chev { transform: translateX(3px); }
  /* The keys (keys.js), hidden until they help: a button's own cap fades in while the pointer is on it, and
     all of them while the keyboard is in use (kbd-mode: any key, gone again soon after the mouse moves).
     Next always ends in the Enter key's arrow; its word "Enter" follows the caps. Only with a mouse or
     trackpad (a keyboard is likely); on touch, Next keeps its chevron and there are no caps. */
  .next-key { display: none; position: relative; margin-right: -4px; }
  .next-key .icon { width: 20px; height: 20px; }
  .next-key kbd { position: absolute; top: calc(100% + 1px); left: 50%; transform: translateX(-50%); font: 600 10px/1 var(--mono); letter-spacing: .04em; }
  .key-cap { display: none; }
  @media (hover: hover) and (pointer: fine) {
    .next .i-chev { display: none; }
    .next-key { display: inline-flex; }
    #back, #lang, #sound, #theme, #settings { position: relative; }
    .key-cap { display: block; position: absolute; left: 50%; top: calc(100% - 6px); transform: translateX(-50%); padding: 0 4px;
      font: 600 10px/14px var(--mono); letter-spacing: .04em; color: var(--ink-3); border: 1px solid var(--rule); border-radius: 4px;
      pointer-events: none; white-space: nowrap; }
    #back .key-cap { left: 30px; }
    .key-cap, .next-key kbd { opacity: 0; transition: opacity 400ms var(--ease) 150ms; }
    button:hover > .key-cap, .next:hover .next-key kbd { opacity: 1; transition-delay: 300ms; }
    :root.kbd-mode .key-cap, :root.kbd-mode .next-key kbd { opacity: 1; transition-delay: 0ms; }
    .next:hover .next-key kbd, :root.kbd-mode .next-key kbd { opacity: .7; }
  }

  @media (max-width: 820px) {
    body { overflow: auto; }
    .stage { position: relative; height: 44vh; }
    .art { left: -10vw; width: 122vw; top: 56%; }
    .tools .btn .label { display: none; }
    .wordmark { font-size: 24px; }
  }
  :root[data-motion="off"] .art.entering { animation: none; }
  :root[data-motion="off"] .paper .disc, :root[data-motion="off"] .paper .disc.is-on, :root[data-motion="off"] .o-disc, :root[data-motion="off"] .cam, :root[data-motion="off"] .layer, :root[data-motion="off"] .gallery { transition: none; }
  :root[data-motion="off"] .gallery .pin { animation: none; }
  :root[data-motion="off"] .layer.burner .slot img { transition: none; }
  /* the theme switch (index.html swapTheme): one crossfade of the whole page; nothing else eases meanwhile */
  :root.theme-swap, :root.theme-swap * { transition: none !important; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 520ms; animation-timing-function: cubic-bezier(.4, 0, .2, 1); }
  :root[data-theme-to="light"]::view-transition-old(root), :root[data-theme-to="light"]::view-transition-new(root) { animation-duration: 760ms; animation-timing-function: cubic-bezier(.5, 0, .3, 1); }
  :root[data-motion="off"]::view-transition-old(root), :root[data-motion="off"]::view-transition-new(root) { animation-duration: 180ms; }

  /* ================= calibration flow (calibrate.js) ================= */
  .back { margin-left: -18px; }
  .back[hidden] { display: none; }
  /* the back button and the wordmark share the top-left corner: one shows at a time */
  .top > .back + .wordmark { margin-right: auto; }
  .top > .back:not([hidden]) { margin-right: auto; }
  :root[data-mode="cal"] .gallery { display: none; }
  #sound[aria-pressed="true"] .icon.off, #sound[aria-pressed="false"] .icon.on { display: none; }
  /* a command to copy (a CD burned outside the core): data, so mono; wraps instead of scrolling */
  .cal .cal-cmd { font: 13px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg-2);
    padding: 10px 12px; border-radius: 4px; user-select: all; margin: 8px 0; }
  @media (max-width: 560px) { #sound { display: none; } }   /* no room in the header: the settings menu has it too */
  :root[data-mode="cal"] .layer.ghost, :root[data-mode="cal"] .layer.solid { opacity: .1 !important; }
  /* Keep the whole step between the fixed corner rows. Tall steps scroll here,
     rather than growing upwards into the header or down behind the footer. */
  .cal { position: fixed; z-index: 2; right: var(--edge); top: calc(var(--edge) + var(--row) + 16px);
    bottom: calc(var(--foot) + 16px); width: min(600px, 40vw); display: grid; grid-template-columns: minmax(0, 1fr);
    grid-auto-rows: max-content; align-content: safe center; gap: 18px; overflow-y: auto; scrollbar-gutter: stable;
    padding: 2px; overflow-wrap: anywhere; }
  .cal > * { min-width: 0; }
  .cal-body { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 18px; }
  .cal[hidden] { display: none; }
  /* the step ruler in the header's middle (calibrate.js paintRuler): segment length = how long the step takes */
  .cal-ruler { position: fixed; z-index: 3; top: var(--edge); left: 50%; translate: -50% 0; width: min(620px, 44vw); height: var(--row);
    display: flex; gap: 10px; align-items: stretch; pointer-events: none; }
  .cal-ruler[hidden] { display: none; }
  .cal-ruler .step { min-width: 5.2em; display: grid; grid-template-rows: 1fr auto auto; gap: 4px; }   /* a short step still has room for its name */
  .cal-ruler .name { align-self: end; font-size: 15px; font-weight: 600; font-stretch: 110%; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
  .cal-ruler .step[data-s="done"] .name { color: var(--ink-2); }
  .cal-ruler .step[data-s="now"] .name { color: var(--ink); }
  .cal-ruler .tick { width: 12px; height: 12px; fill: none; stroke: var(--ink); stroke-width: 1.6; flex: none; }
  .cal-ruler .line { position: relative; height: 3px; background: var(--rule); border-radius: 0; }
  .cal-ruler .step[data-s="done"] .line { background: var(--ink); }
  .cal-ruler .step[data-s="now"] .line { background: color-mix(in srgb, var(--copper) 30%, var(--rule)); }
  .cal-ruler .line i { position: absolute; inset: 0 auto 0 0; background: var(--copper); }
  .cal-ruler .step[data-dashed] .line { height: 0; background: none; border-top: 3px dotted var(--rule-strong); }
  .cal-ruler .len { font: 12px var(--mono); color: var(--ink-3); white-space: nowrap; }
  .cal-ruler .step[data-s="now"] .len { color: var(--copper); }
  @media (max-width: 900px) { .cal-ruler { display: none; } }
  /* the calibration stage (calstage.js): the burner from straight above, its shell see-through, the disc in front */
  :root.cal-staged { --cal-top: calc(var(--edge) + 2 * var(--row)); --cal-bottom: calc(var(--foot) + 16px); }
  .cal-stage { position: fixed; z-index: 1; left: var(--edge); top: var(--cal-top); bottom: var(--cal-bottom);
    right: calc(var(--edge) + min(600px, 40vw) + 40px); display: grid; place-items: center; pointer-events: none; container-type: size; }
  .cal-stage[hidden] { display: none; }
  /* newplan.js: the camera pans to the scene; what lies on the glass (paper, ruler) waits, then is laid down */
  :root.pan-in :is(.cal-stage, .ld) { translate: 100vw 0; }
  :root.pan-in :is(#cal, #cal-ruler) { opacity: 0; }
  /* the glass (see --glass-*): new-work and calibration pages first */
  :root:is([data-mode="newplan"], [data-mode="presets"], [data-mode="faxnews"]) .top > * { filter: var(--glass-desk-drop); }
  :root[data-mode="newplan"] .top > :is(.back, .wordmark) { filter: var(--glass-drive-drop); }      /* over the drive */
  :root[data-mode="presets"] .top > :is(.back, .wordmark) { filter: var(--glass-drive-drop); }      /* over the letter tray */
  :root:is([data-mode="newplan"], [data-mode="cal"], [data-mode="presets"], [data-mode="faxnews"]) .bar > .job { filter: var(--glass-desk-drop); }
  :root[data-mode="cal"] .cs-big { filter: var(--glass-desk-drop); }                                    /* so are the big percent and its time */
  /* The paper and drive share a vertical centre. Its heading stays outside the scroll area. */
  :root.cal-staged .cal { position: fixed; top: var(--cal-top); bottom: var(--cal-bottom); height: fit-content; margin-block: auto;
    max-height: calc(100dvh - var(--cal-top) - var(--cal-bottom)); align-content: start; padding: 30px 32px;
    border-radius: 2px; box-shadow: var(--paper-desk); background: var(--cal-paper, var(--paper)); }
  :root.cal-staged .cal:has(> .cal-body) { grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
  :root.cal-staged .cal-body { overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable;
    scrollbar-width: thin; scrollbar-color: var(--ink-3) transparent; padding: 4px; margin: -4px; scroll-padding-block: 4px; }
  :root[data-theme="dark"].cal-staged .cal { --cal-paper: var(--lit-paper);
    --ink: var(--lit-ink); --ink-2: var(--lit-ink-2); --ink-3: var(--lit-ink-3);
    --rule: color-mix(in srgb, var(--lit-ink) 22%, transparent); --copper: var(--lit-copper);
    color: var(--ink); }   /* lit paper: ink words (night B; newplan.css .np-sheet) */
  .cs-art { position: relative; width: min(100cqw, calc(100cqh * var(--cs-aspect))); }
  .cs-art > img, .cs-art > canvas { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; }
  .cs-art .cs-disc { opacity: .62; }                         /* the pickup shows through the disc */
  .cs-art .cs-occluders { opacity: .45; }                    /* the clamp bridge: structure, not a wall over the disc */
  .cs-art .cs-lid { opacity: .2; transition: opacity var(--t) var(--ease); }    /* the see-through top shell */
  .cs-art.busy .cs-lid { opacity: .28; }
  .cs-art > .cs-spin { display: none; overflow: visible; }
  .cs-art.spinning > .cs-spin { display: block; }
  .cs-spin path { fill: none; stroke: var(--ink); stroke-opacity: .4; stroke-width: 6; stroke-linecap: round; }
  :root[data-motion="on"] .cs-art.spinning > .cs-spin { animation: cs-spin 1.6s linear infinite; transform-origin: var(--spin-o, 50% 50%); }
  @keyframes cs-spin { to { rotate: 360deg; } }
  .cs-art[data-disc="none"] .cs-disc { opacity: 0; }
  :root[data-theme="dark"] .cs-art .cs-glow { mix-blend-mode: plus-lighter; }
  .cs-label { position: absolute; left: 0; top: 0; translate: 14px -50%; padding: 3px 8px; border: 1px solid var(--rule-strong); border-radius: 4px;
    background: var(--paper); color: var(--ink); font: 14px var(--mono); white-space: nowrap; }
  .cs-label[hidden] { display: none; }
  .cs-big { position: absolute; left: 0; bottom: 0; margin: 0; display: grid; gap: 2px; }
  .cs-big[hidden] { display: none; }
  .cs-big b { font-size: clamp(48px, 5vw, 84px); font-weight: 800; font-stretch: 120%; line-height: 1; font-variant-numeric: tabular-nums; }
  .cs-big > span { color: var(--ink-2); font-size: 18px; }
  .cs-big > span, .cal-next-time { font-variant-numeric: tabular-nums; }
  /* with the stage up, the library scene behind calibration steps back entirely */
  :root[data-mode="cal"].cal-staged .stage, :root[data-mode="cal"].cal-staged .stage * { visibility: hidden !important; }
  :root.cal-staged .floor-log, :root.cal-staged .cal-plate, :root.cal-staged .flyer, :root.cal-staged .warn-sign, :root.cal-staged .drive-led, :root.cal-staged .parcel { display: none !important; }
  /* the measurement record on the paper: the last few readings, as a strip of instrument tape */
  .cal .cal-tape { margin: 0; font: 14px/1.7 var(--mono); color: var(--ink-2); white-space: pre; overflow: hidden; }
  .cal .cal-say { margin: 0; font-size: 17px; line-height: 1.6; color: var(--ink); max-width: 34em; }
  .cal svg.chart .now { stroke: var(--ink-3); stroke-dasharray: 3 4; stroke-width: 1; }
  .cal svg.chart .axis { stroke: var(--ink-3); stroke-width: 1; }
  .cal svg.chart .still { fill: var(--ink-3); font-size: 15px; }
  .cal svg.chart text { fill: var(--ink-3); font: 13px var(--mono); }
  /* narrow windows: the stage on top, the paper under it scrolling on its own; the side button gives way */
  @media (max-width: 900px) {
    :root.cal-staged { --cal-top: calc(var(--edge) + var(--row) + 16px); --cal-drive-height: min(30dvh, 260px); }
    .cal-stage { right: var(--edge); bottom: auto; height: var(--cal-drive-height); }
    .cs-big { left: auto; right: 0; text-align: right; }
    .cs-big b { font-size: 44px; }
    :root.cal-staged .cal { --cal-sheet-top: calc(var(--cal-top) + var(--cal-drive-height) + 12px);
      top: var(--cal-sheet-top); left: var(--edge); width: auto; margin-block: 0;
      max-height: calc(100dvh - var(--cal-sheet-top) - var(--cal-bottom)); padding: 18px 20px; }
    :root.cal-staged.cal-photo .cal { --cal-sheet-top: calc(var(--cal-top) + 40vh + 8px); }
  }
  @media (max-width: 820px) {
    :root[data-mode="cal"].cal-staged :is(body, .stage) { overflow: clip; }
  }
  /* the verdict: a stamp of equal weight whatever it says, then what it means, for the picture, and now */
  .cal .cal-stamp { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 18px; align-items: start; padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .cal .cal-stamp b { grid-row: span 3; padding: 4px 12px; border: 2px solid var(--ink); border-radius: 4px; font-weight: 800; font-stretch: 112%; white-space: nowrap; }
  .cal .cal-stamp dl { display: contents; }
  .cal .cal-stamp div { display: grid; grid-template-columns: 6em minmax(0, 1fr); gap: 12px; font-size: 16px; }
  .cal .cal-stamp dt { color: var(--ink-3); } .cal .cal-stamp dd { margin: 0; }
  .cal .cal-stamp dd.act { color: var(--copper); font-weight: 600; }
  @media (max-width: 560px) {
    .cal .cal-stamp:not([data-adoption]) { grid-template-columns: minmax(0, 1fr); }
    .cal .cal-stamp:not([data-adoption]) b { grid-row: auto; justify-self: start; }
  }
  .cal-callback { position: fixed; z-index: 5; left: 50%; bottom: calc(var(--foot) + 16px); translate: -50% 0; display: flex; gap: 14px; align-items: center;
    padding: 10px 12px 10px 16px; border: 1px solid var(--copper); border-radius: 8px; background: var(--paper); color: var(--ink); font-size: 17px; }
  .cal-callback[hidden] { display: none; }
  .cal-callback button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 4px; background: var(--ink); color: var(--paper); font: inherit; cursor: pointer; }
  .cal .steps { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0 0 6px; padding: 0; list-style: none; font-size: 17px; font-weight: 600; font-stretch: 110%; color: var(--ink-3); }
  .cal .steps li[aria-current="step"] { color: var(--ink); }
  .cal .steps li.done { color: var(--ink-2); }
  .cal h2 { margin: 0; font-weight: 800; font-stretch: 118%; font-size: clamp(32px, 3vw, 52px); line-height: 1.08; text-wrap: balance; }
  .cal .lede { margin: 0; color: var(--ink-2); font-size: 19px; max-width: 34em; }
  /* the other way round a step (burn the measurement image with another program): one quiet line */
  .cal .cal-budget, .cal .cal-recovery, .cal .cal-details { font-size: 16px; line-height: 1.6; color: var(--ink); }
  .cal .cal-budget ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
  .cal .cal-recovery .note p { margin: 0; color: var(--ink); }
  .cal .cal-budget p { margin: 12px 0 0; }
  .cal details summary { cursor: pointer; min-height: 44px; display: list-item; align-content: center; color: var(--ink); }
  .cal details pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/1.6 var(--mono); }
  .cal .cal-details { border-top: 1px solid var(--rule); }
  .cal .cal-advanced { padding-inline-start: 16px; }
  .cal .cal-aside { margin: 0; color: var(--ink-3); font-size: 15px; font-weight: 400; line-height: 1.6; max-width: 40em; }
  .cal .cal-aside code { font: 13px var(--mono); color: var(--ink-2); word-break: break-all; }
  .cal .cal-aside .btn { min-height: 0; padding: 2px 6px; margin-left: -6px; font-size: 15px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .cal .choices { display: grid; gap: 10px; }
  .cal .choice { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px 12px; align-items: start; padding: 16px 18px; border: 1px solid var(--rule-strong); border-radius: 4px; cursor: pointer; }
  .cal .choice:has(input:checked) { border-color: var(--ink); }
  .cal .choice input { margin: 4px 0 0; accent-color: var(--ink); width: 18px; height: 18px; }
  .cal .choice b { font-size: 18px; font-weight: 600; }
  .cal .choice span { grid-column: 2; color: var(--ink-2); font-size: 16px; }
  .cal .readout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 24px; margin: 0; }
  .cal .readout dt { font-size: 15px; color: var(--ink-3); }
  .cal .readout dd { margin: 2px 0 0; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cal .note { display: flex; gap: 10px; align-items: flex-start; font-size: 18px; padding: 12px 14px; margin: 0; border-radius: 4px; }
  .cal .note p { min-width: 0; }
  /* a new warning flashes a pale orange three times, then rests */
  .cal .note.flash { animation: note-flash 520ms ease-in-out 3; }
  @keyframes note-flash { 50% { background: color-mix(in srgb, var(--copper) 18%, transparent); } }
  .cal .note .icon { flex: none; width: 24px; height: 24px; margin-top: 2px; }
  .cal .note[data-s="good"] { color: var(--good); } .cal .note[data-s="warn"] { color: var(--warn); } .cal .note[data-s="error"] { color: var(--copper); font-weight: 700; } .cal .note[data-s="unknown"] { color: var(--unknown); }
  
  .cal .note p { margin: 0; } .cal .note small { display: block; color: var(--ink-2); font-size: 16px; margin-top: 4px; }
  .cal .demo { justify-self: start; min-height: 44px; padding: 0 16px; border: 1px dashed var(--rule-strong); border-radius: 4px; background: none; color: var(--ink-2); cursor: pointer; font: inherit; font-size: 15px; }
  .cal .demo:hover { color: var(--ink); border-color: var(--ink-3); }
  .cal .chart { width: 100%; height: auto; display: block; }
  .cal .chart .axis { stroke: var(--rule-strong); stroke-width: 1; fill: none; }
  .cal .chart .grid { stroke: var(--rule); stroke-width: 1; }
  .cal .chart text { fill: var(--ink-3); font: 13px var(--font); font-variant-numeric: tabular-nums; }
  .cal .chart .band { fill: color-mix(in srgb, var(--copper) 18%, transparent); }
  .cal .chart .fit { stroke: var(--copper); stroke-width: 2; fill: none; }
  .cal .chart .pt { fill: var(--ink); } .cal .chart .bar { position: static; display: inline; stroke: var(--ink-3); stroke-width: 1.2; }
  .cal .chart .pt.new { animation: pt-in 300ms var(--ease) both; }
  @keyframes pt-in { from { opacity: 0; transform: translateY(-6px); } }
  .cal .qr { width: 168px; height: 168px; border: 1px solid var(--rule-strong); display: grid; place-items: center; color: var(--ink-3); font-size: 15px; background:
      repeating-linear-gradient(0deg, transparent 0 11px, var(--rule) 11px 12px), repeating-linear-gradient(90deg, transparent 0 11px, var(--rule) 11px 12px); }
  .cal .row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .cal .name-field { display: grid; gap: 8px; margin-top: 18px; font-size: 17px; color: var(--ink-2); }
  .cal .name-field input { min-width: 0; min-height: 44px; font: inherit; font-size: 20px; color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--rule-strong); padding: 6px 0; caret-color: var(--copper); }
  .cal .name-field input:focus-visible { outline: none; border-bottom-color: var(--ink); }
  .cal .count-input { display: flex; align-items: center; gap: 12px; font-size: 18px; }
  .cal .count-input input { width: 92px; min-height: 52px; padding: 0 12px; border: 1px solid var(--rule-strong); border-radius: 4px; background: transparent; color: var(--ink); font: 600 22px var(--font); font-variant-numeric: tabular-nums; }

  /* the job in the bar: what runs, how far (rainbow by radius for disc jobs), time left, cancel */
  .job { display: grid; grid-template-columns: auto minmax(120px, 1fr) auto auto; align-items: center; gap: 16px; min-width: 0; }
  .job[hidden] { display: none; }
  .job-name { min-width: 0; text-align: left; background: none; color: inherit; border: 0; padding: 0; font: inherit;
    font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job-name:enabled { min-height: 44px; text-decoration: underline; text-underline-offset: .18em; cursor: pointer; }
  /* The bar is the core's progress bar (ui.Progress) in the page: the media's colours laid along the whole
     track, so a colour stays where it is as the fill grows over it; a glint running down the done part every
     few seconds; a bright tip, and a short flash when the percentage goes up (api.jobProgress sets --p and
     the flash). Without motion: the fill alone. */
  @property --p { syntax: "<number>"; inherits: true; initial-value: 0; }
  .job-bar { --p: 0; --job-grad: var(--dvd); position: relative; height: 6px; border-radius: 2px; background: var(--rule); overflow: hidden;
    transition: --p 450ms var(--ease); }
  .job-bar[data-media="cd"] { --job-grad: var(--cd); }
  .job-bar[data-media="bd"] { --job-grad: var(--bd); }
  .job-fill { position: absolute; inset: 0; background: var(--job-grad); clip-path: inset(0 calc((1 - var(--p)) * 100%) 0 0); }
  .job-fill::after { content: ""; position: absolute; top: 0; bottom: 0; left: -24%; width: 22%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .7), transparent); }
  :root[data-motion="on"] .job-fill::after { animation: job-glint 4s cubic-bezier(.4, 0, .3, 1) infinite; }
  @keyframes job-glint { 0% { left: -24%; } 30%, 100% { left: calc(var(--p) * 100%); } }
  .job-bar::after { content: ""; position: absolute; top: 0; bottom: 0; left: calc(var(--p) * 100%); width: 4px; translate: -100% 0;
    background: rgba(255, 255, 255, .55); box-shadow: 0 0 6px rgba(255, 255, 255, .6); opacity: calc(var(--p) * 100); }
  :root[data-motion="on"] .job-bar.grew .job-fill { animation: job-grew 400ms ease-out; }
  :root[data-motion="on"] .job-bar.grew::after { animation: job-grew 400ms ease-out; }
  @keyframes job-grew { from { filter: brightness(1.45) saturate(1.2); } }
  :root[data-motion="off"] .job-bar { transition: none; }
  :root[data-motion="off"] .job-bar::after { box-shadow: none; }
  .job-time { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar:has(.job:not([hidden])) .drive { display: none; }
  @media (max-width: 900px) {
    :root[data-home="lobby"]:is(:not([data-mode]), [data-mode=""]) .bar:has(> .job:not([hidden])) { height: auto; gap: 4px 16px; }
    :root[data-home="lobby"]:is(:not([data-mode]), [data-mode=""]) .bar > .job { grid-column: 1 / -1; grid-row: 2; }
    .job { grid-template-columns: minmax(0, auto) minmax(20px, 1fr) auto auto; gap: 8px; }
  }
  @media (max-width: 760px) {
    :root[data-mode="cal"] .job { grid-template-columns: auto minmax(16px, 1fr) auto auto; gap: 8px; }
    /* The burn job already shows its status. Give its stop control the whole footer row. */
    :root[data-mode="cal"] .bar:has(.job:not([hidden]) .job-cancel:not(.btn-icon)) > .job {
      grid-column: 1 / -1; grid-template-columns: auto minmax(16px, 1fr) minmax(0, max-content) auto; gap: 8px;
    }
    :root[data-mode="cal"] .bar:has(.job:not([hidden]) .job-cancel:not(.btn-icon)) > .next:disabled { display: none; }
    :root[data-mode="cal"] .job:has(.job-cancel:not(.btn-icon)) .job-time { overflow: hidden; text-overflow: ellipsis; }
    :root[data-mode="cal"] .job > .burn-stop { width: min(420px, 100%); max-height: calc(100dvh - var(--foot) - 32px); overflow: auto; }
  }

  /* pieces of the calibration scene, all inside the camera layer so they pan with it */
  .floor { width: 100%; aspect-ratio: 1; transform: matrix(0.866, 0.5, -0.866, 0.5, 0, 0); }
  .cal-plate { position: absolute; z-index: 3; transform: translate(-50%, -50%); pointer-events: none; opacity: 0; transition: opacity 400ms var(--ease); }
  .cal-plate.on { opacity: 1; }
  .cal-plate canvas { width: 100%; height: 100%; display: block; }
  .cal-plate.breathe .floor { animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .6; } }

  /* the inside of the drive while it burns: a big cutaway over the left half, grown out of the
     drive picture (transform and opacity only); the scene behind it steps back */
  .cutaway { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity 500ms var(--ease); }
  .cutaway.on { opacity: 1; }
  .cutaway-in { position: absolute; transform-origin: 0 0; transition: transform 800ms var(--ease); container-type: inline-size; }
  .cutaway .inside { position: absolute; inset: 0; transform: scaleX(-1); }
  .cutaway .inside img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cutaway .sled, .cutaway .glow { transform: translate(var(--sled, 0, 0)); transition: transform 120ms linear; }
  .cutaway .inside.dark .disc { opacity: .5; }
  .cutaway .inside.dark .glow { mix-blend-mode: screen; }
  .cutaway .glow { animation: laser 1.6s ease-in-out infinite; }
  @keyframes laser { 50% { opacity: .72; } }
  .cutaway .occ { opacity: .75; }
  .cutaway .inside.dark, :root[data-theme="dark"] .cutaway .inside.light { display: none; }
  :root[data-theme="dark"] .cutaway .inside.dark { display: block; }
  .layer.burner .rig { transition: opacity 450ms var(--ease); }
  .layer.burner.inside-on .rig { opacity: 0; }
  .cam { transition: transform 700ms var(--ease), opacity 600ms var(--ease); }
  :root.burning .cam { opacity: .14; }
  /* type lying flat inside: the percentage on the disc, the time left on the tray floor */
  .inside-type { position: absolute; transform: translate(-50%, -50%) matrix(0.866, 0.5, -0.866, 0.5, 0, 0);
    font-weight: 700; font-size: 4.2cqw; font-variant-numeric: tabular-nums; letter-spacing: .02em; color: var(--ink); opacity: .92; white-space: nowrap; }
  .inside-type.big { font-size: 6.6cqw; font-weight: 800; font-stretch: 112%; }
  :root[data-motion="off"] .cutaway-in { transition: none; } :root[data-motion="off"] .cutaway .glow { animation: none; }

  /* the parcel: the measurement image, a small box beside the drive with its disc printed on the lid */
  .parcel { position: absolute; z-index: 3; pointer-events: none; opacity: 0; transform: translate(0, 12px); transition: opacity 450ms var(--ease), transform 450ms var(--ease); }
  .parcel.on { opacity: 1; transform: none; }
  .parcel.ship { opacity: 0; transform: translate(14%, -6%) scale(.6); transition: opacity 800ms var(--ease), transform 800ms cubic-bezier(.5, 0, .7, .4); }
  .parcel svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .parcel polygon, .parcel polyline { stroke: var(--ink); stroke-opacity: .55; stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .parcel .lid { fill: #e3d2b4; } .parcel .side-l { fill: #cdb995; } .parcel .side-r { fill: #bba57f; }
  .parcel .tape { fill: #efe4cc; stroke-opacity: .3; } .parcel .tape-edge { fill: none; stroke-opacity: .3; }
  :root[data-theme="dark"] .parcel .lid { fill: #4e4335; } :root[data-theme="dark"] .parcel .side-l { fill: #413729; } :root[data-theme="dark"] .parcel .side-r { fill: #362e22; }
  :root[data-theme="dark"] .parcel .tape { fill: #5d5141; }
  .parcel .lid-print { position: absolute; }
  .parcel .lid-print canvas { width: 100%; height: 100%; display: block; }

  /* The job's command-line output and its step's name, lying on the floor in front of the drive
     (floor-log.js): in the floor's plane like .inside-type, lines running down to the right. Fixed on the
     screen (placed and, in a small window, scaled by the script inside the free part of the window), with
     a soft patch of the page's ground under it so it stands off the drawing. Newest line in full ink, older
     ones fading upwards. */
  .layer.burner .burner-frame { position: absolute; container-type: inline-size; pointer-events: none; }
  .floor-log { position: fixed; z-index: 2; transform-origin: 0 0; transform: matrix(.866, .5, -.866, .5, 0, 0); padding: 14px 18px 12px;
    font: 600 15px/1.5 var(--mono); letter-spacing: -.01em; color: var(--ink-2); white-space: pre; pointer-events: none;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--paper) 82%, transparent), color-mix(in srgb, var(--paper) 55%, transparent) 70%, transparent);
    opacity: 0; transition: opacity 500ms var(--ease); }
  /* faint: it balances the drawing in a wide window; the panel on the right is what you read. Hidden when
     the window leaves it too little floor (cramped), and then the panel shows the step's title again. */
  .floor-log.on { opacity: .5; }
  .floor-log.cramped { visibility: hidden; opacity: 0; }
  /* the step's name: up to three lines rather than cut off (the script scales the whole block in a small window) */
  .floor-log .fl-title { font: 800 34px/1.12 var(--font); font-stretch: 112%; letter-spacing: .02em; color: var(--ink); margin-bottom: 8px;
    white-space: normal; text-wrap: balance; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .floor-log .fl-lines > *, .floor-log .fl-meter { overflow: hidden; text-overflow: ellipsis; }
  .floor-log .fl-line { opacity: calc(1 - var(--age, 0) * .13); }
  .floor-log .fl-line:last-child { color: var(--ink); }
  .floor-log .command { color: var(--ink-3); }
  .floor-log .warning { color: var(--copper); }
  .floor-log .error { color: var(--warn); }
  .floor-log .fl-meter { min-height: 1.5em; margin-top: 4px; color: var(--ink); }
  /* while the title lies on the floor, the panel keeps it only for screen readers */
  :root:not(.fl-off) .cal.floor-titled > h2 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  /* the disc that flies in (printed with its model) or lifts out, with its arrow */
  .flyer { position: absolute; left: 0; top: 0; z-index: 4; transform: translate(-50%, -50%); pointer-events: none; opacity: 0;
    transition: transform 1400ms cubic-bezier(.25, .6, .3, 1), opacity 400ms var(--ease); }
  .flyer.on { opacity: 1; }
  .flyer.drop { transition: transform 950ms cubic-bezier(.45, .05, .75, .55); }
  .flyer .face { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle, transparent 0 6.2%, var(--paper-2) 6.4% 19%, color-mix(in srgb, var(--paper) 70%, var(--ink) 6%) 19.5% 100%);
    box-shadow: inset 0 0 0 1.5px var(--ink), inset 0 0 0 9px color-mix(in srgb, var(--paper) 80%, transparent); }
  .flyer .face::before { content: ""; position: absolute; inset: 37%; border-radius: 50%; box-shadow: 0 0 0 1px var(--ink-3); }
  .flyer .print { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .flyer .print text { font: 800 7.6px var(--font); font-stretch: 118%; letter-spacing: .06em; fill: var(--ink); }
  .flyer.hover .floor { animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: matrix(0.866, 0.5, -0.866, 0.5, 0, -8); } }
  .flyer .arrow { position: absolute; left: 50%; top: 92%; width: 26px; height: 44px; margin-left: -13px; fill: none; stroke: var(--copper); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity 300ms; }
  .flyer.hover .arrow { opacity: 1; animation: point 1.6s ease-in-out infinite; }
  .flyer.up .arrow { top: auto; bottom: 92%; transform: rotate(180deg); }
  @keyframes point { 50% { translate: 0 8px; } }
  .flyer.up.hover .arrow { animation-name: point-up; }
  @keyframes point-up { 50% { translate: 0 -8px; } }

  /* the problem sign: an exclamation mark standing over the drive, parallel to its front */
  .warn-sign { position: absolute; z-index: 4; transform: translate(-50%, -100%); pointer-events: none; opacity: 0; transition: opacity 300ms var(--ease); }
  .warn-sign.on { opacity: 1; }
  .warn-sign { transform: translate(-50%, -50%); }
  .warn-sign .flat { transform: matrix(0.866, -0.5, 0.866, 0.5, 0, 0); animation: warn-pulse 1.6s ease-in-out infinite; }
  @keyframes warn-pulse { 50% { opacity: .55; } }
  .warn-sign span { display: block; font-weight: 900; font-stretch: 100%; font-size: 190px; line-height: 1; color: #c9772f; -webkit-text-stroke: 2px color-mix(in srgb, var(--ink) 40%, transparent); }
  :root[data-theme="dark"] .warn-sign span { color: #e2a24f; }
  @keyframes bob-up { 50% { translate: 0 -8px; } }

  /* the drive's activity light */
  .drive-led { position: absolute; z-index: 3; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: #f0a640; box-shadow: 0 0 8px 2px #f0a64088; opacity: 0; pointer-events: none; }
  .drive-led.on { animation: led 0.5s steps(2, jump-none) infinite; }
  @keyframes led { 0% { opacity: 1; } 100% { opacity: .1; } }

  .cal .placed { min-height: 52px; padding: 0 24px; border: 1.5px solid var(--ink); border-radius: 4px; background: transparent; color: var(--ink); font: 600 18px var(--font); cursor: pointer; }
  .cal .placed:hover { background: var(--paper-2); }
  .cal .choice:has(input:disabled) { opacity: .5; cursor: default; }

  /* hold to confirm: the next button fills from the left while held */
  .next.hold { position: relative; overflow: hidden; }
  .next.hold::before { content: ""; position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--hold, 0)); background: var(--arc-flat, #8a6a3c); opacity: .55; }
  .next.hold > * { position: relative; }
  :root.cal-staged:has(.next-confirm) { --cal-bottom: calc(var(--foot) + 80px); }
  :root:has(.next-confirm) .burn-page { bottom: calc(var(--foot) + 80px); }
  :root[data-motion="off"] .cal-plate.breathe .floor, :root[data-motion="off"] .cal .chart .pt.new, :root[data-motion="off"] .flyer.hover .floor, :root[data-motion="off"] .flyer .arrow, :root[data-motion="off"] .warn-sign .flat, :root[data-motion="off"] .cal .note.flash { animation: none !important; } :root[data-motion="off"] .flyer, :root[data-motion="off"] .flyer.drop { transition: opacity 0s; } :root[data-motion="off"] .drive-led.on { animation: none; opacity: 1; }
  @media (max-width: 820px) { .cal { position: static; transform: none; width: auto; padding: 8px var(--edge) 120px; } }
</style>
