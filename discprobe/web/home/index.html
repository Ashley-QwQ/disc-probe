<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>disc-probe</title>
<script>
  // before the first paint, so a dark page never flashes light
  (function () {
    var t = null;
    try { t = localStorage.getItem("dp-theme"); } catch (e) {}
    document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    // motion: this page's own setting (Settings), else the system's; ?motion forces it on
    var m = null;
    try { m = localStorage.getItem("dp-motion"); } catch (e) {}
    var on = /[?&]motion(\b|=)/.test(location.search) || m === "on" || (m !== "off" && !matchMedia("(prefers-reduced-motion: reduce)").matches);
    document.documentElement.dataset.motion = on ? "on" : "off";
    var l = null;
    try { l = localStorage.getItem("dp-lang"); } catch (e) {}
    l = l || ((navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh" : "en");
    document.documentElement.lang = l === "zh" ? "zh-CN" : "en";
    document.documentElement.dataset.lang = l;
  })();
</script>
<style>
  @font-face { font-family: "Archivo"; src: url(../fonts/Archivo-VF-latin.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  :root {
    color-scheme: light;
    --paper: #ebe7e0; --paper-2: #e4dfd7; --ink: #1d1b18; --ink-2: #5d5850; --ink-3: #8a847a;
    --rule: #cfc9bf; --rule-strong: #a9a297; --copper: #a8693c;
    --good: #3f7d55; --warn: #9a6a14; --unknown: #6f6a62;
    /* the TUI's DVD title colours (banner.TITLE_HUES dvd: OKLCH hue .80 to 1.02 turns), darker on paper */
    --dvd: linear-gradient(90deg, #7262c6, #8d58b7, #a150a1, #b04985, #ba4765);
    --font: "Archivo", system-ui, "Microsoft YaHei UI", "PingFang SC", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --edge: clamp(20px, 3.2vw, 56px);
    --t: 260ms; --ease: cubic-bezier(.2, .8, .2, 1); --io: cubic-bezier(.65, 0, .35, 1);
    --over: cubic-bezier(.34, 1.45, .55, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #161d1c; --paper-2: #1f2827; --ink: #ecebe4; --ink-2: #aeb3ab; --ink-3: #7f8780;
    --rule: #2c3634; --rule-strong: #46514e; --copper: #d9a75c;
    --good: #8fca9a; --warn: #e2b866; --unknown: #aeb3ab;
    --dvd: linear-gradient(90deg, #a79aff, #c58ff3, #dc86db, #ee81bc, #f87f9a);
  }
  :root.idle :not(.live, .live *), :root.idle :not(.live, .live *)::before, :root.idle :not(.live, .live *)::after { animation-play-state: paused !important; }
  :root[data-motion="off"] { --t: 0ms; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--font); overflow: hidden; transition: background-color var(--t) var(--ease), color var(--t) var(--ease); }
  ::selection { background: #d6cfc3; }
  :root[data-theme="dark"] ::selection { background: #3a4542; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  button { font: inherit; color: inherit; }

  /* ---- stage ---- */
  .stage { position: fixed; inset: 0; }
  .art { position: absolute; left: 4vw; top: 41%; width: min(108vw, 2000px); aspect-ratio: 1600 / 1000; transform: translateY(-50%); }
  .cam { position: absolute; inset: 0; transition: transform 700ms var(--ease); will-change: transform; }
  .layer { position: absolute; inset: 0; pointer-events: none; transition: opacity 420ms var(--ease); will-change: opacity; }
  .layer.solid[data-depth="0"] .disc { pointer-events: auto; }
  img.layer { width: 100%; height: 100%; display: block; }
  /* a solid row that is not in focus is fully transparent: take it out of painting once faded */
  .layer.solid { visibility: hidden; transition: opacity 420ms var(--ease), visibility 0s linear 420ms; }
  .layer.solid[data-depth="0"] { visibility: visible; transition: opacity 420ms var(--ease), visibility 0s; }
  .layer svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .layer.burner img { position: absolute; display: block; pointer-events: none; }
  /* air perspective, the cheap way: each row is its own layer; rows not in focus become line
     drawings (filled with the page colour so they still hide what is behind) and fade with
     distance. Only opacity changes, so the browser composites instead of repainting. */
  .layer.solid { opacity: 0; }
  .layer.solid[data-depth="0"] { opacity: 1; }
  .layer.ghost[data-depth="0"] { opacity: 0; }
  :is(.layer.ghost, .layer.burner)[data-depth="1"] { opacity: .5; }
  :is(.layer.ghost, .layer.burner)[data-depth="2"] { opacity: .3; }
  :is(.layer.ghost, .layer.burner)[data-depth="3"] { opacity: .2; }
  .layer.ghost[data-front="true"] { opacity: .16; }
  :root[data-live] .layer.ghost { display: none; }
  :root[data-live] .layer.solid[data-depth="1"] { opacity: .5; }
  :root[data-live] .layer.solid[data-depth="2"] { opacity: .3; }
  :root[data-live] .layer.solid[data-depth="3"] { opacity: .2; }
  :root[data-live] .layer.solid[data-front="true"] { opacity: .16; }
  /* the burner rig: body, and the tray sliding in its slot (closed = moved in by --slide) */
  .disc.new-slot :is(.iso-fill, .iso-top, .iso-shade) { fill: none !important; }
  .disc.new-slot :is(.aura, .sheen, .glint) { display: none; }
  .disc.new-slot .iso-line { stroke-dasharray: 5 4; }
  #state.is-new .facts { display: none; }
  .layer.burner .rig { position: absolute; }
  .layer.burner .rig > img, .layer.burner .slot { position: absolute; inset: 0; width: 100%; height: 100%; }
  .layer.burner .slot img { position: absolute; inset: 0; width: 100%; height: 100%; transform: translate(var(--slide)); transition: transform 900ms cubic-bezier(.45, 0, .2, 1); }
  .layer.burner.open .slot img { transform: translate(var(--open, 0, 0)); }
  .layer.burner .tray.full, .layer.burner.has-disc .tray.empty { visibility: hidden; }
  .layer.burner.has-disc .tray.full { visibility: visible; }
  .layer.burner .rig.dark, :root[data-theme="dark"] .layer.burner .rig.light { display: none; }
  :root[data-theme="dark"] .layer.burner .rig.dark { display: block; }
  /* the burner: one picture per theme, both loaded, the theme picks */
  .layer.burner img.dark, :root[data-theme="dark"] .layer.burner img.light { display: none; }
  :root[data-theme="dark"] .layer.burner img.dark { display: block; }   /* a row in front of the focus is foreground haze: keep it faint */
  .art.entering { animation: dolly 900ms var(--ease) both; }
  @keyframes dolly { from { opacity: 0; transform: translateY(-50%) scale(.965); } to { opacity: 1; transform: translateY(-50%) scale(1); } }


  /* each kind of disc keeps its own tint, from the TUI's media colours: DVD violet-pink, CD cyan, BD copper */
  .layer[data-row="dvd"] .paper.iso { --disc-top: #f3edf3; --disc-side: #ddd3e0; --rw-top: #e6dee8; --rw-side: #cbc0ce; --shelf-top: #f0eaf0; --shelf-side: #d9cfda; }
  .layer[data-row="cd"] .paper.iso { --disc-top: #ecf2f3; --disc-side: #d2dddf; --rw-top: #dfe7e8; --rw-side: #c3cfd1; --shelf-top: #eaf0f1; --shelf-side: #d1dadc; }
  .layer[data-row="bd"] .paper.iso { --disc-top: #f3ede5; --disc-side: #ded3c5; --rw-top: #e7dfd4; --rw-side: #cdc1b0; --shelf-top: #f0eae2; --shelf-side: #d9cec0; }
  :root[data-theme="dark"] .layer .paper.iso { --halo: #000; --halo-a: .5; }
  :root[data-theme="dark"] .layer[data-row="dvd"] .paper.iso { --disc-top: #2e2734; --disc-side: #221d28; --rw-top: #28222d; --rw-side: #1d1922; --shelf-top: #252029; --shelf-side: #1b171f; --on-top: #6f5a82; --on-side: #574669; }
  :root[data-theme="dark"] .layer[data-row="cd"] .paper.iso { --disc-top: #243134; --disc-side: #1a2528; --rw-top: #202b2d; --rw-side: #172123; --shelf-top: #1e282a; --shelf-side: #161f21; --on-top: #4e7279; --on-side: #3d5b61; }
  :root[data-theme="dark"] .layer[data-row="bd"] .paper.iso { --disc-top: #322c25; --disc-side: #26201a; --rw-top: #2b2620; --rw-side: #201c17; --shelf-top: #29241f; --shelf-side: #1f1b16; --on-top: #8b6e48; --on-side: #6e5638; }
  :root[data-theme="dark"] .paper .disc.is-on { --disc-top: var(--on-top); --disc-side: var(--on-side); --rw-top: var(--on-top); --rw-side: var(--on-side); }
  .layer .far { opacity: .5; }

  /* the gallery: a triangle floating over the CD stacks, pointing up-left (the way the racks run
     back), with the word lying on the floor plane under it. Faint until pointed at. */
  .gallery { position: absolute; z-index: 1; display: grid; justify-items: start; gap: 2px; padding: 0; border: 0; background: none; color: var(--ink); cursor: pointer; opacity: .42; pointer-events: auto;
    transform: translate(-50%, -50%); transition: left 700ms var(--ease), top 700ms var(--ease), opacity var(--t) var(--ease); }
  .gallery:hover, .gallery:focus-visible { opacity: .9; }
  .gallery .pin { display: block; width: 150px; height: 98px; animation: hover-float 3.2s ease-in-out infinite; }
  .gallery .pin svg { width: 100%; height: 100%; overflow: visible; transform: matrix(0.866, 0.5, -0.866, 0.5, 0, 0); }
  .gallery .pin path { fill: color-mix(in srgb, var(--paper) 60%, transparent); stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; }
  .gallery .pin .shade { fill: currentColor; opacity: .14; stroke: none; }
  /* the word lies on the floor too, written along the racks' width (up and to the right) */
  .gallery .word { display: block; font-weight: 800; font-stretch: 120%; font-size: 40px; line-height: 1; letter-spacing: .06em; transform: matrix(0.866, -0.5, 0.866, 0.5, 0, 0); margin: 6px 0 0 120px; }
  @keyframes hover-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  /* lifting: the chosen disc overshoots a little and settles; its neighbours follow late */
  .paper .disc { transition: transform 300ms var(--ease); }
  .paper .disc.is-on { transition: transform 460ms var(--over); }
  .paper .disc.is-on .iso-line[data-tone="lo"] { stroke: var(--copper); }
  :root[data-theme="dark"] .paper.iso { --anatomy-hi: #d5d9d2; --anatomy-mid: #7d8781; --anatomy-lo: #56615c; --anatomy-faint: #36413e; --anatomy-halo: #000; --anatomy-halo-opacity: .6; }
  :root[data-theme="dark"] .paper .iso-line[data-tone="hi"] { stroke-opacity: .55; }
  :root[data-theme="dark"] .paper .disc.is-on .aura { opacity: 1; }
  :root[data-theme="dark"] .paper .disc.is-on .iso-line[data-tone="lo"] { stroke: #f3e2c4; }

  /* ---- corners ---- */
  .corner { position: fixed; z-index: 2; }

  /* ===== the lobby: a desk, "new plan" on the left, "open plan" on the right (docs/goals/gui-outline.md 3.0).
     The shelf behind it is the disc library, reached from the header. ===== */
  .lobby { position: fixed; inset: 0; z-index: 1; display: none; background: var(--paper); }
  :root[data-home="lobby"]:is(:not([data-mode]), [data-mode=""]) .lobby { display: block; }
  :root[data-home="lobby"]:is(:not([data-mode]), [data-mode=""]) :is(.counter, .detail, .stage) { visibility: hidden; }
  /* the scene, labels and greeting: lobby.css / lobby.js */
  /* Settings: a small panel under its button (for now only animation) */
  .set-menu { position: fixed; z-index: 4; top: calc(var(--edge) + 58px); right: var(--edge); width: min(360px, calc(100vw - 2 * var(--edge))); padding: 14px 16px;
    background: var(--paper); color: var(--ink); border: 1px solid var(--rule-strong); border-radius: 3px; }
  .set-menu[hidden] { display: none; }
  .set-row { margin: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 600; }
  .set-seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 3px; overflow: hidden; }
  .set-seg button { min-height: 36px; padding: 0 12px; border: 0; background: none; color: var(--ink-2); font: 600 14px var(--font); cursor: pointer; }
  .set-seg button + button { border-left: 1px solid var(--rule-strong); }
  .set-seg button[aria-checked="true"] { background: var(--ink); color: var(--paper); }
  .set-seg button:focus-visible { outline: 2px solid var(--copper); outline-offset: -2px; }
  .set-note { display: block; margin-top: 10px; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
  /* the header: one row, one control height, the wordmark and the tools on one centre line; the
     outermost glyphs sit on the page's content edges (left = the wordmark, right = the next button) */
  .top { position: fixed; z-index: 3; top: var(--edge); left: var(--edge); right: var(--edge); height: 52px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .tools { display: flex; align-items: center; gap: 4px; margin-right: -14px; }
  .bl { top: calc(100vh - 80px - var(--edge) - 236px); left: calc(var(--edge) + 120px); transform-origin: 0 0; transform: matrix(0.866, 0.5, -0.866, 0.5, 0, 0); }

  .wordmark { margin: 0; font-weight: 800; font-stretch: 125%; font-size: 34px; letter-spacing: .01em; line-height: 1; display: flex; align-items: center; }
  .pro { display: inline-flex; align-items: center; }
  /* one gradient across "PRO", painted per letter (a text clip on .pro itself would ignore the
     letters' own clipping and fading below): sized to the whole of .pro (P .871 + R .942 + disc
     .90em) and shifted by each letter's offset */
  .pro .wm-p > span, .pro .wm-cut > span { background: var(--dvd) 0 0 / 2.713em 100% no-repeat; -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pro .wm-cut > span { background-position: -.871em 0; }
  .o-disc { /* the o of "pro" is a small disc in the same DVD colours, turning when pointed at */
    position: relative; display: inline-block; clip-path: inset(0 0 0 0); width: .78em; height: .78em; margin: 0 .07em 0 .05em; border-radius: 50%;
    background: conic-gradient(from 210deg, #b4abff, #d4a0ed, #f396bd, #f896aa, #e19bdf, #c5a5f8, #b4abff);
    -webkit-mask: radial-gradient(circle, transparent 0 15%, #000 16% 100%); mask: radial-gradient(circle, transparent 0 15%, #000 16% 100%);
    box-shadow: inset 0 0 0 .07em color-mix(in srgb, var(--ink) 18%, transparent);
    transition: transform 1200ms var(--ease);
  }
  .o-disc::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; box-shadow: 0 0 0 .04em color-mix(in srgb, var(--ink) 30%, transparent); }
  .wordmark:hover .o-disc { transform: rotate(1turn); }

  /* Off the home page the wordmark folds to an italic "DP" (after anthropic.com's header mark):
     nothing is cut and no letter is squeezed. First ISC-, R, BE and the bowl of the P fade where they
     stand; then the P (its stem) and the disc slide left together, the disc shrinking onto the stem's
     top as the P's bowl, and the slant comes in. Unfolding plays it the other way round: the pieces
     slide back first, then the letters fade in. The distances are measured from the font once
     (index.html, "wordmark: fold distances") into --wm-* on :root, in em. */
  .wordmark { position: relative; transform-origin: 0 .835em; width: var(--wm-w0, auto); }   /* the slant pivots on the baseline */
  .wm-cut > span { white-space: pre; }
  .wm-p { display: inline-grid; position: relative; z-index: 1; }      /* the stem stays in front of the landing disc */
  .wm-p > span { grid-area: 1 / 1; }
  .wm-pstem { clip-path: inset(0 calc(100% - .29em) 0 0); }          /* a still copy of the P cut to its stem (.09-.29em) */
  .pro { position: relative; }
  :root[data-mode]:not([data-mode=""]) .top > .wordmark { display: flex; transform: skewX(-11deg); }
  :root[data-mode]:not([data-mode=""]) .wordmark { width: var(--wm-w1, auto); }
  :root[data-mode]:not([data-mode=""]) :is(.wm-cut > span, .wm-pfull) { opacity: 0; }
  :root[data-mode]:not([data-mode=""]) .pro { translate: var(--wm-pro, 0) 0; }
  /* folded, the disc is the P's bowl: only its right half shows, the cut edge standing on the P's stem */
  :root[data-mode]:not([data-mode=""]) .o-disc { translate: var(--wm-disc, 0) -.105em; scale: var(--wm-disc-s, .64); clip-path: inset(0 0 0 50%); }
  /* beside the back button, not pushed to the middle by the two auto margins */
  :root[data-mode]:not([data-mode=""]) .top > .back:not([hidden]) { margin-right: 0; }
  :root[data-mode]:not([data-mode=""]) .top > .back:not([hidden]) + .wordmark { margin-left: 10px; }
  :root[data-mode]:not([data-mode=""]) .top > .back { flex-shrink: 0; }     /* the mark never squeezes the back button */
  /* folded, the release follows the mark, upright and quiet */
  .wm-ver { position: absolute; left: 100%; top: 50%; margin-left: .6em; font-size: .4em; font-weight: 600; font-stretch: 100%; white-space: nowrap;
    letter-spacing: .02em; color: var(--ink-3); transform: translateY(-50%) skewX(11deg); translate: 0 .12em; opacity: 0; pointer-events: none; }
  .wm-ver:empty { display: none; }
  :root[data-mode]:not([data-mode=""]) .top .wm-ver { opacity: 1; }
  @media (max-width: 480px) { :root[data-mode]:not([data-mode=""]) .top > .wordmark { display: none; } }   /* no room beside back and the tools */
  /* timing. Folding: the letters go (0-200 ms), then the slide and slant (120-500), the disc's left half
     tucks behind the stem (380-540), the version comes in (420-620). Unfolding: version and half-disc
     first, the slide back (60-420), then the letters (300-560). */
  :root[data-motion="on"] .wordmark { transition: transform 360ms var(--ease) 60ms, width 360ms var(--ease) 60ms; }
  :root[data-motion="on"] .pro { transition: translate 360ms var(--ease) 60ms; }
  :root[data-motion="on"] .o-disc { transition: transform 1200ms var(--ease), translate 360ms var(--ease) 60ms, scale 360ms var(--ease) 60ms, clip-path 120ms linear; }
  :root[data-motion="on"] :is(.wm-cut > span, .wm-pfull) { transition: opacity 260ms ease-out 300ms; }
  :root[data-motion="on"] .wm-ver { transition: opacity 120ms ease-in; }
  :root[data-motion="on"][data-mode]:not([data-mode=""]) .wordmark { transition: transform 380ms var(--ease) 120ms, width 380ms var(--ease) 120ms; }
  :root[data-motion="on"][data-mode]:not([data-mode=""]) .pro { transition: translate 380ms var(--ease) 120ms; }
  :root[data-motion="on"][data-mode]:not([data-mode=""]) .o-disc { transition: transform 1200ms var(--ease), translate 380ms var(--ease) 120ms, scale 380ms var(--ease) 120ms, clip-path 160ms ease-out 380ms; }
  :root[data-motion="on"][data-mode]:not([data-mode=""]) :is(.wm-cut > span, .wm-pfull) { transition: opacity 200ms ease-out; }
  :root[data-motion="on"][data-mode]:not([data-mode=""]) .wm-ver { transition: opacity 200ms ease-out 420ms; }

  .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .btn { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 18px; font-size: 18px; border: 1px solid transparent; border-radius: 2px; background: transparent; cursor: pointer; transition: background-color var(--t) var(--ease); }
  .btn:hover { background: var(--paper-2); }
  .btn:active { transform: translateY(1px); }

  .btn-icon { width: 52px; padding: 0; justify-content: center; }
  .btn-lang { font-weight: 600; font-stretch: 110%; padding: 0 14px; }
  .btn .icon { width: 24px; height: 24px; }

  /* ---- where you are ---- */
  .counter { display: grid; gap: 14px; }
  .count { font-weight: 300; font-size: 112px; line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: -.02em; display: flex; align-items: baseline; }
  .count small { font-size: 38px; color: var(--ink-3); font-weight: 300; margin-left: 8px; }
  .kinds { display: flex; gap: 2px; }
  .kind { min-height: 52px; padding: 0 18px; font-size: 19px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--ink-3); font-weight: 600; font-stretch: 110%; border-radius: 2px; transition: color var(--t) var(--ease), border-color var(--t) var(--ease); }
  .kind:hover { color: var(--ink); }
  .kind[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }

  /* text roll: each character leaves upward while its new one comes in from below (staggered) */
  .roll { display: inline; }
  .roll .w { white-space: nowrap; }
  .roll .ch { display: inline-block; overflow: hidden; vertical-align: top; }
  .roll .col { display: flex; flex-direction: column; transition: transform 360ms var(--io); }
  .roll .col > span { display: block; white-space: pre; }
  .roll.down .col { flex-direction: column-reverse; }

  /* ---- the chosen disc ---- */
  .detail { position: fixed; z-index: 2; right: var(--edge); top: 50%; transform: translateY(-50%); width: min(560px, 36vw); }
  .name { margin: 0; font-weight: 800; font-stretch: 118%; font-size: clamp(34px, 3.6vw, 64px); line-height: 1.08; min-height: 2.16em; display: flex; align-items: flex-end; }
  .mid { margin: 14px 0 0; font-family: var(--mono); font-size: 17px; color: var(--ink-2); }
  .rule { height: 1px; background: var(--ink); margin: 22px 0 18px; transform-origin: left; }
  .rule.draw { animation: draw 520ms var(--io) both; }
  @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .status { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 24px; }
  .status .icon { width: 26px; height: 26px; }
  .status[data-s="good"] { color: var(--good); }
  .status[data-s="narrow"] { color: var(--warn); }
  .status[data-s="none"] { color: var(--unknown); }
  .why { margin: 8px 0 0 36px; color: var(--ink-2); font-size: 18px; min-height: 3.1em; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 28px; margin: 26px 0 0; }
  .facts dt { font-size: 15px; color: var(--ink-3); }
  .facts dd .nb { white-space: nowrap; }
  .facts dd { margin: 2px 0 0; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 24px; }
  .in-drive { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 17px; color: var(--copper); font-weight: 600; min-height: 22px; }
  .in-drive.off { visibility: hidden; }
  .fade { transition: opacity 200ms var(--ease); }
  .fade.out { opacity: 0; }

  /* ---- the bar: drive on the left, next on the right ---- */
  .bar { position: fixed; z-index: 2; left: 0; right: 0; bottom: 0; height: 80px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 0 var(--edge); border-top: 1px solid var(--rule); background: color-mix(in srgb, var(--paper) 92%, transparent); }
  :root[data-theme="dark"] .bar { box-shadow: inset 0 1px 0 #d9a75c55; }
  .drive { color: var(--ink-2); font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drive b { color: var(--ink); font-weight: 600; }
  .next { min-height: 56px; padding: 0 28px; font-size: 19px; border: 0; border-radius: 2px; background: var(--ink); color: var(--paper); font-weight: 600; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; white-space: nowrap; transition: transform 150ms var(--ease); }
  .next:active { transform: translateY(1px); }
  .next .icon { transition: transform var(--t) var(--ease); }
  .next:hover .icon { transform: translateX(3px); }

  @media (max-width: 820px) {
    body { overflow: auto; }
    .stage { position: relative; height: 44vh; }
    .art { left: -10vw; width: 122vw; top: 56%; }
    .detail { position: static; transform: none; width: auto; padding: 8px var(--edge) 120px; }
    .name { min-height: 0; }
    .bl { position: static; padding: 0 var(--edge) 16px; transform: none; }
    .count { font-size: 72px; }
    .name { font-size: 34px; }
    .tools .btn .label { display: none; }
    .wordmark { font-size: 24px; }
  }
  :root[data-motion="off"] .art.entering, :root[data-motion="off"] .rule.draw { animation: none; }
  :root[data-motion="off"] .paper .disc, :root[data-motion="off"] .paper .disc.is-on, :root[data-motion="off"] .roll .col, :root[data-motion="off"] .o-disc, :root[data-motion="off"] .cam, :root[data-motion="off"] .layer, :root[data-motion="off"] .gallery { transition: none; }
  :root[data-motion="off"] .gallery .pin { animation: none; }
  :root[data-motion="off"] .layer.burner .slot img { transition: none; }

  /* ================= calibration flow (calibrate.js) ================= */
  .back { margin-left: -18px; }
  .back[hidden] { display: none; }
  /* the back button and the wordmark share the top-left corner: one shows at a time */
  .top > .back + .wordmark { margin-right: auto; }
  .top > .back:not([hidden]) { margin-right: auto; }
  :root[data-mode="cal"] .detail, :root[data-mode="cal"] .counter, :root[data-mode="cal"] .gallery { display: none; }
  :root[data-mode="cal"] .layer.ghost, :root[data-mode="cal"] .layer.solid { opacity: .1 !important; }
  .cal { position: fixed; z-index: 2; right: var(--edge); top: 50%; transform: translateY(-50%); width: min(600px, 40vw); display: grid; gap: 18px; }
  .cal[hidden] { display: none; }
  .cal .steps { display: flex; gap: 22px; margin: 0 0 6px; padding: 0; list-style: none; font-size: 17px; font-weight: 600; font-stretch: 110%; color: var(--ink-3); }
  .cal .steps li[aria-current="step"] { color: var(--ink); }
  .cal .steps li.done { color: var(--ink-2); }
  .cal h2 { margin: 0; font-weight: 800; font-stretch: 118%; font-size: clamp(32px, 3vw, 52px); line-height: 1.08; }
  .cal .lede { margin: 0; color: var(--ink-2); font-size: 19px; max-width: 34em; }
  .cal .choices { display: grid; gap: 10px; }
  .cal .choice { display: grid; grid-template-columns: 22px 1fr; gap: 4px 12px; align-items: start; padding: 16px 18px; border: 1px solid var(--rule-strong); border-radius: 3px; cursor: pointer; }
  .cal .choice:has(input:checked) { border-color: var(--ink); }
  .cal .choice input { margin: 4px 0 0; accent-color: var(--ink); width: 18px; height: 18px; }
  .cal .choice b { font-size: 18px; font-weight: 600; }
  .cal .choice span { grid-column: 2; color: var(--ink-2); font-size: 16px; }
  .cal .readout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 24px; margin: 0; }
  .cal .readout dt { font-size: 15px; color: var(--ink-3); }
  .cal .readout dd { margin: 2px 0 0; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cal .note { display: flex; gap: 10px; align-items: flex-start; font-size: 18px; padding: 12px 14px; margin: 0 -14px; border-radius: 3px; }
  /* a new warning flashes a pale orange three times, then rests */
  .cal .note.flash { animation: note-flash 520ms ease-in-out 3; }
  @keyframes note-flash { 50% { background: color-mix(in srgb, #e8a24e 22%, transparent); } }
  .cal .note .icon { flex: none; width: 24px; height: 24px; margin-top: 2px; }
  .cal .note[data-s="good"] { color: var(--good); } .cal .note[data-s="warn"] { color: var(--warn); } .cal .note[data-s="error"] { color: #c0574a; } .cal .note[data-s="unknown"] { color: var(--unknown); }
  :root[data-theme="dark"] .cal .note[data-s="error"] { color: #ee7f72; }
  .cal .note p { margin: 0; } .cal .note small { display: block; color: var(--ink-2); font-size: 16px; margin-top: 4px; }
  .cal .demo { justify-self: start; min-height: 44px; padding: 0 16px; border: 1px dashed var(--rule-strong); border-radius: 3px; background: none; color: var(--ink-2); cursor: pointer; font: inherit; font-size: 15px; }
  .cal .demo:hover { color: var(--ink); border-color: var(--ink-3); }
  .cal .chart { width: 100%; height: auto; display: block; }
  .cal .chart .axis { stroke: var(--rule-strong); stroke-width: 1; fill: none; }
  .cal .chart .grid { stroke: var(--rule); stroke-width: 1; }
  .cal .chart text { fill: var(--ink-3); font: 13px var(--font); font-variant-numeric: tabular-nums; }
  .cal .chart .band { fill: color-mix(in srgb, var(--copper) 18%, transparent); }
  .cal .chart .fit { stroke: var(--copper); stroke-width: 2; fill: none; }
  .cal .chart .pt { fill: var(--ink); } .cal .chart .bar { stroke: var(--ink-3); stroke-width: 1.2; }
  .cal .chart .pt.new { animation: pt-in 300ms var(--ease) both; }
  @keyframes pt-in { from { opacity: 0; transform: translateY(-6px); } }
  .cal .qr { width: 168px; height: 168px; border: 1px solid var(--rule-strong); display: grid; place-items: center; color: var(--ink-3); font-size: 15px; background:
      repeating-linear-gradient(0deg, transparent 0 11px, var(--rule) 11px 12px), repeating-linear-gradient(90deg, transparent 0 11px, var(--rule) 11px 12px); }
  .cal .row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .cal .name-field { display: grid; gap: 8px; margin-top: 18px; font-size: 17px; color: var(--ink-2); }
  .cal .name-field input { font: inherit; font-size: 20px; color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--rule-strong); padding: 6px 0; caret-color: var(--copper); }
  .cal .name-field input:focus-visible { outline: none; border-bottom-color: var(--ink); }
  .cal .count-input { display: flex; align-items: center; gap: 12px; font-size: 18px; }
  .cal .count-input input { width: 92px; min-height: 52px; padding: 0 12px; border: 1px solid var(--rule-strong); border-radius: 3px; background: transparent; color: var(--ink); font: 600 22px var(--font); font-variant-numeric: tabular-nums; }

  /* the job in the bar: what runs, how far (rainbow by radius for disc jobs), time left, cancel */
  .job { display: grid; grid-template-columns: auto minmax(120px, 1fr) auto auto; align-items: center; gap: 16px; min-width: 0; }
  .job[hidden] { display: none; }
  .job-name { font-weight: 600; white-space: nowrap; }
  .job-bar { position: relative; height: 4px; background: var(--rule); overflow: hidden; }
  .job-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ink); }
  .job-time { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar:has(.job:not([hidden])) .drive { display: none; }

  /* pieces of the calibration scene, all inside the camera layer so they pan with it */
  .floor { width: 100%; aspect-ratio: 1; transform: matrix(0.866, 0.5, -0.866, 0.5, 0, 0); }
  .cal-plate { position: absolute; z-index: 3; transform: translate(-50%, -50%); pointer-events: none; opacity: 0; transition: opacity 400ms var(--ease); }
  .cal-plate.on { opacity: 1; }
  .cal-plate canvas { width: 100%; height: 100%; display: block; }
  .cal-plate.breathe .floor { animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .6; } }

  /* the inside of the drive while it burns: a big cutaway over the left half, grown out of the
     drive picture (transform and opacity only); the scene behind it steps back */
  .cutaway { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity 500ms var(--ease); }
  .cutaway.on { opacity: 1; }
  .cutaway-in { position: absolute; transform-origin: 0 0; transition: transform 800ms var(--ease); container-type: inline-size; }
  .cutaway .inside { position: absolute; inset: 0; transform: scaleX(-1); }
  .cutaway .inside img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cutaway .sled, .cutaway .glow { transform: translate(var(--sled, 0, 0)); transition: transform 120ms linear; }
  .cutaway .inside.dark .disc { opacity: .5; }
  .cutaway .inside.dark .glow { mix-blend-mode: screen; }
  .cutaway .glow { animation: laser 1.6s ease-in-out infinite; }
  @keyframes laser { 50% { opacity: .72; } }
  .cutaway .occ { opacity: .75; }
  .cutaway .inside.dark, :root[data-theme="dark"] .cutaway .inside.light { display: none; }
  :root[data-theme="dark"] .cutaway .inside.dark { display: block; }
  .layer.burner .rig { transition: opacity 450ms var(--ease); }
  .layer.burner.inside-on .rig { opacity: 0; }
  .cam { transition: transform 700ms var(--ease), opacity 600ms var(--ease); }
  :root.burning .cam { opacity: .14; }
  /* type lying flat inside: the percentage on the disc, the time left on the tray floor */
  .inside-type { position: absolute; transform: translate(-50%, -50%) matrix(0.866, 0.5, -0.866, 0.5, 0, 0);
    font-weight: 700; font-size: 4.2cqw; font-variant-numeric: tabular-nums; letter-spacing: .02em; color: var(--ink); opacity: .92; white-space: nowrap; }
  .inside-type.big { font-size: 6.6cqw; font-weight: 800; font-stretch: 112%; }
  :root[data-motion="off"] .cutaway-in { transition: none; } :root[data-motion="off"] .cutaway .glow { animation: none; }

  /* the parcel: the measurement image, a small box beside the drive with its disc printed on the lid */
  .parcel { position: absolute; z-index: 3; pointer-events: none; opacity: 0; transform: translate(0, 12px); transition: opacity 450ms var(--ease), transform 450ms var(--ease); }
  .parcel.on { opacity: 1; transform: none; }
  .parcel.ship { opacity: 0; transform: translate(14%, -6%) scale(.6); transition: opacity 800ms var(--ease), transform 800ms cubic-bezier(.5, 0, .7, .4); }
  .parcel svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .parcel polygon, .parcel polyline { stroke: var(--ink); stroke-opacity: .55; stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .parcel .lid { fill: #e3d2b4; } .parcel .side-l { fill: #cdb995; } .parcel .side-r { fill: #bba57f; }
  .parcel .tape { fill: #efe4cc; stroke-opacity: .3; } .parcel .tape-edge { fill: none; stroke-opacity: .3; }
  :root[data-theme="dark"] .parcel .lid { fill: #4e4335; } :root[data-theme="dark"] .parcel .side-l { fill: #413729; } :root[data-theme="dark"] .parcel .side-r { fill: #362e22; }
  :root[data-theme="dark"] .parcel .tape { fill: #5d5141; }
  .parcel .lid-print { position: absolute; }
  .parcel .lid-print canvas { width: 100%; height: 100%; display: block; }

  /* the job's command-line output lying on the floor beside the drive (floor-log.js) */
  .layer.burner .burner-frame { position: absolute; container-type: inline-size; pointer-events: none; }
  .floor-log { position: absolute; transform-origin: 0 0; transform: matrix(0.866, 0.5, -0.866, 0.5, 0, 0);
    font-family: var(--mono); font-size: calc(var(--mm) * var(--fl-font)); line-height: calc(var(--mm) * var(--fl-pitch));
    font-weight: 600; letter-spacing: -.02em; color: var(--ink-2); white-space: pre; pointer-events: none; opacity: 0; transition: opacity 500ms var(--ease); }
  .floor-log.on { opacity: 1; }
  .floor-log .fl-lines { height: calc(var(--mm) * var(--fl-pitch) * var(--fl-lines)); overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 45%); mask-image: linear-gradient(to bottom, transparent, #000 45%); }
  .floor-log .fl-lines > * { flex: none; overflow: hidden; text-overflow: ellipsis; }
  .floor-log .fl-lines { transition: transform 320ms var(--ease); }
  .floor-log .fl-line:last-child { color: var(--ink); animation: fl-in 320ms var(--ease); }
  .floor-log .command { color: var(--ink-3); }
  .floor-log .warning { color: var(--copper); }
  .floor-log .fl-meter { min-height: calc(var(--mm) * var(--fl-pitch)); color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
  @keyframes fl-in { from { opacity: 0; } }
  .cutaway .floor-log { z-index: 2; }

  /* the disc that flies in (printed with its model) or lifts out, with its arrow */
  .flyer { position: absolute; z-index: 4; transform: translate(-50%, -50%); pointer-events: none; opacity: 0;
    transition: left 1400ms cubic-bezier(.25, .6, .3, 1), top 1400ms cubic-bezier(.25, .6, .3, 1), opacity 400ms var(--ease); }
  .flyer.on { opacity: 1; }
  .flyer.drop { transition: left 950ms cubic-bezier(.45, .05, .75, .55), top 950ms cubic-bezier(.45, .05, .75, .55); }
  .flyer .face { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle, transparent 0 6.2%, var(--paper-2) 6.4% 19%, color-mix(in srgb, var(--paper) 70%, var(--ink) 6%) 19.5% 100%);
    box-shadow: inset 0 0 0 1.5px var(--ink), inset 0 0 0 9px color-mix(in srgb, var(--paper) 80%, transparent); }
  .flyer .face::before { content: ""; position: absolute; inset: 37%; border-radius: 50%; box-shadow: 0 0 0 1px var(--ink-3); }
  .flyer .print { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .flyer .print text { font: 800 7.6px var(--font); font-stretch: 118%; letter-spacing: .06em; fill: var(--ink); }
  .flyer.hover .floor { animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: matrix(0.866, 0.5, -0.866, 0.5, 0, -8); } }
  .flyer .arrow { position: absolute; left: 50%; top: 92%; width: 26px; height: 44px; margin-left: -13px; fill: none; stroke: var(--copper); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity 300ms; }
  .flyer.hover .arrow { opacity: 1; animation: point 1.6s ease-in-out infinite; }
  .flyer.up .arrow { top: auto; bottom: 92%; transform: rotate(180deg); }
  @keyframes point { 50% { translate: 0 8px; } }
  .flyer.up.hover .arrow { animation-name: point-up; }
  @keyframes point-up { 50% { translate: 0 -8px; } }

  /* the problem sign: an exclamation mark standing over the drive, parallel to its front */
  .warn-sign { position: absolute; z-index: 4; transform: translate(-50%, -100%); pointer-events: none; opacity: 0; transition: opacity 300ms var(--ease); }
  .warn-sign.on { opacity: 1; }
  .warn-sign { transform: translate(-50%, -50%); }
  .warn-sign .flat { transform: matrix(0.866, -0.5, 0.866, 0.5, 0, 0); animation: warn-pulse 1.6s ease-in-out infinite; }
  @keyframes warn-pulse { 50% { opacity: .55; } }
  .warn-sign span { display: block; font-weight: 900; font-stretch: 100%; font-size: 190px; line-height: 1; color: #c9772f; -webkit-text-stroke: 2px color-mix(in srgb, var(--ink) 40%, transparent); }
  :root[data-theme="dark"] .warn-sign span { color: #e2a24f; }
  @keyframes bob-up { 50% { translate: 0 -8px; } }

  /* the drive's activity light */
  .drive-led { position: absolute; z-index: 3; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: #f0a640; box-shadow: 0 0 8px 2px #f0a64088; opacity: 0; pointer-events: none; }
  .drive-led.on { animation: led 0.5s steps(2, jump-none) infinite; }
  @keyframes led { 0% { opacity: 1; } 100% { opacity: .1; } }

  .cal .placed { min-height: 52px; padding: 0 24px; border: 1.5px solid var(--ink); border-radius: 3px; background: transparent; color: var(--ink); font: 600 18px var(--font); cursor: pointer; }
  .cal .placed:hover { background: var(--paper-2); }
  .cal .choice:has(input:disabled) { opacity: .5; cursor: default; }

  /* hold to confirm: the next button fills from the left while held */
  .next.hold { position: relative; overflow: hidden; }
  .next.hold::before { content: ""; position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--hold, 0)); background: var(--arc-flat, #8a6a3c); opacity: .55; }
  .next.hold > * { position: relative; }
  .next[disabled] { opacity: .4; cursor: not-allowed; }
  :root[data-motion="off"] .cal-plate.breathe .floor, :root[data-motion="off"] .cal .chart .pt.new, :root[data-motion="off"] .flyer.hover .floor, :root[data-motion="off"] .flyer .arrow, :root[data-motion="off"] .warn-sign .flat, :root[data-motion="off"] .cal .note.flash { animation: none !important; } :root[data-motion="off"] .flyer, :root[data-motion="off"] .flyer.drop { transition: opacity 0s; } :root[data-motion="off"] .drive-led.on { animation: none; opacity: 1; }
  @media (max-width: 820px) { .cal { position: static; transform: none; width: auto; padding: 8px var(--edge) 120px; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-error" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.2h.01"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-good" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.8L21 19.5H3z"/><path d="M12 10v4.2M12 17h.01"/></symbol>
  <symbol id="i-none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-dasharray="2.6 2.4"/><path d="M12 8v8M8 12h8"/></symbol>
  <symbol id="i-drive" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="1"/><path d="M6 13.5h7"/><circle cx="17.5" cy="13.5" r=".6"/></symbol>
</svg>

<div class="stage"><div class="art" id="art"></div></div>

<div class="set-menu" id="set-menu" role="group" aria-labelledby="set-motion-label" hidden>
  <p class="set-row"><span id="set-motion-label"></span><span class="set-seg" role="radiogroup" aria-labelledby="set-motion-label">
    <button type="button" role="radio" data-motion="auto"></button><button type="button" role="radio" data-motion="on"></button><button type="button" role="radio" data-motion="off"></button></span></p>
  <small class="set-note" id="set-motion-note"></small>
</div>

<section class="lobby" id="lobby" aria-labelledby="lobby-hello">
  <div class="lobby-art" id="lobby-art"></div>
  <!-- the hit areas of "new work" (the drive) and "past works" (the file box); lobby.js puts them on the objects -->
  <button class="lb-hit" id="lobby-new" type="button"></button>
  <button class="lb-hit" id="lobby-open" type="button"></button>
  <div class="lobby-greet"><p id="lobby-hello"></p><p id="lobby-recent" hidden></p></div>
</section>

<header class="top">
  <button class="btn back" id="back" type="button" hidden><svg class="icon"><use href="#i-back"/></svg><span data-i18n="back"></span></button>
  <h1 class="wordmark" id="wordmark" aria-label="disc-probe"><span aria-hidden="true">D</span><span class="wm-cut" aria-hidden="true"><span>ISC-</span></span><span class="pro" aria-hidden="true"><span class="wm-p"><span class="wm-pfull">P</span><span class="wm-pstem">P</span></span><span class="wm-cut"><span>R</span></span><span class="o-disc"></span></span><span class="wm-cut" aria-hidden="true"><span>BE</span></span><small class="wm-ver" id="wm-ver"></small></h1>
  <nav class="tools" data-i18n-aria="tools">
    <button class="btn" type="button" id="library" data-i18n-title="libraryTitle"><svg class="icon"><use href="#i-drive"/></svg><span class="label" data-i18n="library"></span></button>
    <button class="btn btn-lang" type="button" id="lang" data-i18n="langButton" data-i18n-aria="langAria"></button>
    <button class="btn btn-icon" type="button" id="theme" data-i18n-aria="theme"><svg class="icon"><use href="#i-theme"/></svg></button>
    <button class="btn btn-icon" type="button" id="settings" data-i18n-aria="settings" aria-haspopup="true" aria-expanded="false"><svg class="icon"><use href="#i-settings"/></svg></button>
  </nav>
</header>

<div class="corner bl counter">

  // Text roll: each character leaves one way while the new one arrives, staggered. Characters are

  function roll(el, text, dir = 1, stagger = 0.035) {
    const old = el.dataset.text ?? "";

    const n = Math.max(old.length, text.length);

    box.className = "roll" + (dir < 0 ? " down" : "");
    const cols = [];
    let word = null;
    for (let i = 0; i < n; i++) {
      const ch = text[i] ?? "";
      if (ch === " " && (old[i] ?? " ") === " ") { box.append(" "); word = null; continue; }
      if (!word) { word = document.createElement("span"); word.className = "w"; box.append(word); }
      // a space in either name is a place the line may break

      clip.append(c); word.append(clip); cols.push(c);

    el.replaceChildren(box);

  function render(dir = 1, initial = false) {
    const list = DATA[col];

  }

  addEventListener("keydown", async (e) => {

    const c = COLS.indexOf(col);

    if (e.key === "ArrowLeft") { col = COLS[(c + COLS.length - 1) % COLS.length]; idx = 0; dir = -1; }

  // A disc of the row in focus picks that disc. Anywhere else, the click goes to whatever stands
  // under the pointer: a row (front rows first, as they are drawn on top) or the drive.
  const inside = (pt, poly) => {
    let hit = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j];
      if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < ((xj - xi) * (pt[1] - yi)) / (yj - yi) + xi) hit = !hit;

  };

    if (root.dataset.mode || root.dataset.home === "lobby") return;

    if (el && el.dataset.row === col) {
      const dir = Number(el.dataset.idx) < idx ? -1 : 1;

      const n = [...burnerLayer.querySelectorAll(".rig, img")].find((x) => x.getBoundingClientRect().width > 0);

    if (!to && onDrive) to = "drive";

      setTray(!trayOpen, trayDisc, () => render(1));

    }

  // ---- idle: after 10 s without input, every looping animation slows to a stop; any input
  // brings them back the same way. Nothing on the page keeps the GPU busy while nobody looks.
  {
    const IDLE_MS = 10000, RAMP_MS = 900;
    let idle = false, timer = 0, raf = 0;
    // loops inside .live (the laser while it burns) keep going: the work is still happening

      if (to) { root.classList.remove("idle"); for (const a of anims) { a.playbackRate = 0.001; a.play(); } }

  // ---- wordmark: fold distances. The folded "DP" is the unfolded mark with pieces moved, so the
  // distances come from the unfolded layout (measured while unfolded, so nothing is moved yet), in em, once the font is in:
  // the P closes up to the D (less ISC-, and .05em more: the italic D and P sit loose), and the disc
  // lands with its centre on the stem's right edge (.29em into the P) at .5em across.

    const isc = box(mark.children[1]), p = box(mark.querySelector(".wm-p")), disc = box(mark.querySelector(".o-disc")), end = box(mark.querySelector(".pro + .wm-cut"));
    if (!isc.w || !end.w) return;

  // ---- what the calibration flow (calibrate.js) may use ----
  const api = {
    backend, selectedDrive: () => col === "drive" ? DATA.drive[idx]?.id : chosenDrive,
    reload: async () => { location.reload(); },
    T: () => T(), lang: () => lang, get reduce() { return reduce; }, meta, cam, art, burnerLayer, $,

  // The drive's next step: read what is in it (the real page runs `info`, read-only). A listed disc

  // Mock: ?newdisc makes the disc in the drive one that isn't listed.
  async function identifyDisc() {
    const t = T(), nb = $("next");

    col = kind; idx = i >= 0 ? i : DATA[kind].length - 1;

      for (const row of ["dvd","cd","bd"]) {
        const limit = {dvd:7,cd:6,bd:4}[row], kinds = backendState.catalogue[row];
        overflow[row] = Math.max(0, kinds.length-limit);
        DATA[row] = kinds.slice(0,limit).map(x => ({...x,s:x.s === "narrow_span" ? "narrow" : x.s}));
        DATA[row].push({kind:"new",row,name:"",mid:"",s:"new"});
        delete loaded[row];
      }
      if (col !== "drive") idx = Math.max(0, DATA[col].findIndex(x => x.id === selectedId));
      await loadSolid(col); render(1,true);
    } catch(e) {backendError=e; render(1,true);}
  });
  // ---- the lobby and the library (docs/goals/gui-outline.md 3.0) ----
  // The page opens on the lobby. "New plan" starts a work at once, on the discs it can guess: the batch used
  // last, else the disc kind the drive holds, else the first measured DVD. The batch can be changed from the
  // plan later (its title), which opens the library with the plan waiting. The library is the old shelf.
  let choosingFor = null;                       // a plan waiting for a batch picked in the library
  function lastBatch() {
    let id = null;
    try { id = localStorage.getItem("dp-batch"); } catch {}
    for (const c of ["dvd", "cd", "bd"]) { const it = DATA[c].find((x) => id && x.id === id); if (it) return [c, it]; }
    const held = backend.mock ? DATA.drive[0]?.trayDisc ?? "" : "";
    const kind = /CD/.test(held) ? "cd" : /BD/.test(held) ? "bd" : "dvd";
    const measured = (c) => DATA[c].find((x) => ["good", "usable"].includes(x.s));
    for (const c of [kind, "dvd", "cd", "bd"]) { const it = measured(c); if (it) return [c, it]; }
    return ["dvd", DATA.dvd[0]];
  }
  function setHome(where) {
    root.dataset.home = where;
    $("back").hidden = where !== "library";
    if (where === "lobby") paintRecent();
    render(1, true);
  }
  // new plan: the form page first (name, disc kind and batch), then the design page
  async function newPlan(file = null) {
    (await import("./newplan.js")).start(api, { from: $("lobby-new"), file });
  }
  async function openPlan() {
    const [c, item] = lastBatch();
    col = c; idx = Math.max(0, DATA[c].indexOf(item));
    (await import("./design.js")).start(api, { newPlan: true, fly: false, pick: true });
  }
  // the greeting's second line: the last plan
  async function paintRecent() {
    const design = await import("./design.js");
    (await import("./lobby.js")).paintRecent(design.recentPlans(), (plan) => design.start(api, { plan, fly: false }));
  }
  $("lobby-new").addEventListener("click", () => newPlan());
  $("lobby-open").addEventListener("click", () => openPlan());
  // a picture dropped anywhere on the lobby starts a plan with it
  $("lobby").addEventListener("dragover", (e) => { e.preventDefault(); });
  $("lobby").addEventListener("drop", (e) => {
    e.preventDefault();
    const f = [...(e.dataTransfer?.files ?? [])][0];
    if (!f) return;
    if (/\.discdesign$|\.json$/i.test(f.name)) { const [c, item] = lastBatch(); col = c; idx = Math.max(0, DATA[c].indexOf(item)); import("./design.js").then((d) => d.start(api, { newPlan: true, fly: false, projectFile: f })); }
    else if (f.type.startsWith("image/")) newPlan(f);
  });
  $("library").addEventListener("click", () => { if (!root.dataset.mode) setHome("library"); });
  // back from the library: to the plan that was waiting for discs, else to the lobby (capture: the
  // calibration page also listens on this button)
  $("back").addEventListener("click", async (e) => {
    if (root.dataset.mode || root.dataset.home !== "library") return;
    e.stopImmediatePropagation();
    if (choosingFor) { const plan = choosingFor; choosingFor = null; (await import("./design.js")).start(api, { plan, fly: false }); return; }
    setHome("lobby");
  }, { capture: true });
  Object.assign(api, {
    toLobby: () => setHome("lobby"),
    // the plan's title asks for other discs: show the library with the plan waiting
    chooseBatch(plan) { choosingFor = plan; setHome("library"); },
    rememberBatch(item) { try { if (item?.id) localStorage.setItem("dp-batch", item.id); } catch {} },
    lastBatch,
    // the machine the core runs on ("win32", "linux", ...): the server's; in the mock, this browser's
    platform: () => backend.mock ? (/win/i.test(navigator.platform) ? "win32" : "linux") : backendState?.platform ?? "",
    // the disc batches of one kind (the library's entries, no empty place, no drive stop)
    catalogue: (kind) => (DATA[kind] ?? []).filter((x) => x.kind !== "new" && x.kind !== "drive"),
    // what the drive holds, as the shelf names it ("Verbatim DVD-R"); empty if unknown
    heldDisc: () => backend.mock && trayDisc ? DATA.drive[0]?.trayDisc ?? "" : "",
    // the form chose this kind and batch (or none): point the home page at it before design starts
    useForPlan(kind, item) {
      col = kind;
      const i = item ? DATA[kind].indexOf(item) : DATA[kind].findIndex((x) => x.kind === "new");
      idx = Math.max(0, i);
    },
  });

  applyStatic();
  root.dataset.home = "lobby";
  try { await (await import("./lobby.js")).init(api); } catch (e) { console.error("lobby", e); }
  paintRecent();
  render(1, true);
</script>
</body>
</html>
