      chosenDrive = api.selectedDrive();
      nb.disabled = true;
      try {
        const disc = await readDisc();
        if (!disc?.present || !DATA[disc.media]) { pendingWhy = t.driveNone; render(1,true); return; }
        col = disc.media;
        const found = DATA[col].findIndex(x => x.kind !== "new" && disc.mid && x.mid === disc.mid);
        idx = found >= 0 ? found : DATA[col].length - 1;
        Object.assign(DATA[col][idx], {detected:disc});
        if (found < 0) Object.assign(DATA[col][idx], {mid:disc.mid, sectors:disc.sectors});
        pendingWhy = found >= 0 ? t.foundKnown(DATA[col][idx].name) : t.foundNew(discDisplayKind(disc, lang));
        await loadSolid(col); render(1,true);
      } catch (error) { pendingWhy = backend.errorText(error,lang); render(1,true); }
      finally { nb.disabled = false; }
      return;
    }
    nb.disabled = true; $("next-text").textContent = t.reading;
    await new Promise((r) => setTimeout(r, reduce ? 0 : 1200));
    nb.disabled = false;
    if (!trayDisc) { pendingWhy = t.driveNone; render(1, true); return; }
    const held = DATA.drive[0].trayDisc;      // what `info` read: "Verbatim DVD-R"
    const kind = /CD/.test(held) ? "cd" : /BD/.test(held) ? "bd" : "dvd";
    const i = new URLSearchParams(location.search).has("newdisc") ? -1 : DATA[kind].findIndex((x) => x.name && x.name.startsWith(held));
    col = kind; idx = i >= 0 ? i : DATA[kind].length - 1;
    pendingWhy = i >= 0 ? t.foundKnown(t.brand(DATA[kind][i].name)) : t.foundNew(held.replace(/^\S+\s/, ""));
    await loadSolid(col);
    render(1);
  }
  $("next").addEventListener("click", async () => {
    if (root.dataset.mode) return;
    if (inLobby()) { if (hasCalibration()) await openCalibration(); else newPlan(); return; }
    const item = DATA[col][idx];
    if (inspectingBatch && item.kind !== "drive" && item.kind !== "new") {
      const resume = inspectingBatch; inspectingBatch = null;
      resume(col, item); return;
    }
    if (choosingFor && item.kind !== "drive" && item.kind !== "new") {     // the library, picking discs for an open plan
      const plan = choosingFor; choosingFor = null;
      (await import("./design.js")).useBatch(api, plan, item, col);
      return;
    }
    if (item.kind === "drive") { identifyDisc(); return; }
    if (needsCdPhoto(item, col)) {
      await import("./calibrate.js");
      if (!inLibrary() || DATA[col][idx] !== item) return;
      await photographBatch(item);
      return;
    }
    if (calibrated(item)) { (await import("./design.js")).start(api); return; }
    const flow = await import("./calibrate.js");
    flow.start(api);
  });
  $("job-name").addEventListener("click", openCalibration);
  $("library-calibrate").addEventListener("click", async () => {
    const item = DATA[col][idx];
    const row = item.kind === "drive" ? item.disc?.media : col;
    const media = ["cd", "bd"].includes(row) ? row : "dvd";
    const cal = await import("./calibrate.js");
    const newItem = item.kind === "new" ? item : {kind:"new", row:media, name:"", mid:"", s:"new"};
    if (inLibrary() && DATA[col][idx] === item) {
      const row = col, index = idx;
      cal.start(api, {item:newItem, returnTo: result => {
        const saved = result?.batch;
        if (saved) api.goTo(...api.locate(saved));
        else api.goTo(row, index);
        setHome("library");
      }});
    }
  });
  $("library-design").addEventListener("click", async () => {
    const item = DATA[col][idx], design = await import("./design.js");
    if (inLibrary() && DATA[col][idx] === item) design.start(api);
  });
  $("library-export").addEventListener("click", () => libraryAction($("library-export"), async () => {
    const item = DATA[col][idx], name = batchName(item, col);
    const geo = item.geo.replace(/[\\/]+$/, "");
    const path = item.preset || (/\.json$/i.test(geo) ? geo : `${geo}/summary.json`);
    const sectors = item.capacity_sectors;
    const result = await backend.request("/api/presets", {operation:"export", path,
      ...(hasCapability("library-batch-details") ? {name:name.slice(0, 120), ...(sectors > 0 ? {sectors} : {})} : {})});
    (await import("./presetio.js")).downloadPreset(result.preset);
    $("library-feedback").textContent = libraryWords().exported;
  }));
  $("library-check").addEventListener("click", () => libraryAction($("library-check"), async () => {
    const item = DATA[col][idx], preparing = libraryWords().preparing;
    $("library-feedback").textContent = preparing;
    try {
      await (await import("./design.js")).checkBatch(api, item, () => {
        root.dataset.mode = "";
        $("next").disabled = false;
        api.goTo(...api.locate(item));
        setHome("library");
      }, p => {   // a 4.6 GB file takes a minute or two: say how far it is, not just that it is busy
        const f = p?.fraction;
        if ($("library-feedback").textContent.startsWith(preparing)) $("library-feedback").textContent = Number.isFinite(f) && f > 0 ? `${preparing} ${Math.floor(f * 100)}%` : preparing;
      });
    } finally { if ($("library-feedback").textContent.startsWith(preparing)) $("library-feedback").textContent = ""; }
  }));
  $("library-remeasure").addEventListener("click", async () => {
    const item = DATA[col][idx], cal = await import("./calibrate.js");
    if (inLibrary() && DATA[col][idx] === item) cal.start(api, {item});
  });
  $("library-resume").addEventListener("click", async () => {
    const item = DATA[col][idx];
    if (!item.calibration_issue?.can_resume) return;
    if (DATA.drive.some(drive => drive.id === item.drive_id)) chosenDrive = item.drive_id;
    (await import("./calibrate.js")).resumeSaved(api, item);
  });
  let trashId = null;
  async function libraryAction(button, action) {
    if (button.disabled) return;
    button.disabled = true;
    $("library-feedback").textContent = "";
    try { await action(); }
    catch (error) { $("library-feedback").textContent = backend.errorText(error, lang); }
    finally { button.disabled = false; }
  }
  $("library-rename").addEventListener("click", () => {
    $("batch-rename").hidden = false;
    const input = $("batch-new-name");
    input.value = batchName(DATA[col][idx], col).slice(0, input.maxLength);
    input.focus(); input.select();
  });
  function closeRename() {
    $("batch-rename").hidden = true;
    $("library-rename").focus();
  }
  $("batch-name-cancel").addEventListener("click", closeRename);
  $("batch-rename").addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); closeRename(); }
  });
  $("batch-rename").addEventListener("submit", (e) => {
    e.preventDefault();
    const {id} = DATA[col][idx], name = $("batch-new-name").value.trim();
    if (!name) return;
    libraryAction($("batch-name-save"), async () => {
      await backend.request("/api/catalogue", {id, name});
      await syncState();
      if (inLibrary() && DATA[col][idx].id === id) closeRename();
    });
  });
  $("library-delete").addEventListener("click", () => libraryAction($("library-delete"), async () => {
    const {id} = DATA[col][idx];
    const preview = await backend.request("/api/library", {operation:"preview", id});
    const w = libraryWords();
    const choice = await confirmRemoval({
      title:w.title(preview.name), body:w.body,
      files:[w.files, preview.files], shared:[w.shared, preview.retained], works:[w.works, preview.works.map(work => work.name)],
      actions:[[w.cancel, ""], ...(preview.works.length ? [[w.keep, "keep"], [w.both, "both"]] : [[w.moved, "keep"]])]
    });
    if (!choice) return;
    const removed = await backend.request("/api/library", {operation:"delete", id, with_works:choice === "both", revision:preview.revision});
    trashId = removed.trash_id;
    $("library-undo").hidden = false;
    $("library-feedback").textContent = w.deleted(preview.name);
    await syncState();
    $("library-undo").focus();
  }));
  $("library-undo").addEventListener("click", () => libraryAction($("library-undo"), async () => {
    const restored = await backend.request("/api/library", {operation:"restore", id:trashId});
    trashId = null;
    $("library-undo").hidden = true;
    $("library-feedback").textContent = libraryWords().restored;
    await syncState();
    const found = DATA[col].findIndex(item => item.id === restored.id);
    if (found >= 0) { idx = found; render(1, true); }
    $("library-calibrate").focus();
  }));
  addEventListener("dp-cal-job", paintLobbyNext);
  addEventListener("dp-drive-state", paintLobbyNext);
  // SSE replays completed jobs on reconnect too, including a job attached after reload.
  // Refresh its drive even while a workflow owns the screen, and only once per job.
  const refreshedDiscs = new Set();
  async function refreshFinishedDisc(event) {
    if (event.type !== "done" || refreshedDiscs.has(event.job)) return;
    refreshedDiscs.add(event.job);
    try {
      const state = await backend.state();
      if (backendState) backendState.jobs = state.jobs;
      globalThis.dispatchEvent?.(new Event("dp-drive-state"));
      const job = state.jobs.find(j => j.id === event.job);
      if (!job?.drive || !["burn", "calibrate"].includes(job.action)) return;
      // Reconnecting replays old completions. Calibration owns its own disc
      // checks, including the preflight when resuming a cancelled write.
      if (root.dataset.mode === "cal") return;
      const drive = backendState?.drives?.find(d => d.id === job.drive);
      if (drive) drive.disc = null;
      paintDriveLine();
      await readDisc(job.drive);
    } catch (error) {
      refreshedDiscs.delete(event.job);
      console.error("disc refresh", error);
    }
  }
  // The library's rows from the core's state: on every state event while no page is open, and when a page
  // that changed them (a calibration saved from the new-plan form) hands back to the one that opened it.
  async function syncState() {
    try {
      backendState = await backend.state(); backendError = null;
      const selectedId = DATA[col][idx]?.id;
      for (const row of ["dvd","cd","bd"]) {
        DATA[row] = catalogueRow(row, backendState);
        sizeRack(row);
      }
      // a drive plugged in (or gone) since the page opened: the drive stop and the chosen drive follow
      const drives = (backendState.drives || []).map(d => ({...d, kind:"drive", name:d.name || d.id, mid:d.id, s:"unknown"}));
      if (drives.length) { DATA.drive = drives; if (!drives.some(d => d.id === chosenDrive)) chosenDrive = drives[0].id; }
      if (col !== "drive") idx = selectedId ? Math.max(0, DATA[col].findIndex(x => x.id === selectedId)) : 0;
      else idx = Math.min(idx, DATA.drive.length - 1);
      if (root.dataset.home === "lobby") paintPending();
      if (!root.dataset.mode) { render(1,true); await loadSolid(col); paintRack(DATA[col][idx]); }
    } catch(e) {backendError=e; if (!root.dataset.mode) render(1,true);}
    globalThis.dispatchEvent?.(new Event("dp-drive-state"));
  }
  api.syncState = backend.mock ? async () => {} : syncState;
  let libraryDirty = false;
  addEventListener('dp-catalogue-changed', () => { libraryDirty = true; if (!root.dataset.mode) { libraryDirty = false; api.syncState(); } });
  new MutationObserver(() => {
    if (!root.dataset.mode && libraryDirty) { libraryDirty = false; api.syncState(); }
  }).observe(root, {attributes: true, attributeFilter: ['data-mode']});
  let serviceBusy = true, quitting = false;
  function paintQuit() {
    const t = T(), button = $("quit");
    button.disabled = serviceBusy || quitting;
    button.setAttribute("aria-label", t.quit);
    $("quit-control").title = serviceBusy ? t.quitBusy : t.quit;
  }
  addEventListener("dp-lang", paintQuit);
  const stopLobbyEvents = backend.mock ? null : backend.events(async event => {
    if (event.type === "activity") {
      serviceBusy = event.busy;
      $("quit-control").hidden = false;
      paintQuit();
      return;
    }
    await refreshFinishedDisc(event);
    // A terminal job can start while the lobby is open. Its first event identifies it;
    // fetch saved job state once so a cached blank disc never reads as ready while busy.
    if (event.job && backendState && !backendState.jobs?.some(j => j.id === event.job)) {
      try {
        backendState.jobs = (await backend.state()).jobs;
        globalThis.dispatchEvent?.(new Event("dp-drive-state"));
      } catch {}
    }
    if (event.type !== "state") return;
    if (root.dataset.mode) { libraryDirty = true; return; }
    await syncState();
  }, () => {
    serviceBusy = true;
    paintQuit();
  });
  $("quit").addEventListener("click", async () => {
    if ($("quit").disabled || !window.confirm(T().quitConfirm)) return;
    quitting = true;
    paintQuit();
    try {
      await backend.request("/api/quit", {});
      stopLobbyEvents?.();
      root.dataset.exited = "true";
      $("quit-status").hidden = false;
      $("quit-status").textContent = T().quitDone;
      document.title = T().quitDone;
    } catch (error) {
      if (error.code === "tasks_running") serviceBusy = true;
      quitting = false;
      paintQuit();
      window.alert(backend.errorText(error, lang));
    }
  });
  // ---- the lobby and the library (docs/goals/gui-outline.md 3.0) ----
  // The page opens on the lobby. "New plan" starts a work at once, on the discs it can guess: the batch used
  // last, else the disc kind the drive holds, else the first measured DVD. The batch can be changed from the
  // plan later (its title), which opens the library with the plan waiting. The library is the old shelf.
  let choosingFor = null;                       // a plan waiting for a batch picked in the library
  let inspectingBatch = null;                   // the new-work form waiting for a library visit
  function lastBatch({ preferDrive = true } = {}) {
    let id = null;
    try { id = localStorage.getItem("dp-batch"); } catch {}
    for (const c of ["dvd", "cd", "bd"]) { const it = api.catalogue(c).find((x) => id && x.id === id); if (it) return [c, it]; }
    const held = !preferDrive ? "" : backend.mock ? DATA.drive[0]?.trayDisc ?? "" : driveDisc()?.present ? driveDisc().kind ?? "" : "";
    const kind = /^CD|[^V]CD/.test(held) ? "cd" : /BD/.test(held) ? "bd" : "dvd";
    const measured = (c) => api.catalogue(c).find((x) => ["good", "usable"].includes(x.s));
    for (const c of [kind, "dvd", "cd", "bd"]) { const it = measured(c); if (it) return [c, it]; }
    return ["dvd", DATA.dvd[0]];
  }
  function setHome(where) {
    if (where === "library") {
      wakeScene();
      const row = col;
      loadSolid(row).then(() => { if (row === col) paintRack(DATA[col][idx]); });
    }
    root.dataset.home = where;
    $("back").hidden = where !== "library";
    if (where === "lobby") { paintPending(); paintRecent(); refreshLobbyDisc(); }
    render(1, true);
    if (libraryDirty) { libraryDirty = false; api.syncState(); }
  }
  // new plan: the form page first (name, disc kind and batch), then the design page
  async function newPlan(file = null) {
    (await import("./newplan.js")).start(api, { from: $("lobby-new"), file });
  }
  async function openPlan() {
    const [c, item] = lastBatch();
    col = c; idx = Math.max(0, DATA[c].indexOf(item));
    (await import("./design.js")).start(api, { newPlan: true, fly: false, pick: true });
  }
  // A CD batch whose geometry is measured still needs photos for its along-track constant. The library and the
  // lobby's reminder both open the same photo page.
  async function photographBatch(item) {
    const cal = await import("./calibrate.js");
    // the library's place follows, so a reload (navigation snapshot) and Back both find this batch
    const at = DATA.cd.indexOf(item); if (at >= 0) { col = "cd"; idx = at; }
    if (DATA.drive.some(d => d.id === item.drive_id)) chosenDrive = item.drive_id;
    cal.photograph(api, {item, media:"cd", geo:item.geo, returnTo: () => {
      api.goTo(...api.locate(item));
      setHome("library");
    }});
  }
  // The lobby says when a batch was left one step short, so someone who closed the page after the geometry
  // finds the photo step again without knowing it sits in the library.
  async function paintPending() {
    const lobby = await import("./lobby.js");
    const item = DATA.cd.find(b => b.kind !== "new" && needsCdPhoto(b, "cd"));
    lobby.paintPending(item ? libraryBatchName(item, "cd", lang) : null, () => { if (inLobby()) photographBatch(item); });
  }
  // the greeting's second line: the last plan
  async function paintRecent() {
    const design = await import("./design.js");
    const lobby = await import("./lobby.js");
    try {
      const lib = await import('./pastworks/works.mjs'), client = await lib.worksFor(api);
      const latest = (await import('./afterburn.js')).latestBurn(await client.list());
      if (latest) {
        const record = latest.discs.findLast(r => r.type === "burn" && !r.measurement);
        const prefix = record.preview_available === false || latest.source_design_missing
          ? (lang === "en" ? "Burn report: " : "刻录报告：")
          : (lang === "en" ? "Burn report and preview: " : "刻录报告和预览：");
        lobby.paintRecent([{name: prefix + latest.name}], () => import("./afterburn.js").then(m => m.open(api, latest.id, record.burn_id)));
        return;
      }
    } catch (e) { console.warn('recent burn', e); }
    lobby.paintRecent(design.recentPlans(), (plan) => design.start(api, { plan, fly: false }));
  }
  $("lobby-new").addEventListener("click", () => newPlan());
  $("lobby-open").addEventListener("click", () => openPlan());
  // a picture dropped anywhere on the lobby starts a plan with it
  $("lobby").addEventListener("dragover", (e) => { e.preventDefault(); });
  $("lobby").addEventListener("drop", (e) => {
    e.preventDefault();
    const f = [...(e.dataTransfer?.files ?? [])][0];
    if (!f) return;
    if (/\.discdesign$|\.json$/i.test(f.name)) { const [c, item] = lastBatch(); col = c; idx = Math.max(0, DATA[c].indexOf(item)); import("./design.js").then((d) => d.start(api, { newPlan: true, fly: false, projectFile: f })); }
    else if (f.type.startsWith("image/")) newPlan(f);
  });
  $("library").addEventListener("click", () => { if (!root.dataset.mode) setHome("library"); });
  $("library").addEventListener("pointerenter", wakeScene, { once: true });      // fetch while the pointer is on its way
  // back from the library: to the plan that was waiting for discs, else to the lobby (capture: the
  // calibration page also listens on this button)
  $("back").addEventListener("click", async (e) => {
    if (root.dataset.mode || root.dataset.home !== "library") return;
    e.stopImmediatePropagation();
    if (inspectingBatch) { const resume = inspectingBatch; inspectingBatch = null; resume(); return; }
    if (choosingFor) { const plan = choosingFor; choosingFor = null; (await import("./design.js")).start(api, { plan, fly: false }); return; }
    setHome("lobby");
  }, { capture: true });
  Object.assign(api, {
    toLobby: () => setHome("lobby"),
    newWork: () => { setHome("lobby"); newPlan(); },
    // the plan's title asks for other discs: show the library with the plan waiting
    chooseBatch(plan) { choosingFor = plan; setHome("library"); },
    inspectBatch(kind, item, resume) {
      inspectingBatch = resume;
      const index = DATA[kind].findIndex(row => row === item || item?.id && row.id === item.id);
      col = kind; idx = Math.max(0, index); setHome("library");
    },
    rememberBatch(item) { try { if (item?.id) localStorage.setItem("dp-batch", item.id); } catch {} },
    lastBatch,
    lobbyState: () => backend.mock ? {
      drives: [{ id: "demo", disc: { present: trayDisc, blank: trayDisc ? true : null, kind: "DVD-R" } }],
      selectedDrive: "demo", jobs: [],
    } : backendError ? { error: true } : backendState ? { ...backendState, selectedDrive: api.selectedDrive(),
      checking: pendingReads.has(api.selectedDrive()), checkFailed: failedReads.has(api.selectedDrive()) } : null,
    // the machine the core runs on ("win32", "linux", ...): the server's; in the mock, this browser's
    platform: () => backend.mock ? (/win/i.test(navigator.platform) ? "win32" : "linux") : backendState?.platform ?? "",
    // the disc batches of one kind (the library's entries, no empty place, no drive stop)
    catalogue(kind) {
      return (DATA[kind] ?? []).filter(x => x.kind !== "new" && x.kind !== "drive");
    },
    // what the drive holds, as the shelf names it ("Verbatim DVD-R"), else its kind ("DVD-R Sequential");
    // empty if no disc or not read yet
    heldDisc: () => {
      if (backend.mock) return trayDisc ? DATA.drive[0]?.trayDisc ?? "" : "";
      const d = driveDisc();
      return d?.present ? discName(d) : "";
    },
    // the form chose this kind and batch (or none): point the home page at it before design starts
    useForPlan(kind, item) {
      col = kind;
      const i = item ? DATA[kind].findIndex(x => x === item || item.id && x.id === item.id) : -1;
      idx = i >= 0 ? i : DATA[kind].length - 1;
    },
  });

  applyStatic();
  if ((await import("./handshake.mjs")).hasCapability("presets-io")) (await import("./presetio.js")).init($("presetio-entry")).catch(() => {});
  // the mute switch (M): sounds are on by default and quiet; the words on the page always say the same
  const sfx = await import("./sfx.js");
  const paintSound = () => {
    const on = sfx.soundOn();
    $("sound").setAttribute("aria-pressed", String(on));
    $("sound").setAttribute("aria-label", lang === "zh" ? (on ? "声音开着（M 关掉）" : "声音关着（M 打开）") : (on ? "Sound on (M to mute)" : "Sound off (M to turn on)"));
    $("sound").title = $("sound").getAttribute("aria-label");
  };
  $("sound").addEventListener("click", () => { sfx.setSound(!sfx.soundOn()); paintSound(); });
  addEventListener("dp-lang", paintSound);
  addEventListener("dp-sound", paintSound);
  paintSound();
  // Why Next is disabled: a page says it with api.nextWhy(words) right after disabling Next; the words go when
  // Next can be pressed again, or when the page changes.
  api.nextWhy = (words) => { $("next-why").textContent = $("next").disabled ? (words || "") : ""; $("next-why").dataset.mode = root.dataset.mode ?? ""; };
  new MutationObserver(() => { if (!$("next").disabled) $("next-why").textContent = ""; }).observe($("next"), { attributes: true, attributeFilter: ["disabled"] });
  // words left by another page go; those the new page has just set (observers run late) stay
  new MutationObserver(() => { if ($("next-why").dataset.mode !== (root.dataset.mode ?? "")) $("next-why").textContent = ""; }).observe(root, { attributes: true, attributeFilter: ["data-mode"] });
  root.dataset.home = "lobby";
  (await import("./keys.js")).install({ $ });   // Esc back, Enter next, W A S D, O settings, ? the list
  try { (await import("./guide.js")).init(api); } catch (e) { console.error("guide", e); }   // before the lobby's art is fetched: its line and the settings row need none
  try { await (await import("./lobby.js")).init(api); } catch (e) { console.error("lobby", e); }
  // Reopen an active calibration or the latest result that still needs attention.
  const calibrations=(backendState?.jobs||[]).filter(j=>j.action==='calibrate');
  const lastCalibration=calibrations.at(-1);
  const resume = backend.mock ? null : calibrations.find(j=>j.exit===null) ||
    (lastCalibration?.cancellation?.phase==='burn' ||
      (lastCalibration?.exit===0 && lastCalibration.result?.ok && !lastCalibration.result_seen && !lastCalibration.cancellation)
      ? lastCalibration : null);
  if (resume) {
    chosenDrive = resume.drive ?? chosenDrive;
    (await import("./calibrate.js")).attach(api, resume);
  }
  // what the drive holds, read once in the background (read-only, a second or two) so the footer can say it
  else refreshLobbyDisc();
  addEventListener("focus", refreshLobbyDisc);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshLobbyDisc(); });
  if (!backend.mock) setInterval(() => { if (document.hasFocus()) refreshLobbyDisc(); }, 30000);
  paintPending(); paintRecent();
  render(1, true);
  await (await import('./flow-navigation.js')).install(api, {setHome});
</script>
</body>
