<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>拍标靶盘 · disc-probe</title>
<style>
  /* Values follow the design reference "手机端：扫码后" (390 x 844): 24 px gutters, 26/34 title, 76 px shutter. */
  @font-face { font-family: "Archivo"; src: url(/fonts/Archivo-VF-latin.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  :root { color-scheme: light; --paper: #ebe7e0; --paper-2: #e4dfd7; --chip: #fbf9f3; --ink: #1a1a18; --muted: #625d55; --faint: #8a847a; --rule: #cfc8bc;
    --rule-strong: #a9a297; --copper: #a8693c; --good: #3f7d55; --warn: #9a6a14; --ease: cubic-bezier(.2, .8, .2, 1);
    --font: Archivo, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font); }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --paper: #161d1c; --paper-2: #1f2827; --chip: #ecebe4; --ink: #ecebe4; --muted: #aeb3ab; --faint: #7f8780; --rule: #2c3634;
      --rule-strong: #46514e; --copper: #d9a75c; --good: #8fca9a; --warn: #e2b866; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); padding: max(20px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) 0 max(24px, env(safe-area-inset-left)); }
  main { max-width: 480px; margin-inline: auto; padding-bottom: max(24px, env(safe-area-inset-bottom)); }
  p { margin: 8px 0; text-wrap: pretty; }
  /* top row: the collapsed wordmark, and whether this phone reaches the computer */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 26px; }
  .mark { font-style: italic; font-weight: 800; font-stretch: 125%; font-size: 26px; line-height: 1; letter-spacing: -1px; }
  .mark i { font-style: inherit; padding-right: 3px; background: linear-gradient(135deg, #7a5cff 10%, #e06bb0 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .link { display: flex; align-items: center; gap: 8px; font-size: 15px; text-align: right; }
  .link::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); flex: none; transition: background-color 200ms var(--ease); }
  .link[data-state="wait"]::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
  .link[data-state="bad"] { color: var(--warn); }
  .link[data-state="bad"]::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--warn); }
  h1 { margin: 16px 0 0; font-size: 26px; line-height: 34px; font-weight: 800; font-stretch: 118%; text-wrap: balance; }
  .lede { margin: 4px 0 0; color: var(--muted); }
  .run { margin: 4px 0 0; color: var(--faint); font-size: 14px; overflow-wrap: anywhere; }
  .run code { font: 13px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  /* a problem the person can fix: a thin line on the left, then the fix */
  .banner { border-left: 3px solid var(--warn); padding: 8px 0 8px 12px; margin: 16px 0 0; }
  .banner[hidden] { display: none; }
  .banner p { margin: 0; font-weight: 600; }
  .banner ul { margin: 6px 0; padding-left: 20px; color: var(--muted); }
  .banner button { margin-top: 6px; }
  /* the viewfinder: where the disc goes. Only the disc carries colour. */
  .finder { position: relative; margin: 16px 0 0; height: min(400px, 46vh); min-height: 240px; border-radius: 8px; overflow: hidden;
    background: radial-gradient(110% 90% at 26% 12%, #57514a 0%, #37332f 42%, #1f1d1b 100%); }
  .finder .guide { position: absolute; left: 50%; top: 47%; width: 78%; aspect-ratio: 1; max-height: 92%; transform: translate(-50%, -50%);
    border-radius: 50%; border: 2px dashed rgba(255, 255, 255, .85); }
  .finder .disc { position: absolute; left: 50%; top: 47%; width: 66%; aspect-ratio: 1; max-height: 78%; border-radius: 50%;
    transform: translate(-50%, -50%) rotate(-12deg) scaleY(.96); box-shadow: 0 10px 22px rgba(0, 0, 0, .5);
    background: radial-gradient(circle, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 40%, rgba(20,16,40,.10) 100%),
      conic-gradient(from 28deg, #c9c2d2 0%, #e7dbf0 6%, #a9cdea 11%, #b7e2c6 15%, #efe2a6 19%, #ecb9c6 24%, #cbc4d4 31%, #b6afc0 44%, #c9c2d2 52%,
        #d9d2e2 57%, #a6c3ec 62%, #bfe5cf 66%, #f1dfae 70%, #e7b8cf 75%, #c9c2d2 83%, #bdb6c7 92%, #c9c2d2 100%);
    -webkit-mask: radial-gradient(circle at center, transparent 0 6.4%, #000 6.7%); mask: radial-gradient(circle at center, transparent 0 6.4%, #000 6.7%); }
  .finder .hub { position: absolute; left: 50%; top: 47%; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .35); box-shadow: inset 0 0 0 9px rgba(255, 255, 255, .08); }
  /* Sized from the panel's shorter side, so the disc stays round when the phone is held sideways. */
  @supports (width: 1cqh) {
    .finder { container-type: size; }
    .finder .guide { width: min(78cqw, 86cqh); max-height: none; }
    .finder .disc { width: min(66cqw, 72cqh); max-height: none; }
    .finder .hub { width: min(22cqw, 24cqh); }
  }
  .finder .chip { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 6px 12px; border-radius: 8px;
    background: var(--chip); color: #1a1a18; font-size: 15px; white-space: nowrap; }
  /* one hand: album, shutter, what the shutter does. It stays at the bottom while the list scrolls. */
  .controls { position: sticky; bottom: 0; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 28px;
    margin: 0 -24px; padding: 20px 24px max(16px, env(safe-area-inset-bottom)); background: var(--paper); }
  .pick { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background-color 150ms var(--ease), transform 150ms var(--ease), opacity 150ms var(--ease); }
  .pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .pick.gallery { height: 48px; padding: 0 14px; gap: 8px; border: 1px solid var(--ink); border-radius: 4px; }
  .pick.gallery svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; }
  .pick.gallery:hover { background: var(--paper-2); }
  .pick.shutter { width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--ink); }
  .pick.shutter::after { content: ""; width: 58px; height: 58px; border-radius: 50%; background: var(--ink); transition: transform 150ms var(--ease); }
  .pick.shutter:hover::after { transform: scale(.94); }
  .pick:active { transform: translateY(1px); }
  .pick:focus-within { outline: 2px solid var(--copper); outline-offset: 4px; }
  .pick.disabled { opacity: .4; cursor: not-allowed; }
  .pick input:disabled { cursor: not-allowed; }
  .shutter-label { width: 92px; font-size: 15px; line-height: 20px; color: var(--muted); }
  /* the overall state: what is known now, and what to do */
  #overall { border-top: 1px solid var(--rule); padding: 16px 0 0; margin: 4px 0 0; }
  #overall[hidden] { display: none; }
  #overall b { font-size: 20px; line-height: 28px; display: block; }
  #overall[data-state="adopted"] b { color: var(--good); }
  #overall[data-state="provisional"] b, #overall[data-state="disagree"] b, #overall[data-state="refused"] b, #overall[data-state="split"] b { color: var(--warn); }
  #overall .sub { display: block; color: var(--muted); margin-top: 4px; }
  details.tips { border-top: 1px solid var(--rule); margin-top: 16px; }
  details.tips summary { min-height: 48px; display: flex; align-items: center; cursor: pointer; font-weight: 700; }
  details.tips ol { margin: 0 0 12px; padding-left: 22px; }
  details.tips li { margin: 6px 0; }
  .diagram { display: block; width: 100%; max-width: 360px; height: auto; margin: 0 auto 8px; color: var(--ink); }
  .diagram .thin { stroke: var(--faint); }
  .diagram text { fill: var(--muted); font-size: 12px; font-family: inherit; }
  /* photos, newest first */
  .photos-head { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--rule); margin-top: 16px; padding-top: 16px; }
  .photos-head h2 { margin: 0; font-size: 18px; }
  .photos-head span { color: var(--muted); font-size: 15px; }
  #sent { list-style: none; padding: 0; margin: 4px 0 0; display: grid; }
  #sent li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); transition: background-color 200ms var(--ease); }
  #sent li.fresh { background: var(--paper-2); }
  #sent li > :not(.thumb) { grid-column: 2; min-width: 0; }
  #sent .thumb { grid-column: 1; grid-row: 1 / span 4; width: 64px; height: 64px; border-radius: 2px; object-fit: cover; background: #37332f; display: block; }
  #sent .name { font-size: 13px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sent .act { font-weight: 700; }
  #sent [data-stage="ok"] .act { color: var(--good); }
  #sent [data-stage="retake"] .act, #sent [data-stage="failed"] .act, #sent [data-stage="outlier"] .act, #sent [data-stage="error"] .act { color: var(--warn); }
  #sent .why { margin: 0; font-size: 15px; }
  #sent .when { margin: 0; font-size: 13px; color: var(--muted); }
  #sent .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  progress { width: 100%; height: 6px; accent-color: var(--copper); }
  .empty { color: var(--muted); margin: 8px 0 0; }
  button { min-height: 44px; min-width: 44px; padding: 8px 14px; font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--ink); border-radius: 4px; cursor: pointer; transition: background-color 150ms var(--ease); }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--copper); outline-offset: 3px; }
  button:hover { background: var(--paper-2); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  ::selection { background: var(--ink); color: var(--paper); }
  footer { margin-top: 14px; color: var(--muted); font-size: 14px; line-height: 20px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  @media (max-height: 500px) and (min-width: 600px) { main { max-width: 720px; } .finder { height: 60vh; } }
</style>
<main>
  <div class="top"><span class="mark" role="img" aria-label="DP">D<i>P</i></span><span class="link" id="link" data-state="wait" role="status"></span></div>
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <p class="run" id="run"></p>
  <p class="run" id="disc" hidden></p>
  <div class="banner" id="problem" role="alert" hidden></div>
  <div class="finder" aria-hidden="true"><span class="guide"></span><span class="disc"></span><span class="hub"></span><span class="chip" id="chip"></span></div>
  <div class="controls">
    <label class="pick gallery"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="1.5"/><path d="m3.5 16 5-5 4 4 3-3 5 5"/><circle cx="15.5" cy="9" r="1.4"/></svg><span id="gallery-text"></span><input id="gallery" type="file" accept="image/*" multiple></label>
    <label class="pick shutter"><input id="camera" type="file" accept="image/*" capture="environment"></label>
    <span class="shutter-label" id="shutter-text" aria-hidden="true"></span>
  </div>
  <section id="overall" role="status" aria-live="polite" data-state="none"><b></b><span class="sub"></span></section>
  <details class="tips" id="tips" open>
    <summary id="tips-title"></summary>
    <svg class="diagram" viewBox="0 0 360 150" role="img" id="diagram">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path class="thin" d="M10 18h340M10 136h340"/>
        <path d="M40 18v10M28 28h24l-4 8H32z"/>
        <path class="thin" d="M40 40l14 14M40 40l0 18M40 40l-14 14" stroke-dasharray="3 4"/>
        <rect x="118" y="56" width="14" height="26" rx="2"/>
        <path class="thin" d="M134 66 L238 92M134 72 L300 112" stroke-dasharray="2 5"/>
        <path d="M232 120 L306 94" stroke-width="3"/>
        <path class="thin" d="M232 120h80M290 120a22 22 0 0 0-3-14"/>
      </g>
      <text x="14" y="76" id="d-lamp"></text><text x="102" y="102" id="d-phone"></text><text x="222" y="146" id="d-disc"></text>
    </svg>
    <ol id="tip-list"></ol>
  </details>
  <div class="photos-head"><h2 id="photos-title"></h2><span id="count"></span></div>
  <p class="empty" id="empty"></p>
  <ul id="sent" aria-live="polite"></ul>
  <footer id="foot"></footer>
</main>
<script type="application/json" id="config">__PHOTO_CONFIG__</script>
<script type="module">
  import { photoStage, adoptionWords, deskWords, shootingTips, seconds } from '/home/photowords.mjs';
  'use strict';
  const config = JSON.parse(document.getElementById('config').textContent);
  const $ = id => document.getElementById(id);
  const inputs = [...document.querySelectorAll('.pick input')];
  const endpoint = '/api/photos?run=' + encodeURIComponent(config.run);
  // One language, the phone's own: Chinese when it is set to Chinese, English otherwise.
  const lang = /^zh/i.test(navigator.language || 'zh') ? 'zh' : 'en';
  if (document.documentElement) document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  const w = p => (p && (p[lang] || p.zh)) || '';
  const both = (p, tag = 'span') => { const z = document.createElement(tag); z.textContent = w(p); return z; };
  const line = w;
  const say = (id, zh, en) => { const node = $(id); if (node) node.textContent = lang === 'zh' ? zh : en; };
  say('title', '拍标靶盘', 'Photograph the target disc');
  say('lede', '拍完自动发到电脑上的网页。', 'Each photo goes straight to the page on your computer.');
  say('chip', '把整张盘放进圈里', 'Fit the whole disc in the circle');
  say('gallery-text', '相册', 'Photos');
  say('shutter-text', '拍照并发送', 'Take and send');
  say('tips-title', '这样拍', 'How to shoot');
  say('d-lamp', '吸顶灯在身后', 'Lamp behind you'); say('d-phone', '手机', 'Phone'); say('d-disc', '盘朝你转 20–30°', 'Disc tilted 20–30°');
  say('photos-title', '照片', 'Photos');
  say('empty', '还没有照片。拍第一张吧。', 'No photos yet. Take the first one.');
  say('foot', '照片只发到你的电脑，不经过互联网。能不能用，要等电脑收到后读完才知道，不是拍照时当场判断的。拍完可以直接关掉这一页。',
    'Photos go only to your computer, never over the Internet. Whether one is usable is known after the computer reads it, not while you shoot. You can close this page when you are done.');
  $('camera').setAttribute('aria-label', lang === 'zh' ? '拍照并发送' : 'Take and send a photo');
  $('gallery').setAttribute('aria-label', lang === 'zh' ? '从相册选' : 'Choose from photos');
  $('diagram')?.setAttribute('aria-label', lang === 'zh' ? '吸顶灯在身后，手机拍整张盘，盘朝你倾斜 20 到 30 度' : 'Ceiling lamp behind you, phone on the whole disc, disc tilted 20–30° towards you');
  $('run').append(lang === 'zh' ? '这些照片只算到这次标定：' : 'These photos count only for this run: ', Object.assign(document.createElement('code'), {textContent: config.run}));
  for (const tip of shootingTips) $('tip-list').append(both(tip, 'li'));
  // This browser's sends, across reloads. The listing has every phone's photos; this page shows them all.
  // Keyed by run, not link: a rotated link (rescan) still knows which photos this phone sent.
  const storageKey = 'discprobe-phone-' + config.run;
  let mine;
  try { mine = new Set(JSON.parse(sessionStorage.getItem(storageKey) || '[]')); } catch { mine = new Set(); }
  if (mine.size) $('tips').open = false;
  const remember = () => { try { sessionStorage.setItem(storageKey, JSON.stringify([...mine])); } catch { /* private mode */ } };
  const thumbs = new Map();
  let listing = {photos: []}, pending = [], blocked = null, link = 'ok', polling = false, failures = 0, timer, lastSig = '', freshId = null;

  // ---- problems the person can recover from -------------------------------------------------------
  const PROBLEMS = {
    offline: {words: {zh: '手机没连上网络（Wi-Fi 断了或在用流量）。', en: 'The phone is off the network (Wi-Fi dropped, or on mobile data).'},
      steps: [{zh: '连回和电脑相同的 Wi-Fi。', en: 'Reconnect to the same Wi-Fi as the computer.'}, {zh: '没发出去的照片留在下面，连上后点“重新发送”。', en: 'Unsent photos stay below; tap “Send again” once connected.'}]},
    unreachable: {words: {zh: '连不上电脑。', en: 'Cannot reach the computer.'},
      steps: [{zh: '电脑上的 disc-probe 还开着吗？关了就重新打开，再扫新码。', en: 'Is disc-probe still running on the computer? If it was closed, start it and scan the new code.'},
        {zh: '手机和电脑连同一个 Wi-Fi，不要用访客网络。', en: 'Phone and computer on the same Wi-Fi, not a guest network.'},
        {zh: '电脑上有两个地址时，在电脑页面换另一个地址再扫。', en: 'If the computer page lists two addresses, pick the other one and scan again.'},
        {zh: '第一次用：Windows 防火墙可能拦住了，允许 Python 使用专用网络。', en: 'First time: Windows Firewall may block it; allow Python on private networks.'}]},
    expired: {words: {zh: '这个链接已经失效：电脑换了二维码、重新测量了，或程序重启过。', en: 'This link has expired: the computer made a new code, remeasured, or restarted.'},
      steps: [{zh: '在电脑的拍照页重新扫码。已发的照片还在电脑上。', en: 'Scan the code on the computer’s photo page again. Photos already sent are still there.'}]},
    gone: {words: {zh: '这次标定在电脑上找不到了（被删除或换了文件夹）。', en: 'This calibration is no longer on the computer (deleted or moved).'},
      steps: [{zh: '在电脑上重新打开标定，扫新的二维码。', en: 'Open the calibration on the computer again and scan the new code.'}]},
  };
  function showProblem(kind) {
    const box = $('problem');
    if (!kind) { box.hidden = true; box.replaceChildren(); return; }
    const p = PROBLEMS[kind];
    box.replaceChildren(both(p.words, 'p'));
    const list = document.createElement('ul'); for (const s of p.steps) list.append(both(s, 'li')); box.append(list);
    if (kind === 'offline' || kind === 'unreachable') {
      const retry = document.createElement('button'); retry.type = 'button'; retry.textContent = lang === 'zh' ? '重试' : 'Retry';
      retry.onclick = () => { failures = 0; poll(); }; box.append(retry);
    }
    box.hidden = false;
  }
  function problemFor(error) {
    if (!navigator.onLine) return 'offline';
    if (error.status === 403) return 'expired';
    if (error.status === 404) return 'gone';
    return 'unreachable';
  }

  // ---- reading the computer's state ----------------------------------------------------------------
  async function getJSON(url) {
    let res;
    try { res = await fetch(url, {headers: {'X-Photo-Token': config.token}, cache: 'no-store'}); }
    catch (e) { throw Object.assign(new Error('network'), {status: 0}); }
    let data = {};
    try { data = await res.json(); } catch { /* not JSON */ }
    if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), {status: res.status});
    return data;
  }
  let leaving = false;
  async function poll() {
    clearTimeout(timer);
    if (polling || leaving) return;
    polling = true;
    try {
      listing = await getJSON(endpoint);
      failures = 0; blocked = null; link = 'ok'; connected = true;
      render();
    } catch (error) {
      failures++;
      link = problemFor(error);
      if (link === 'expired' || link === 'gone') blocked = link;
      render();
    } finally {
      polling = false;
      // Back off while the computer cannot be reached; stop asking once the link is dead.
      if (!blocked && !leaving) timer = setTimeout(() => { if (!document.hidden) poll(); else timer = setTimeout(poll, 4000); }, failures ? Math.min(15000, 2000 * 2 ** Math.min(failures, 3)) : 2000);
    }
  }
  // Leaving the page (or the phone freezing it) stops polling; coming back from the back/forward cache resumes it.
  addEventListener('pagehide', () => { leaving = true; clearTimeout(timer); });
  addEventListener('pageshow', event => { if (event.persisted) { leaving = false; poll(); } });
  addEventListener('online', () => { failures = 0; poll(); });
  addEventListener('offline', () => { link = 'offline'; render(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !blocked) poll(); });

  // ---- drawing --------------------------------------------------------------------------------------
  // The top row's dot: whether this phone reaches the computer, said plainly.
  const LINK = {ok: ['已连上你的电脑', 'Connected to your computer'], offline: ['手机没联网', 'Phone is offline'],
    unreachable: ['连不上电脑', 'Cannot reach the computer'], expired: ['链接已失效', 'Link expired'], gone: ['标定已不在', 'Calibration gone']};
  let connected = false;
  function render() {
    showProblem(link === 'ok' ? null : link);
    const state = $('link');
    if (state) {
      const words = link === 'ok' ? (connected ? LINK.ok : ['正在连接电脑…', 'Connecting…']) : LINK[link];
      state.dataset.state = link === 'ok' ? (connected ? 'ok' : 'wait') : 'bad';
      state.textContent = lang === 'zh' ? words[0] : words[1];
    }
    const count = $('count');
    if (count) count.textContent = (listing.photos || []).length ? (lang === 'zh' ? `电脑已收到 ${listing.photos.length} 张` : `${listing.photos.length} on the computer`) : '';
    for (const input of inputs) { input.disabled = !!blocked; input.closest('.pick').classList.toggle('disabled', !!blocked); }
    const photos = listing.photos || [];
    const adoption = adoptionWords(listing.adoption || {}, photos);
    const desk = deskWords(listing);
    // The target disc the computer declared for these photos (photo --disc-id); set on the computer, shown here.
    const disc = $('disc'); disc.hidden = !listing.disc_id;
    if (listing.disc_id && disc.dataset.value !== listing.disc_id) { disc.dataset.value = listing.disc_id; disc.textContent = (lang === 'zh' ? '标靶盘：' : 'Target disc: ') + listing.disc_id; }
    const overall = $('overall');
    overall.dataset.state = adoption.state;
    overall.hidden = !!blocked;
    const sub = desk.state !== 'open' ? desk.words : adoption.body;
    const sig = JSON.stringify([adoption.title, sub, link]);
    if (sig !== lastSig) { lastSig = sig; const detail = both(sub, 'span'); detail.className = 'sub'; overall.replaceChildren(both(adoption.title, 'b'), detail); }
    const list = $('sent'), items = [];
    for (const p of pending) items.push(pendingItem(p));
    for (const photo of [...photos].reverse()) items.push(photoItem(photo));
    list.replaceChildren(...items);
    $('empty').hidden = items.length > 0;
  }
  function photoItem(photo) {
    const s = photoStage(photo, listing), li = document.createElement('li');
    li.dataset.stage = s.stage; li.dataset.id = photo.id;
    if (photo.id === freshId) li.classList.add('fresh');
    // One image element per photo for the page's life: polls redraw the words, never reload the picture.
    let img = thumbs.get(photo.id);
    if (!img) {
      img = document.createElement('img'); img.className = 'thumb'; img.alt = '';
      img.src = photo.url + '?token=' + encodeURIComponent(config.token);
      img.addEventListener('error', () => { img.style.visibility = 'hidden'; }, {once: true});
      thumbs.set(photo.id, img);
    }
    const name = document.createElement('span'); name.className = 'name'; name.textContent = (mine.has(photo.id) ? '' : lang === 'zh' ? '另一台设备 · ' : 'Another device · ') + photo.name;
    li.append(img, name, both(s.act, 'span'), both(s.why, 'p'));
    li.children[2].className = 'act'; li.children[3].className = 'why';
    if (s.when.zh) { const w = document.createElement('p'); w.className = 'when'; w.textContent = line(s.when); li.append(w); }
    if (s.stage === 'retake' || s.stage === 'failed' || s.stage === 'outlier') {
      const row = document.createElement('div'); row.className = 'row';
      const retake = document.createElement('button'); retake.type = 'button'; retake.textContent = lang === 'zh' ? '重拍' : 'Retake'; retake.disabled = !!blocked;
      retake.onclick = () => $('camera').click(); row.append(retake); li.append(row);
    }
    return li;
  }
  function pendingItem(p) {
    const li = document.createElement('li'); li.dataset.stage = p.state === 'failed' ? 'error' : p.state;
    const img = document.createElement('img'); img.className = 'thumb'; img.alt = ''; if (p.preview) img.src = p.preview;
    const name = document.createElement('span'); name.className = 'name'; name.textContent = p.name;
    const words = {
      preparing: [{zh: '准备中', en: 'Preparing'}, {zh: '正在把照片转成 JPEG。', en: 'Converting the photo to JPEG.'}],
      uploading: [{zh: '上传中', en: 'Uploading'}, {zh: `已发送 ${Math.round(p.progress * 100)}%${p.started ? '，用时 ' + seconds((Date.now() - p.started) / 1000).zh : ''}。`, en: `${Math.round(p.progress * 100)}% sent${p.started ? ', ' + seconds((Date.now() - p.started) / 1000).en : ''}.`}],
      failed: [{zh: '没发出去', en: 'Not sent'}, p.error],
      duplicate: [{zh: '已经发过', en: 'Already sent'}, {zh: '这张和之前发的一模一样，不用再发。转一下盘，拍一张新的。', en: 'This is identical to one already sent. Turn the disc and take a new one.'}],
    }[p.state];
    li.append(img, name, both(words[0], 'span'), both(words[1], 'p'));
    li.children[2].className = 'act'; li.children[3].className = 'why';
    if (p.state === 'uploading') { const bar = document.createElement('progress'); bar.max = 1; bar.value = p.progress; bar.setAttribute('aria-label', lang === 'zh' ? '上传进度' : 'Upload progress'); bar.style.gridColumn = '2'; li.append(bar); }
    if (p.state === 'failed' || p.state === 'duplicate') {
      const row = document.createElement('div'); row.className = 'row';
      if (p.state === 'failed') { const again = document.createElement('button'); again.type = 'button'; again.textContent = lang === 'zh' ? '重新发送' : 'Send again'; again.disabled = !!blocked || busy; again.onclick = () => send([p]); row.append(again); }
      const drop = document.createElement('button'); drop.type = 'button'; drop.textContent = lang === 'zh' ? (p.state === 'failed' ? '不发了' : '知道了') : (p.state === 'failed' ? 'Discard' : 'OK');
      drop.onclick = () => { forget(p); render(); }; row.append(drop); li.append(row);
    }
    return li;
  }
  function forget(p) { pending = pending.filter(x => x !== p); if (p.preview) URL.revokeObjectURL(p.preview); }

  // ---- sending --------------------------------------------------------------------------------------
  async function jpegPhoto(file) {
    let decoded, url, canvas;
    try {
      if (typeof createImageBitmap === 'function') {
        try {
          let orientationRead = false;
          decoded = await createImageBitmap(file, {get imageOrientation() { orientationRead = true; return 'from-image'; }});
          // Older implementations may ignore the orientation option entirely.
          if (!orientationRead) { decoded.close?.(); decoded = null; }
        } catch { decoded = null; }
      }
      if (!decoded) {
        url = URL.createObjectURL(file);
        decoded = await new Promise((resolve, reject) => {
          const img = new Image(); img.onload = () => resolve(img); img.onerror = reject; img.src = url;
        });
      }
      // Both decoders apply EXIF themselves. Never apply a second rotation.
      const width = decoded.naturalWidth || decoded.width, height = decoded.naturalHeight || decoded.height;
      if (!width || !height) throw new Error('Empty image');
      // 4095 squared is below even a 16,777,216-pixel canvas limit.
      const scale = Math.min(1, 4096 / Math.max(width, height), Math.sqrt(16769025 / (width * height)));
      canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.floor(width * scale)); canvas.height = Math.max(1, Math.floor(height * scale));
      canvas.getContext('2d').drawImage(decoded, 0, 0, canvas.width, canvas.height);
      let blob = typeof canvas.toBlob === 'function' ? await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', .95)) : null;
      if (!blob) {
        const data = canvas.toDataURL('image/jpeg', .95).split(',')[1], bytes = atob(data);
        blob = new Blob([Uint8Array.from(bytes, c => c.charCodeAt(0))], {type:'image/jpeg'});
      }
      if (blob.type !== 'image/jpeg') throw new Error('JPEG encoding unavailable');
      return {body:blob, type:'image/jpeg', name:file.name.replace(/\.[^.]*$/, '') + '.jpg'};
    } catch {
      const ext = file.name.split('.').pop().toLowerCase();
      return {body:file, type:file.type || ({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',heic:'image/heic',heif:'image/heic',webp:'image/webp'})[ext], name:file.name};
    } finally {
      decoded?.close?.();
      if (url) URL.revokeObjectURL(url);
      if (canvas) { canvas.width = 1; canvas.height = 1; }
    }
  }
  // XMLHttpRequest, not fetch: only it reports upload progress on every phone browser.
  function upload(p) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', endpoint);
      xhr.setRequestHeader('X-Photo-Token', config.token);
      xhr.setRequestHeader('Content-Type', p.type);
      xhr.setRequestHeader('X-Filename', encodeURIComponent(p.name));
      xhr.timeout = 120000;
      xhr.upload.onprogress = e => { if (e.lengthComputable) { p.progress = e.loaded / e.total; render(); } };
      xhr.onload = () => {
        let data = {}; try { data = JSON.parse(xhr.responseText); } catch { /* not JSON */ }
        if (xhr.status >= 200 && xhr.status < 300) resolve(data);
        else reject(Object.assign(new Error(data.error || xhr.statusText), {status: xhr.status, data}));
      };
      xhr.onerror = xhr.ontimeout = () => reject(Object.assign(new Error('network'), {status: 0}));
      xhr.send(p.body);
    });
  }
  function sendError(error) {
    if (error.status === 0) return navigator.onLine ? {zh: '连不上电脑，照片留在这里。连上后点“重新发送”。', en: 'Could not reach the computer; the photo is kept here. Tap “Send again” once connected.'}
      : {zh: '手机没联网，照片留在这里。连回 Wi-Fi 后点“重新发送”。', en: 'The phone is offline; the photo is kept here. Reconnect to Wi-Fi and tap “Send again”.'};
    if (error.status === 413) return {zh: '照片太大，电脑不收。在相册里导出较小的 JPEG 再发。', en: 'The photo is too large. Export a smaller JPEG and send that.'};
    if (error.status === 415) return {zh: '这种格式电脑读不了。请发 JPEG、PNG 或 WebP。', en: 'The computer cannot read this format. Send JPEG, PNG or WebP.'};
    if (error.status === 403) return {zh: '链接已失效。在电脑上重新扫码后再发。', en: 'The link has expired. Scan the computer’s code again, then send.'};
    return {zh: '电脑没收下这张：' + error.message, en: 'The computer did not accept it: ' + error.message};
  }
  let busy = false;
  async function send(items) {
    if (busy) return;
    busy = true;
    try {
      for (const p of items) {
        if (p.state === 'duplicate') continue;
        p.state = 'uploading'; p.progress = 0; p.started = Date.now(); render();
        try {
          const uploaded = await upload(p);
          mine.add(uploaded.id); remember(); forget(p); freshId = uploaded.id;
          setTimeout(() => { if (freshId === uploaded.id) { freshId = null; render(); } }, 2600);
          $('tips').open = false;
          await poll();
        } catch (error) {
          if (error.status === 409 && error.data?.code === 'duplicate_photo') { p.state = 'duplicate'; }
          else { p.state = 'failed'; p.error = sendError(error); if (error.status === 403) { blocked = link = 'expired'; } else if (error.status === 0) link = problemFor(error); }
          render();
        }
      }
    } finally { busy = false; render(); }
  }
  for (const input of inputs) input.addEventListener('change', async () => {
    const files = [...input.files]; input.value = '';
    if (!files.length || blocked) return;
    const batch = files.map(file => ({name: file.name || 'photo.jpg', state: 'preparing', progress: 0}));
    pending.unshift(...batch.slice().reverse()); render();
    for (const [i, file] of files.entries()) {
      const prepared = await jpegPhoto(file), p = batch[i];
      Object.assign(p, prepared);
      try { p.preview = URL.createObjectURL(prepared.body); } catch { /* no preview */ }
      if (!['image/jpeg', 'image/png', 'image/heic', 'image/webp'].includes(p.type)) { p.state = 'failed'; p.error = sendError({status: 415}); }
    }
    render();
    await send(batch.filter(p => p.state === 'preparing'));
  });
  setInterval(() => { if (pending.some(p => p.state === 'uploading')) render(); }, 1000);
  poll();
</script>
</html>
